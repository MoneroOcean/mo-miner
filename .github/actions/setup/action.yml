name: Set up MoM CI
description: Pinned Node.js plus optional locked npm packages, APT packages and install-dev.sh components.

inputs:
  npm:
    description: Run npm ci without lifecycle scripts
    default: "false"
  apt:
    description: Space-separated APT packages (Linux)
    default: ""
  dev:
    description: Comma-separated scripts/install-dev.sh components (Linux)
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24.15.0
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # install-dev.ps1 and the Windows native build pin Node.js at C:\Program Files\nodejs. Put
        # setup-node's copy there so CI never runs the Node MSI as an upgrade over the runner's
        # preinstalled Node (suspected in jobs that lost their runner during install-dev). A real
        # copy, not a junction: npm and the build resolve real paths.
        $pinned = 'C:\Program Files\nodejs'
        $source = Split-Path -Parent (Get-Command node -CommandType Application)[0].Source
        if ($source -ieq $pinned) { exit 0 }
        if (Test-Path -LiteralPath $pinned) { Move-Item -LiteralPath $pinned "$pinned-runner" }
        robocopy $source $pinned /E /NFL /NDL /NJH /NJS /NP | Out-Null
        if ($LASTEXITCODE -ge 8) { throw "Copying Node.js to $pinned failed: robocopy exit $LASTEXITCODE" }
        exit 0
    - if: inputs.apt != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt }}
      run: |
        # Per-request timeouts do not bound a stalled transfer, and an update that only "Ign"s a
        # mirror still exits 0 with an incomplete index, so bound and retry update+install together.
        sudo env PACKAGES="$PACKAGES" pwsh -NoProfile -File scripts/ci/retry.ps1 -Minutes 15 -- bash -c \
          'o="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
           apt-get $o update -qq && apt-get $o install --yes --no-install-recommends $PACKAGES'
    - if: inputs.dev != ''
      shell: bash
      env:
        COMPONENTS: ${{ inputs.dev }}
      run: >-
        sudo env MOM_DEV_WORKSPACE="/var/tmp/mom-dev-ci" pwsh -NoProfile -File scripts/ci/retry.ps1
        -Minutes 30 -- bash scripts/install-dev.sh --component "$COMPONENTS" --jobs 4
    - if: inputs.npm == 'true'
      shell: bash
      run: pwsh -NoProfile -File scripts/ci/retry.ps1 -- npm ci --ignore-scripts --no-audit --no-fund
