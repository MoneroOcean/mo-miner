        test "$(/opt/intel/oneapi/compiler/2026.2/bin/icx-cl --version | grep -c 2026.2)" -gt 0
        node scripts/ci/windows-application.js build
        while IFS='=' read -r key value; do export "${key^^}=$value"; done < "$GITHUB_OUTPUT"
        node scripts/ci/windows-application.js seal

  windows-runtime:
    needs: windows-application
    uses: ./.github/workflows/test-native-release.yml
    with:
      platform: win32
      expected_sha256: ${{ fromJSON(needs.windows-application.outputs.json).executable_sha256 }}

  windows-pack:
    needs: windows-application
    uses: ./.github/workflows/pack-native-application.yml
    with:
      platform: win32
      executable_sha256: ${{ fromJSON(needs.windows-application.outputs.json).executable_sha256 }}
      build_handoff_bundle_sha256: ${{ fromJSON(needs.windows-application.outputs.json).build_handoff_bundle_sha256 }}
      build_handoff_sha256: ${{ fromJSON(needs.windows-application.outputs.json).build_handoff_sha256 }}

  windows-packed-runtime:
    needs: windows-pack
    uses: ./.github/workflows/test-native-release.yml
    with:
      platform: win32
      variant: packed
      expected_sha256: ${{ needs.windows-pack.outputs.executable_sha256 }}

  package-linux:
    needs: [source, engineering, linux-jit-runtime, linux-application, linux-runtime, linux-pack, linux-packed-runtime, windows-application, windows-runtime, windows-pack, windows-packed-runtime]
    uses: ./.github/workflows/package-native-application.yml
    with:
      platform: linux
      packed_build_bundle_sha256: ${{ needs.linux-pack.outputs.build_bundle_sha256 }}
      raw_executable_sha256: ${{ fromJSON(needs.linux-application.outputs.json).sha256 }}
      original_build_bundle_sha256: ${{ fromJSON(needs.linux-application.outputs.json).build_handoff_bundle_sha256 }}
      original_handoff_sha256: ${{ fromJSON(needs.linux-application.outputs.json).build_handoff_sha256 }}

  package-windows:
    needs: [source, engineering, linux-jit-runtime, linux-application, linux-runtime, linux-pack, linux-packed-runtime, windows-application, windows-runtime, windows-pack, windows-packed-runtime]
    uses: ./.github/workflows/package-native-application.yml
    with:
      platform: win32
      packed_build_bundle_sha256: ${{ needs.windows-pack.outputs.build_bundle_sha256 }}
      raw_executable_sha256: ${{ fromJSON(needs.windows-application.outputs.json).executable_sha256 }}
      original_build_bundle_sha256: ${{ fromJSON(needs.windows-application.outputs.json).build_handoff_bundle_sha256 }}
      original_handoff_sha256: ${{ fromJSON(needs.windows-application.outputs.json).build_handoff_sha256 }}
