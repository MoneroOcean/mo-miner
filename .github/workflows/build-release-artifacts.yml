    uses: ./.github/workflows/native-job.yml
    with:
      name: windows-application
      npm: true
      apt: 7zip msitools unzip
      dev: oneapi
      download: >-
        native-windows-core-@.tar
        native-windows-dpcpp-static-@.tar
        native-windows-host-component-@.tar
        native-windows-controller-io-@.tar
        native-windows-controller-hermes-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-llvm-tools-@.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-sdk-state-@-sources.tar
        native-rocm-hip-headers-@.tar
        native-linux-cuda-images-@.tar
        native-windows-gpu-oneapi-@.tar
        native-windows-gpu-dpcpp-@.tar
        native-windows-gpu-dpcpp-opencl-@.tar
        native-windows-gpu-acpp-cuda-@.tar
        native-windows-gpu-acpp-hip-@.tar
      upload: >-
        native-windows-executable-@=native-windows-application-output-@/mom.exe
