  # Windows: MSVC Core and controller SDKs on Windows runners; everything else cross-builds on Linux.
  windows-core:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      MOM_BUILD_JOBS: "4"
      MOM_NATIVE_CI_SUFFIX: ci
    outputs:
      bundle_sha256: ${{ steps.stage.outputs.bundle_sha256 }}
      handoff_sha256: ${{ steps.stage.outputs.handoff_sha256 }}
    steps:
      - shell: pwsh
        run: '"MOM_NATIVE_WINDOWS_CORE_DEADLINE_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 3300)" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: cmd
        run: scripts\install-dev.bat -Component base,node,oneapi -Jobs 4
      - id: stage
        shell: pwsh
        run: scripts/ci/prepare-native-windows-ci.ps1 -Role core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/native-windows-core-${{ env.MOM_NATIVE_CI_SUFFIX }}.tar
          archive: false
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  windows-controller:
    needs: hermes-sources
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [io, hermes]
    env:
      MOM_BUILD_JOBS: "4"
      MOM_NATIVE_CI_SUFFIX: ci
    # Matrix legs write disjoint io_* / hermes_* keys, which GitHub combines.
    outputs:
      io_bundle_sha256: ${{ steps.stage.outputs.io_bundle_sha256 }}
      io_handoff_sha256: ${{ steps.stage.outputs.io_handoff_sha256 }}
      hermes_bundle_sha256: ${{ steps.stage.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ steps.stage.outputs.hermes_handoff_sha256 }}
    steps:
      - shell: pwsh
        run: '"MOM_NATIVE_WINDOWS_CONTROLLER_DEADLINE_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 3300)" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: pwsh
        run: '& scripts/install-dev.ps1 -Component $(if ("${{ matrix.role }}" -eq "io") { "base,node,oneapi,perl" } else { "base,node,oneapi" }) -Jobs 4'
      - if: matrix.role == 'hermes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-hermes-state-${{ env.MOM_NATIVE_CI_SUFFIX }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - id: stage
        shell: pwsh
        env:
          MOM_NATIVE_WINDOWS_CONTROLLER_IO_DIR: ${{ runner.temp }}/mom-native-windows-controller-io-${{ env.MOM_NATIVE_CI_SUFFIX }}
          MOM_NATIVE_WINDOWS_CONTROLLER_HERMES_DIR: ${{ runner.temp }}/mom-native-windows-controller-hermes-${{ env.MOM_NATIVE_CI_SUFFIX }}
        run: scripts/ci/prepare-native-windows-ci.ps1 -Role ${{ matrix.role }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/native-windows-controller-${{ matrix.role }}-${{ env.MOM_NATIVE_CI_SUFFIX }}.tar
          archive: false
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3

