name: Build and test release archives

on:
  workflow_call:
    outputs:
      linux_archive_artifact_name:
        description: Exact package artifact produced after the complete Linux native runtime gate
        value: ${{ jobs.package-linux.outputs.archive_artifact_name }}
      linux_archive_sha256:
        description: SHA-256 of the exact Linux archive admitted by package-native-application
        value: ${{ jobs.package-linux.outputs.archive_sha256 }}
      windows_archive_artifact_name:
        description: Exact package artifact produced after the complete Windows native runtime gate
        value: ${{ jobs.package-windows.outputs.archive_artifact_name }}
      windows_archive_sha256:
        description: SHA-256 of the exact Windows archive admitted by package-native-application
        value: ${{ jobs.package-windows.outputs.archive_sha256 }}

permissions:
  actions: read
  contents: read

env:
  MOM_PORTABLE_BUILD: "1"
  # Hosted x64 runners expose two effective build cores. Keep nested node-gyp/LLVM work inside that
  # budget so compiler jobs do not lose time to oversubscription.
  MOM_BUILD_JOBS: "2"
  ONEAPI_ROOT: C:/Program Files (x86)/Intel/oneAPI

# The native reusable workflow owns target builds and the complete raw + packed CPU runtime gate.
# These source checks remain independent required gates; package jobs wait for the successful whole call.
jobs:
  engineering-hash:
    name: Engineering / CPU and portable SYCL hashing
    uses: ./.github/workflows/test-engineering.yml

  source-quality:
    name: Source / lint and logic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0

      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$version." >&2
            exit 1
          fi

      - name: Validate workflows and shell syntax
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.yml
          git ls-files -z -- '*.sh' | xargs -0 -n1 bash -n
          fake_icx="$(mktemp)"
          printf '#!/usr/bin/env sh\nprintf "Intel(R) oneAPI DPC++/C++ Compiler\\n"\n' >"$fake_icx"
          chmod +x "$fake_icx"
          test "$(MOM_PORTABLE_BUILD=1 CXX="$fake_icx" scripts/cpu-cflags.sh)" = \
            "-march=x86-64 -mtune=generic -maes"
          rm -f "$fake_icx"

      - name: Install JavaScript tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build patchelf libboost-dev libuv1-dev libssl-dev strace unzip
          npm ci --ignore-scripts

      - name: Run real CMake archive reproducibility regression
        shell: bash
        run: |
          set -euo pipefail
          cmake_path="$(command -v cmake || true)"
          if [[ -z "$cmake_path" ]]; then
            echo "CMake is required for the real archive reproducibility regression." >&2
            exit 1
          fi
          MOM_TEST_CMAKE="$cmake_path" node --test tests/native_release_archive.js

      - name: Test offline source gate
        run: npm test -- host

  windows-script-quality:
    name: Source / Windows scripts
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0

      - name: Install JavaScript tooling
        shell: powershell
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native Windows source gate
        shell: powershell
        run: |
          .github\workflows\scripts\test-powershell-syntax.ps1
          . scripts\import-vcvars.ps1
          Import-MomVcVars64
          # source-quality owns lint/typecheck; keep the platform-specific logic run here.
          node tests/run_hash.js logic
          $logicExit = $LASTEXITCODE
          node --test tests/windows_script_safety.js
          $safetyExit = $LASTEXITCODE
          Write-Host "Source gate results: logic=$logicExit safety=$safetyExit"
          if ($logicExit -ne 0 -or $safetyExit -ne 0) { exit 1 }

  build-native-prerequisites:
    name: Build, pack, and runtime-check Linux and Windows candidates
    # Source checks consume no SDK output; overlap them with the cold build, but
    # require both before either archive can be packaged.
    uses: ./.github/workflows/build-native-prerequisites.yml

  package-linux:
    name: Package admitted Linux candidate
    needs: [build-native-prerequisites, engineering-hash, source-quality, windows-script-quality]
    uses: ./.github/workflows/package-native-application.yml
    with:
      platform: linux
      packed_build_bundle_sha256: ${{ needs.build-native-prerequisites.outputs.linux_packing_bundle_sha256 }}
      raw_executable_sha256: ${{ needs.build-native-prerequisites.outputs.linux_raw_executable_sha256 }}
      original_build_bundle_sha256: ${{ needs.build-native-prerequisites.outputs.linux_application_build_bundle_sha256 }}
      original_handoff_sha256: ${{ needs.build-native-prerequisites.outputs.linux_application_handoff_sha256 }}

  package-windows:
    name: Package admitted Windows candidate
    needs: [build-native-prerequisites, engineering-hash, source-quality, windows-script-quality]
    uses: ./.github/workflows/package-native-application.yml
    with:
      platform: win32
      packed_build_bundle_sha256: ${{ needs.build-native-prerequisites.outputs.windows_packing_bundle_sha256 }}
      raw_executable_sha256: ${{ needs.build-native-prerequisites.outputs.windows_raw_executable_sha256 }}
      original_build_bundle_sha256: ${{ needs.build-native-prerequisites.outputs.windows_application_build_bundle_sha256 }}
      original_handoff_sha256: ${{ needs.build-native-prerequisites.outputs.windows_application_handoff_sha256 }}
