        MOM_NATIVE_WINDOWS_APPLICATION_HOST_COMPONENT_BUNDLE_SHA256=${{ fromJSON(needs.windows-host.outputs.json).bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_HOST_COMPONENT_MANIFEST_SHA256=${{ fromJSON(needs.windows-host.outputs.json).manifest_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_IO_BUNDLE_SHA256=${{ needs.windows-controller.outputs.io_bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_IO_HANDOFF_SHA256=${{ needs.windows-controller.outputs.io_handoff_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_HERMES_BUNDLE_SHA256=${{ needs.windows-controller.outputs.hermes_bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_HERMES_HANDOFF_SHA256=${{ needs.windows-controller.outputs.hermes_handoff_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_LINUX_TOOLS_BUNDLE_SHA256=${{ fromJSON(needs.linux-llvm.outputs.json).tools_bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_LINUX_TOOLS_HANDOFF_SHA256=${{ fromJSON(needs.linux-llvm.outputs.json).tools_handoff_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_LINUX_HERMES_BUNDLE_SHA256=${{ fromJSON(needs.hermes-sdk.outputs.json).bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_INPUTS_BUNDLE_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_INPUTS_MANIFEST_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).manifest_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_LINUX_SOURCES_BUNDLE_SHA256=${{ fromJSON(needs.linux-sources.outputs.json).bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_HIP_HEADERS_BUNDLE_SHA256=${{ fromJSON(needs.rocm-comgr.outputs.json).bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_HIP_HEADERS_HANDOFF_SHA256=${{ fromJSON(needs.rocm-comgr.outputs.json).handoff_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_CUDA_IMAGES_BUNDLE_SHA256=${{ fromJSON(needs.cuda-images.outputs.json).bundle_sha256 }}
        MOM_NATIVE_WINDOWS_APPLICATION_GPU_HANDOFFS_JSON=[{"profile":"oneapi","bundleSha256":"${{ fromJSON(needs.windows-gpu-oneapi.outputs.json).windows_gpu_bundle_sha256 }}","receiptSha256":"${{ fromJSON(needs.windows-gpu-oneapi.outputs.json).windows_gpu_result_sha256 }}","configSha256":"${{ fromJSON(needs.windows-gpu-oneapi.outputs.json).windows_gpu_config_sha256 }}","handoffSha256":"${{ fromJSON(needs.windows-gpu-oneapi.outputs.json).windows_gpu_handoff_sha256 }}"},{"profile":"dpcpp","bundleSha256":"${{ fromJSON(needs.windows-gpu-dpcpp.outputs.json).windows_gpu_bundle_sha256 }}","receiptSha256":"${{ fromJSON(needs.windows-gpu-dpcpp.outputs.json).windows_gpu_result_sha256 }}","configSha256":"${{ fromJSON(needs.windows-gpu-dpcpp.outputs.json).windows_gpu_config_sha256 }}","handoffSha256":"${{ fromJSON(needs.windows-gpu-dpcpp.outputs.json).windows_gpu_handoff_sha256 }}"},{"profile":"dpcpp-opencl","bundleSha256":"${{ fromJSON(needs.windows-gpu-dpcpp-opencl.outputs.json).windows_gpu_bundle_sha256 }}","receiptSha256":"${{ fromJSON(needs.windows-gpu-dpcpp-opencl.outputs.json).windows_gpu_result_sha256 }}","configSha256":"${{ fromJSON(needs.windows-gpu-dpcpp-opencl.outputs.json).windows_gpu_config_sha256 }}","handoffSha256":"${{ fromJSON(needs.windows-gpu-dpcpp-opencl.outputs.json).windows_gpu_handoff_sha256 }}"},{"profile":"acpp-cuda","bundleSha256":"${{ fromJSON(needs.windows-gpu-acpp-cuda.outputs.json).windows_gpu_bundle_sha256 }}","receiptSha256":"${{ fromJSON(needs.windows-gpu-acpp-cuda.outputs.json).windows_gpu_result_sha256 }}","configSha256":"${{ fromJSON(needs.windows-gpu-acpp-cuda.outputs.json).windows_gpu_config_sha256 }}","handoffSha256":"${{ fromJSON(needs.windows-gpu-acpp-cuda.outputs.json).windows_gpu_handoff_sha256 }}"},{"profile":"acpp-hip","bundleSha256":"${{ fromJSON(needs.windows-gpu-acpp-hip.outputs.json).windows_gpu_bundle_sha256 }}","receiptSha256":"${{ fromJSON(needs.windows-gpu-acpp-hip.outputs.json).windows_gpu_result_sha256 }}","configSha256":"${{ fromJSON(needs.windows-gpu-acpp-hip.outputs.json).windows_gpu_config_sha256 }}","handoffSha256":"${{ fromJSON(needs.windows-gpu-acpp-hip.outputs.json).windows_gpu_handoff_sha256 }}"}]
      run: |
