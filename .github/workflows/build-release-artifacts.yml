name: Build and test release archives

# Complete cold native build: source gates, Engineering hashing, Linux and Windows SDK producers,
# applications, raw and packed runtime lanes, then two audited packages. Producer jobs use native-job.yml;
# "@" in artifact lists stands for the fixed work-root suffix MOM_NATIVE_CI_SUFFIX ("ci"), so "Re-run failed
# jobs" finds the artifacts of earlier attempts. Pins always come from producer job outputs.
on:
  workflow_call:
    outputs:
      linux_archive_artifact_name:
        value: ${{ jobs.package-linux.outputs.archive_artifact_name }}
      linux_archive_sha256:
        value: ${{ jobs.package-linux.outputs.archive_sha256 }}
      windows_archive_artifact_name:
        value: ${{ jobs.package-windows.outputs.archive_artifact_name }}
      windows_archive_sha256:
        value: ${{ jobs.package-windows.outputs.archive_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  source:
    uses: ./.github/workflows/source-gates.yml

  engineering:
    uses: ./.github/workflows/test-engineering.yml

  # Pinned source fetches and target headers.
  linux-sources:
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-sources
      timeout: 30
      upload: >-
        native-linux-sdk-state-@-sources.tar
      run: node scripts/run-native-ci.js stage linux-sources

  llvm-sources:
    uses: ./.github/workflows/native-job.yml
    with:
      name: llvm-sources
      upload: >-
        native-llvm21-state-@-sources.tar
      run: node scripts/run-native-ci.js stage sources

  hermes-sources:
    uses: ./.github/workflows/native-job.yml
    with:
      name: hermes-sources
      timeout: 30
      upload: >-
        native-hermes-state-@-sources.tar
      run: node scripts/run-native-ci.js stage hermes-sources

  acpp-sources:
    uses: ./.github/workflows/native-job.yml
    with:
      name: acpp-sources
      timeout: 30
      upload: >-
        native-acpp-state-@-sources.tar
      run: |
        node scripts/run-native-ci.js stage acpp-sources
        s="$MOM_NATIVE_CI_SUFFIX"
        node scripts/ci/seal.js bundle_sha256="$RUNNER_TEMP/native-acpp-state-$s-sources.tar"

  zstd-sources:
    uses: ./.github/workflows/native-job.yml
    with:
      name: zstd-sources
      timeout: 30
      upload: >-
        native-zstd-state-@-sources.tar
      run: node scripts/run-native-ci.js stage zstd-sources

  rocm-sources:
    uses: ./.github/workflows/native-job.yml
    with:
      name: rocm-sources
      timeout: 30
      upload: >-
        native-rocm-state-@-sources.tar
      run: |
        node scripts/run-native-ci.js stage rocm-sources
        s="$MOM_NATIVE_CI_SUFFIX"
        node scripts/ci/seal.js bundle_sha256="$RUNNER_TEMP/native-rocm-state-$s-sources.tar"

  gnu-headers-linux:
    uses: ./.github/workflows/native-job.yml
    with:
      name: gnu-headers-linux
      timeout: 30
      apt: libstdc++-13-dev libc6-dev linux-libc-dev
      upload: >-
        native-linux-gnu-headers-@.tar
      run: node scripts/run-native-ci.js stage gnu-headers

  gnu-headers-windows:
    uses: ./.github/workflows/native-job.yml
    with:
      name: gnu-headers-windows
      timeout: 30
      apt: mingw-w64-common mingw-w64-x86-64-dev g++-mingw-w64-x86-64-posix
      upload: >-
        native-windows-gnu-headers-@.tar
      run: |
        node scripts/run-native-ci.js stage windows-gnu-headers
        s="$MOM_NATIVE_CI_SUFFIX"
        root="$MOM_NATIVE_WINDOWS_GNU_HEADERS_DIR"
        node scripts/ci/seal.js windows_bundle_sha256="$RUNNER_TEMP/native-windows-gnu-headers-$s.tar" \
          windows_result_sha256="$root/result.json" windows_copyrights_sha256="$root/copyrights.json"


  # Linux SDK producers.
  dpcpp-cuda-inputs:
    needs: [linux-sources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: dpcpp-cuda-inputs
      download: >-
        native-linux-sdk-state-@-sources.tar
      upload: >-
        native-linux-dpcpp-cuda-inputs-@.tar
      pins: |
        MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256=${{ fromJSON(needs.linux-sources.outputs.json).bundle_sha256 }}
      run: node scripts/run-native-ci.js stage dpcpp-cuda-inputs

  cuda-images:
    needs: [linux-sources, dpcpp-cuda-inputs]
    uses: ./.github/workflows/native-job.yml
    with:
      name: cuda-images
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
      upload: >-
        native-linux-cuda-images-@.tar
      pins: |
        MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256=${{ fromJSON(needs.linux-sources.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).manifest_sha256 }}
      run: |
        node scripts/ci/linux-sdk.js cuda-images-sources
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage cuda-images-linux
        s="$MOM_NATIVE_CI_SUFFIX"
        node scripts/ci/seal.js bundle_sha256="$RUNNER_TEMP/native-linux-cuda-images-$s.tar"

  linux-llvm:
    needs: [llvm-sources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-llvm
      timeout: 330
      dev: oneapi
      cache: linux-llvm
      download: >-
        native-llvm21-state-@-sources.tar
      upload: >-
        native-linux-llvm21-sdk-@.tar
        native-linux-llvm21-installed-sdk-@.tar
        native-linux-llvm-tools-@.tar
        native-linux-llvm-acpp-frontend-@.tar
      run: |
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-llvm
        s="$MOM_NATIVE_CI_SUFFIX"
        node scripts/ci/seal.js sdk_bundle_sha256="$RUNNER_TEMP/native-linux-llvm21-sdk-$s.tar"
        node scripts/run-native-ci.js stage linux-llvm-installed-sdk
        node scripts/run-native-ci.js stage linux-llvm-tools
        node scripts/ci/linux-sdk.js acpp-frontend

  io-openssl:
    needs: [llvm-sources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: io-openssl
      download: >-
        native-llvm21-state-@-sources.tar
      upload: >-
        native-linux-io-openssl-sdk-@.tar
      run: MOM_NATIVE_IO_OPENSSL_DEADLINE_EPOCH=$((MOM_CI_DEADLINE_EPOCH - 300)) scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage io-openssl

  openmp-sdk:
    needs: [llvm-sources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: openmp-sdk
      download: >-
        native-llvm21-state-@-sources.tar
      upload: >-
        native-linux-openmp-sdk-@.tar
      run: scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage openmp-sdk

  zstd-sdk:
    needs: [zstd-sources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: zstd-sdk
      download: >-
        native-zstd-state-@-sources.tar
      upload: >-
        native-linux-zstd-sdk-@.tar
      run: scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage zstd-sdk

  hermes-sdk:
    needs: [hermes-sources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: hermes-sdk
      download: >-
        native-hermes-state-@-sources.tar
      upload: >-
        native-linux-hermes-sdk-@.tar
      run: |
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage hermes-sdk
        s="$MOM_NATIVE_CI_SUFFIX"
        node scripts/ci/seal.js bundle_sha256="$RUNNER_TEMP/native-linux-hermes-sdk-$s.tar"

  rocm-comgr:
    needs: [rocm-sources, llvm-sources, linux-llvm]
    uses: ./.github/workflows/native-job.yml
    with:
      name: rocm-comgr
      download: >-
        native-rocm-state-@-sources.tar
        native-llvm21-state-@-sources.tar
        native-linux-llvm21-installed-sdk-@.tar
      upload: >-
        native-linux-rocm-comgr-sdk-@.tar
        native-rocm-hip-headers-@.tar
      pins: |
        MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256=${{ fromJSON(needs.linux-llvm.outputs.json).llvm_sdk_handoff_sha256 }}
      run: |
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage rocm-comgr-sdk
        node scripts/ci/linux-sdk.js rocm-hip-headers

  rocm-host:
    needs: [rocm-comgr, linux-llvm]
    uses: ./.github/workflows/native-job.yml
    with:
      name: rocm-host
      download: >-
        native-linux-rocm-comgr-sdk-@.tar
      upload: >-
        native-linux-rocm-host-sdk-@.tar
      pins: |
        MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256=${{ fromJSON(needs.linux-llvm.outputs.json).llvm_sdk_handoff_sha256 }}
      run: scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage rocm-host-sdk

  acpp-sdk:
    needs: [acpp-sources, openmp-sdk, rocm-host, dpcpp-cuda-inputs, linux-llvm]
    uses: ./.github/workflows/native-job.yml
    with:
      name: acpp-sdk
      download: >-
        native-acpp-state-@-sources.tar
        native-linux-openmp-sdk-@.tar
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-rocm-host-sdk-@.tar
      upload: >-
        native-linux-acpp-cuda-hip-sdk-@.tar
      pins: |
        MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256=${{ fromJSON(needs.linux-llvm.outputs.json).llvm_sdk_handoff_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).manifest_sha256 }}
      run: |
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage acpp-cuda-hip-sdk
        s="$MOM_NATIVE_CI_SUFFIX"
        node scripts/ci/seal.js bundle_sha256="$RUNNER_TEMP/native-linux-acpp-cuda-hip-sdk-$s.tar"


  # Linux source-JIT: resources, then configure..link, proof fixture and static DPC++ in one job.
  linux-jit-resources:
    needs: [linux-sources, dpcpp-cuda-inputs, gnu-headers-linux]
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-jit-resources
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
      upload: >-
        native-linux-jit-resources-@.tar
      pins: |
        MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).manifest_sha256 }}
      run: |
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-jit-resources
        node scripts/ci/linux-sdk.js linux-jit-resources-seal

  linux-jit:
    needs: [dpcpp-cuda-inputs, linux-jit-resources]
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-jit
      timeout: 330
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-jit-resources-@.tar
      upload: >-
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-linux-jit-runtime-proof-@.tar
      pins: |
        MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).manifest_sha256 }}
      run: scripts/run-bounded-native-ci.sh node scripts/ci/linux-jit.js

  linux-jit-runtime:
    needs: [linux-jit]
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-jit-runtime
      timeout: 30
      download: >-
        native-linux-jit-runtime-proof-@.tar
      diagnostics: native-linux-jit-runtime-failure-@=native-linux-jit-runtime-failure-@.tar
      pins: |
        MOM_NATIVE_LINUX_JIT_RUNTIME_PROOF_SHA256=${{ fromJSON(needs.linux-jit.outputs.json).proof_sha256 }}
        MOM_NATIVE_LINUX_JIT_RUNTIME_RESULT_SHA256=${{ fromJSON(needs.linux-jit.outputs.json).result_sha256 }}
        MOM_NATIVE_LINUX_JIT_RUNTIME_BUNDLE_SHA256=${{ fromJSON(needs.linux-jit.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_JIT_RUNTIME_BUNDLE_BYTES=${{ fromJSON(needs.linux-jit.outputs.json).bundle_bytes }}
      run: |
        node scripts/run-native-ci.js stage linux-jit-runtime-admit
        export MOM_NATIVE_JIT_RUNTIME_FIXTURE="$(sed -n 's/^fixture_path=//p' "$GITHUB_OUTPUT")"
        export MOM_NATIVE_JIT_RUNTIME_EXPECTED_SHA256="$MOM_NATIVE_LINUX_JIT_RUNTIME_PROOF_SHA256"
        scripts/ci/linux-jit-runtime.sh run || { scripts/ci/linux-jit-runtime.sh bundle-evidence; exit 1; }


  # Linux application: descriptor, Core and five GPU factories, assembly, runtime, packing.
  linux-descriptor:
    needs: [linux-llvm, linux-sources, dpcpp-cuda-inputs, cuda-images, linux-jit, acpp-sources, acpp-sdk, hermes-sdk, rocm-host, openmp-sdk, zstd-sdk, io-openssl, gnu-headers-linux]
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-descriptor
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
      upload: >-
        native-linux-sdk-descriptor-@.tar
      pins: |
        MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256=${{ fromJSON(needs.linux-llvm.outputs.json).llvm_sdk_handoff_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).bundle_sha256 }}
        MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256=${{ fromJSON(needs.dpcpp-cuda-inputs.outputs.json).manifest_sha256 }}
      run: node scripts/run-native-ci.js stage linux-sdk-descriptor

  component-core:
    needs: [linux-descriptor]
    uses: ./.github/workflows/native-job.yml
    with:
      name: component-core
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
        native-linux-sdk-descriptor-@.tar
      upload: >-
        native-linux-component-core-@.tar
      diagnostics: native-linux-component-core-diagnostics-@=/tmp/mom-native-linux-component-core-@/logs
      run: |
        export NATIVE_PROFILE=core MOM_NATIVE_COMPONENT_DEADLINE_EPOCH="$MOM_CI_DEADLINE_EPOCH"
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
        node scripts/ci/linux-application.js component-seal

  component-acpp-cuda:
    needs: [linux-descriptor]
    uses: ./.github/workflows/native-job.yml
    with:
      name: component-acpp-cuda
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
        native-linux-sdk-descriptor-@.tar
      upload: >-
        native-linux-component-acpp-cuda-@.tar
      diagnostics: native-linux-component-acpp-cuda-diagnostics-@=/tmp/mom-native-linux-component-acpp-cuda-@/logs
      run: |
        export NATIVE_PROFILE=acpp-cuda MOM_NATIVE_COMPONENT_DEADLINE_EPOCH="$MOM_CI_DEADLINE_EPOCH"
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
        node scripts/ci/linux-application.js component-seal

  component-acpp-hip:
    needs: [linux-descriptor]
    uses: ./.github/workflows/native-job.yml
    with:
      name: component-acpp-hip
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
        native-linux-sdk-descriptor-@.tar
      upload: >-
        native-linux-component-acpp-hip-@.tar
      diagnostics: native-linux-component-acpp-hip-diagnostics-@=/tmp/mom-native-linux-component-acpp-hip-@/logs
      run: |
        export NATIVE_PROFILE=acpp-hip MOM_NATIVE_COMPONENT_DEADLINE_EPOCH="$MOM_CI_DEADLINE_EPOCH"
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
        node scripts/ci/linux-application.js component-seal

  component-dpcpp:
    needs: [linux-descriptor]
    uses: ./.github/workflows/native-job.yml
    with:
      name: component-dpcpp
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
        native-linux-sdk-descriptor-@.tar
      upload: >-
        native-linux-component-dpcpp-@.tar
      diagnostics: native-linux-component-dpcpp-diagnostics-@=/tmp/mom-native-linux-component-dpcpp-@/logs
      run: |
        export NATIVE_PROFILE=dpcpp MOM_NATIVE_COMPONENT_DEADLINE_EPOCH="$MOM_CI_DEADLINE_EPOCH"
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
        node scripts/ci/linux-application.js component-seal

  component-dpcpp-opencl:
    needs: [linux-descriptor]
    uses: ./.github/workflows/native-job.yml
    with:
      name: component-dpcpp-opencl
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
        native-linux-sdk-descriptor-@.tar
      upload: >-
        native-linux-component-dpcpp-opencl-@.tar
      diagnostics: native-linux-component-dpcpp-opencl-diagnostics-@=/tmp/mom-native-linux-component-dpcpp-opencl-@/logs
      run: |
        export NATIVE_PROFILE=dpcpp-opencl MOM_NATIVE_COMPONENT_DEADLINE_EPOCH="$MOM_CI_DEADLINE_EPOCH"
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
        node scripts/ci/linux-application.js component-seal

  component-oneapi:
    needs: [linux-descriptor]
    uses: ./.github/workflows/native-job.yml
    with:
      name: component-oneapi
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
        native-linux-dpcpp-cuda-inputs-@.tar
        native-linux-gnu-headers-@.tar
        native-linux-cuda-images-@.tar
        native-linux-jit-sdk-@-static-dpcpp.tar
        native-acpp-state-@-sources.tar
        native-linux-acpp-cuda-hip-sdk-@.tar
        native-linux-hermes-sdk-@.tar
        native-linux-rocm-host-sdk-@.tar
        native-linux-openmp-sdk-@.tar
        native-linux-zstd-sdk-@.tar
        native-linux-io-openssl-sdk-@.tar
        native-linux-sdk-descriptor-@.tar
      upload: >-
        native-linux-component-oneapi-@.tar
      diagnostics: native-linux-component-oneapi-diagnostics-@=/tmp/mom-native-linux-component-oneapi-@/logs
      run: |
        export NATIVE_PROFILE=oneapi MOM_NATIVE_COMPONENT_DEADLINE_EPOCH="$MOM_CI_DEADLINE_EPOCH"
        scripts/run-bounded-native-ci.sh node scripts/run-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
        node scripts/ci/linux-application.js component-seal

  linux-application:
    needs: [linux-descriptor, component-core, component-acpp-cuda, component-acpp-hip, component-dpcpp, component-dpcpp-opencl, component-oneapi]
    uses: ./.github/workflows/native-job.yml
    with:
      name: linux-application
      npm: true
      dev: node
      download: >-
        native-linux-sdk-state-@-sources.tar
