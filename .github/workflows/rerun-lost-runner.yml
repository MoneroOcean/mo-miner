name: Rerun lost runners

# A hosted runner that dies mid-job ("lost communication with the server") fails the whole run for a
# reason unrelated to the code. Rerun the failed jobs once; real failures and second losses stay failed.
on:
  workflow_run:
    workflows: [Stability, Release]
    types: [completed]

permissions:
  actions: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    permissions:
      actions: write # gh run rerun
      checks: read # failed jobs' annotations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .id')
          for job in $jobs; do
            # A job's id is also its check-run id; the runner-loss reason is only in its annotations.
            if gh api --paginate "repos/$REPO/check-runs/$job/annotations" --jq '.[].message' |
                grep -q 'lost communication with the server'; then
              echo "Job $job lost its runner; rerunning the failed jobs of run $RUN_ID."
              gh run rerun "$RUN_ID" --failed --repo "$REPO"
              exit 0
            fi
          done
          echo "No failed job of run $RUN_ID lost its runner."
