name: Test native release executable (runtime-only, not publication qualification)

# The caller supplies the executable hash from its build audit. This exercises the binary only.
on:
  workflow_call:
    inputs:
      expected_sha256:
        required: true
        type: string
      platform:
        description: linux or win32; must match the runner
        required: true
        type: string
      variant:
        description: raw or packed
        default: raw
        type: string

permissions:
  actions: read
  contents: read

jobs:
  native-runtime:
    name: Runtime-only ${{ inputs.variant }} / ${{ matrix.lane }}
    runs-on: ${{ inputs.platform == 'win32' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # glibc-floor runs the executable in the oldest supported glibc distributions (Linux only).
        lane: ${{ fromJSON(inputs.platform == 'linux' && '["cpu-cli","portable-cpu","glibc-floor"]' || '["cpu-cli","portable-cpu"]') }}
    env:
      MOM_TEST_NO_POOL_NETWORK: "1"
      NATIVE_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      NATIVE_PLATFORM: ${{ inputs.platform }}
      NATIVE_VARIANT: ${{ inputs.variant }}
      MOM_NATIVE_CI_SUFFIX: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm: true
          apt: ${{ inputs.platform == 'linux' && matrix.lane == 'cpu-cli' && 'strace' || '' }}
      - id: candidate
        run: node scripts/ci/runtime-input.js candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ steps.candidate.outputs.directory }}
      - id: binary
        run: node scripts/ci/runtime-input.js binary
      - if: inputs.platform == 'linux' && matrix.lane == 'portable-cpu'
        run: bash scripts/install-opencl-cpu.sh
      - if: inputs.platform == 'win32' && matrix.lane == 'portable-cpu'
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'mom-dev-opencl-cpu'
          & .\scripts\install-dev.ps1 -Component opencl-cpu -Workspace $workspace
          $root = 'C:\Program Files (x86)\Common Files\Intel\Shared Libraries\'
          $registry = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Khronos\OpenCL\Vendors'
          $paths = @($registry.PSObject.Properties | Where-Object {
            $_.Name.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) -and
              [IO.Path]::GetFileName($_.Name) -ieq 'intelocl64.dll' -and (Test-Path -LiteralPath $_.Name -PathType Leaf)
          })
          if (-not $paths.Count) { throw 'The standalone Intel CPU OpenCL ICD did not register below its pinned shared-runtime root.' }
      - if: matrix.lane == 'glibc-floor'
        name: glibc 2.31 floor
        env:
          NATIVE_RUNTIME_BINARY: ${{ steps.binary.outputs.binary }}
        run: scripts/check-native-glibc-floor.sh "$NATIVE_RUNTIME_BINARY"
      - if: matrix.lane != 'glibc-floor'
        name: Runtime-only gates
        env:
          NATIVE_RUNTIME_BINARY: ${{ steps.binary.outputs.binary }}
          LANE: ${{ matrix.lane }}
        run: |
          check() { node scripts/check-native-release.js "$NATIVE_RUNTIME_BINARY" "$1" --sha256 "$NATIVE_EXPECTED_SHA256"; }
          if [[ "$LANE" == portable-cpu ]]; then check gpu-portable-cpu; exit; fi
          status=0
          check cpu || status=1
          check cli || status=1
          if [[ "$NATIVE_PLATFORM" == linux ]]; then check trace || status=1; fi
          exit "$status"
      - if: always() && inputs.platform == 'linux' && matrix.lane == 'cpu-cli'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-syscall-traces-${{ inputs.variant }}
          path: ${{ runner.temp }}/mom-native-trace-ci-*/*.strace
          if-no-files-found: warn
          overwrite: true
          retention-days: 3
