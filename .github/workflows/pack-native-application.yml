name: Pack an admitted native executable

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      executable_sha256:
        required: true
        type: string
      build_handoff_bundle_sha256:
        required: true
        type: string
      build_handoff_sha256:
        required: true
        type: string
    outputs:
      executable_artifact_name:
        value: ${{ jobs.pack.outputs.executable_artifact_name }}
      executable_sha256:
        value: ${{ jobs.pack.outputs.executable_sha256 }}
      build_bundle_sha256:
        value: ${{ jobs.pack.outputs.build_bundle_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  pack:
    name: Pack ${{ inputs.platform }} without rebuilding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      executable_artifact_name: ${{ steps.pack.outputs.executable_artifact_name }}
      executable_sha256: ${{ steps.pack.outputs.executable_sha256 }}
      build_bundle_sha256: ${{ steps.pack.outputs.build_bundle_sha256 }}
    env:
      NATIVE_PLATFORM: ${{ inputs.platform }}
      NATIVE_RAW_SHA256: ${{ inputs.executable_sha256 }}
      NATIVE_METADATA_SHA256: ${{ inputs.build_handoff_bundle_sha256 }}
      NATIVE_HANDOFF_SHA256: ${{ inputs.build_handoff_sha256 }}
      NATIVE_NAME: native-${{ inputs.platform == 'win32' && 'windows' || 'linux' }}
      NATIVE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/ci/pack-native.js validate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_NAME }}-executable-${{ env.NATIVE_SUFFIX }}
          path: ${{ runner.temp }}/native-raw
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_NAME }}-application-build-${{ env.NATIVE_SUFFIX }}.tar
          path: ${{ runner.temp }}/incoming
      - id: pack
        run: node scripts/ci/pack-native.js pack
      - if: failure() && steps.pack.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_NAME }}-packing-diagnostics-${{ env.NATIVE_SUFFIX }}
          path: /tmp/${{ env.NATIVE_NAME }}-packed-build-${{ env.NATIVE_SUFFIX }}/*.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_NAME }}-packed-executable-${{ env.NATIVE_SUFFIX }}
          path: /tmp/${{ env.NATIVE_NAME }}-packed-build-${{ env.NATIVE_SUFFIX }}/${{ inputs.platform == 'win32' && 'mom.exe' || 'mom' }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/${{ env.NATIVE_NAME }}-packed-build-${{ env.NATIVE_SUFFIX }}.tar
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
