name: Build the original Windows static DPC++ component

on:
  workflow_call:
    inputs:
      windows_jit_run_deadline_epoch:
        required: true
        type: string
      source_bundle_sha256:
        required: true
        type: string
      dpcpp_bundle_sha256:
        required: true
        type: string
      dpcpp_manifest_sha256:
        required: true
        type: string
      windows_jit_bundle_sha256:
        required: true
        type: string
      linux_tools_bundle_sha256:
        required: true
        type: string
      linux_tools_handoff_sha256:
        required: true
        type: string
      windows_io_bundle_sha256:
        required: true
        type: string
      windows_io_handoff_sha256:
        required: true
        type: string
      windows_hermes_bundle_sha256:
        required: true
        type: string
      windows_hermes_handoff_sha256:
        required: true
        type: string
      linux_hermes_bundle_sha256:
        required: true
        type: string
    outputs:
      bundle_sha256:
        value: ${{ jobs.dpcpp-static.outputs.bundle_sha256 }}
      component_manifest_sha256:
        value: ${{ jobs.dpcpp-static.outputs.component_manifest_sha256 }}
      artifact_name:
        value: ${{ jobs.dpcpp-static.outputs.artifact_name }}

permissions:
  actions: read
  contents: read

jobs:
  dpcpp-static:
    name: Windows original static DPC++ component
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOM_AOT_BUILD_ONLY: "1"
      MOM_BUILD_JOBS: "2"
      OMP_NUM_THREADS: "2"
      MOM_NATIVE_SOURCE_DIR: /tmp/mom-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_SDK_DIR: /tmp/mom-native-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_IO_SOURCE_DIR: /tmp/mom-native-io-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_IO_SDK_DIR: /tmp/mom-native-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_SOURCES_DIR: /tmp/mom-native-linux-source-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ZSTD_SOURCE_DIR: /tmp/mom-native-zstd-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ZSTD_SDK_DIR: /tmp/mom-native-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_JIT_RESOURCES_DIR: /tmp/mom-native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_COMGR_SDK_DIR: /tmp/mom-native-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_RESOURCES_DIR: /tmp/mom-native-rocm-resources-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_HIP_HEADERS_DIR: /tmp/mom-native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_HOST_SDK_DIR: /tmp/mom-native-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_SDK_DESCRIPTOR_DIR: /tmp/mom-native-linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_DPCPP_CUDA_INPUTS_DIR: /tmp/mom-native-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_HERMES_SOURCE_DIR: /tmp/mom-native-hermes-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_HERMES_SDK_DIR: /tmp/mom-native-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_SOURCE_BUNDLE_SHA256: ${{ inputs.source_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_DPCPP_BUNDLE_SHA256: ${{ inputs.dpcpp_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_DPCPP_MANIFEST_SHA256: ${{ inputs.dpcpp_manifest_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_JIT_BUNDLE_SHA256: ${{ inputs.windows_jit_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_TOOLS_BUNDLE_SHA256: ${{ inputs.linux_tools_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_TOOLS_HANDOFF_SHA256: ${{ inputs.linux_tools_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_IO_BUNDLE_SHA256: ${{ inputs.windows_io_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_IO_HANDOFF_SHA256: ${{ inputs.windows_io_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_HERMES_BUNDLE_SHA256: ${{ inputs.windows_hermes_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_HERMES_HANDOFF_SHA256: ${{ inputs.windows_hermes_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_LINUX_HERMES_BUNDLE_SHA256: ${{ inputs.linux_hermes_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_DPCPP_STATIC_JIT_RUN_DEADLINE_EPOCH: ${{ inputs.windows_jit_run_deadline_epoch }}
    outputs:
      bundle_sha256: ${{ steps.seal.outputs.bundle_sha256 }}
      component_manifest_sha256: ${{ steps.seal.outputs.component_manifest_sha256 }}
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
    steps:
      - name: Start within the original Windows JIT run deadline
        id: deadline
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          epoch="$MOM_NATIVE_WINDOWS_DPCPP_STATIC_JIT_RUN_DEADLINE_EPOCH"
          [[ "$epoch" =~ ^[0-9]{10}$ ]] || { echo 'Malformed upstream immutable Windows JIT deadline' >&2; exit 1; }
          deadline=$((10#$epoch))
          if (( deadline <= now || deadline - now > 28800 )); then
            echo 'The immutable Windows JIT deadline is expired or exceeds its eight-hour bound' >&2
            exit 1
          fi
          for pin in "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_SOURCE_BUNDLE_SHA256" "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_DPCPP_BUNDLE_SHA256" \
            "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_DPCPP_MANIFEST_SHA256" "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_JIT_BUNDLE_SHA256" \
            "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_TOOLS_BUNDLE_SHA256" "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_TOOLS_HANDOFF_SHA256" \
            "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_IO_BUNDLE_SHA256" "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_IO_HANDOFF_SHA256" \
            "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_HERMES_BUNDLE_SHA256" "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_HERMES_HANDOFF_SHA256" \
            "$MOM_NATIVE_WINDOWS_DPCPP_STATIC_LINUX_HERMES_BUNDLE_SHA256"; do
            [[ "$pin" =~ ^[a-f0-9]{64}$ ]] || { echo 'Missing or malformed external artifact/handoff SHA-256 pin' >&2; exit 1; }
          done
          job_deadline=$((now + 3300))
          if (( deadline < job_deadline )); then job_deadline=$deadline; fi
          if (( job_deadline - now < 120 )); then echo 'Insufficient time remains before an upstream deadline' >&2; exit 1; fi
          {
            echo "MOM_NATIVE_WINDOWS_DPCPP_STATIC_DEADLINE_EPOCH=$job_deadline"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_DEADLINE_EPOCH=$job_deadline"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_WORK_ROOT=$RUNNER_TEMP/mom-native-windows-host-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_ARCHIVE_DIR=$RUNNER_TEMP/mom-native-windows-host-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/archives"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_OUTPUT_DIR=$RUNNER_TEMP/mom-native-windows-host-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/native-windows-host-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_METADATA_TAR=$RUNNER_TEMP/native-windows-host-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-metadata.tar"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Install locked build-time JavaScript dependencies without lifecycle builds
        timeout-minutes: 8
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test DPC++ component and reusable-job contracts before mutation
        timeout-minutes: 5
        run: node --require ./tests/common/no_pool_network.js --test tests/native_windows_dpcpp_ci_job.js tests/native_windows_dpcpp_component.js tests/native_windows_adapters.js tests/native_windows_sdk_build.js tests/native_windows_application_config.js

      - name: Install extraction tools and pinned Intel 2026.2 compiler
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends 7zip msitools
          sudo env MOM_DEV_WORKSPACE=/var/tmp/mom-dev-native-windows-dpcpp-static-${{ github.run_id }}-${{ github.run_attempt }} scripts/install-dev.sh --component oneapi --jobs 2
          echo '/opt/intel/oneapi/compiler/2026.2/bin' >> "$GITHUB_PATH"

      - name: Download same-run Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming/source
      - name: Download pinned DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/dpcpp
      - name: Download completed Windows source-JIT link state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-windows-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-link.tar
          path: ${{ runner.temp }}/incoming/windows-jit
      - name: Download same-run Linux LLVM host tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-llvm-tools-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/tools
      - name: Download admitted Windows I/O support handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-windows-controller-io-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/windows-io
      - name: Download admitted Windows Hermes support handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-windows-controller-hermes-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/windows-hermes
      - name: Download source-built Linux Hermes AOT receipt and compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/linux-hermes

      - name: Re-admit inputs, reacquire the local Windows SDK, and run original DPC++ producers
        id: build
        timeout-minutes: 50
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path"), {spawnSync} = require("node:child_process");
          const ci = require("./scripts/prepare-native-ci"), {fileHash, readBuildJson} = require("./scripts/build-source-inputs"),
            {sdkComponents} = require("./scripts/prepare-native-sdk-sources"),
            {linuxLlvmToolHandoffInputs} = require("./scripts/native-linux-llvm-tools"),
            {windowsControllerHandoffInputs} = require("./scripts/native-windows-controller-handoff"),
            {nativeHermesInputs} = require("./scripts/native-release-sdk-inputs"),
            {composeWindowsApplicationConfig} = require("./scripts/native-windows-application-config"),
            {windowsDpcppComponentInputs} = require("./scripts/native-windows-dpcpp-component"),
            {windowsGpuHostSdkPins, windowsGpuDpcppManifest} = require("./scripts/run-native-windows-gpu-ci");
          const env = process.env, suffix = `${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}`, paths = ci.ciPaths(), temp = paths.runnerTemp,
            incoming = path.join(temp, "incoming"), repo = process.cwd(), deadline = Number(env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_DEADLINE_EPOCH),
            rootsFile = path.join(temp, `windows-dpcpp-static-source-roots-${suffix}.json`),
            descriptorFile = path.join(temp, `windows-dpcpp-static-descriptor-${suffix}.json`),
            toolsManifest = path.join(temp, `windows-dpcpp-static-jit-tools-${suffix}.json`),
            componentRoot = path.join("/tmp", `native-windows-dpcpp-static-${suffix}`),
            jitIsolation = path.join("/tmp", `mom-native-windows-dpcpp-jit-isolated-${suffix}`),
            sdkRoot = path.join("/tmp", `mom-native-windows-dpcpp-sdk-${suffix}`),
            adaptersRoot = path.join("/tmp", `mom-native-windows-dpcpp-adapters-${suffix}`);
          const pins = {
            source: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_SOURCE_BUNDLE_SHA256,
            dpcpp: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_DPCPP_BUNDLE_SHA256,
            dpcppManifest: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_DPCPP_MANIFEST_SHA256,
            jit: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_JIT_BUNDLE_SHA256,
            tools: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_TOOLS_BUNDLE_SHA256,
            toolsHandoff: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_TOOLS_HANDOFF_SHA256,
            io: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_IO_BUNDLE_SHA256,
            ioHandoff: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_IO_HANDOFF_SHA256,
            hermes: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_HERMES_BUNDLE_SHA256,
            hermesHandoff: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_HERMES_HANDOFF_SHA256,
            linuxHermes: env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_LINUX_HERMES_BUNDLE_SHA256,
          };
          const remaining = (capMs, reserveMs = 60000) => {
            const ms = Math.min(capMs, deadline * 1000 - Date.now() - reserveMs);
            if (!Number.isSafeInteger(ms) || ms < 1000) throw new Error("Immutable Windows run deadline expired before DPC++ preparation");
            return ms;
          };
          const runNode = (script, args, capMs) => {
            const timeoutMs = remaining(capMs), seconds = Math.floor(timeoutMs / 1000), timeout = fs.realpathSync("/usr/bin/timeout");
            const memoryScope = path.join(repo, "scripts/run-bounded-native-ci.sh");
            const result = spawnSync(memoryScope, [timeout, "--signal=TERM", "--kill-after=5s", `${seconds}s`, process.execPath,
              path.join(repo, script), ...args], {cwd: repo, env, stdio: "inherit", timeout: timeoutMs + 10000});
            if (result.error || result.signal || result.status !== 0) {
              throw new Error(`Bounded Windows DPC++ child failed: ${script}${result.status === 124 ? " (deadline)" : ""}`, {cause: result.error});
            }
          };
          const pinArchive = (file, sha256, maximum = 16 * 1024 ** 3) => {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 || stat.size > maximum ||
                fs.realpathSync(file) !== file || !/^[a-f0-9]{64}$/.test(sha256 || "") || fileHash(file) !== sha256) {
              throw new Error("Windows DPC++ input archive differs from its external SHA-256 pin: " + path.basename(file));
            }
          };
          const restore = (archive, sha256, roots, base, maximumExpandedBytes) => {
            pinArchive(archive, sha256);
            const members = ci.listState(archive, roots, remaining(5 * 60 * 1000)),
              expanded = ci.tarExpandedBytes(archive, members.length, remaining(5 * 60 * 1000)),
              disk = fs.statfsSync(base, {bigint: true});
            if (expanded > maximumExpandedBytes || BigInt(expanded) + 4n * 1024n ** 3n > disk.bavail * disk.bsize) {
              throw new Error("Pinned Windows DPC++ input exceeds its extraction bound or four-GiB disk reserve");
            }
            ci.extractState(archive, base, roots, roots, remaining(10 * 60 * 1000));
            return members;
          };
          const runAttempt = suffix, source = ci.linuxSourceStatePaths(paths, env), dpcpp = ci.dpcppCudaInputsStatePaths(paths, env),
            hermes = ci.hermesStatePaths(paths, env), jitName = `mom-native-windows-jit-${suffix}`,
            toolsName = `native-linux-llvm-tools-${suffix}`, ioName = `native-windows-controller-io-${suffix}`,
            windowsHermesName = `native-windows-controller-hermes-${suffix}`,
            sourceTar = path.join(incoming, "source", path.basename(source.sourceTar)),
            dpcppTar = path.join(incoming, "dpcpp", path.basename(dpcpp.sdkTar)),
            jitTar = path.join(incoming, "windows-jit", `native-windows-jit-sdk-${suffix}-link.tar`),
            toolsTar = path.join(incoming, "tools", toolsName + ".tar"),
            ioTar = path.join(incoming, "windows-io", ioName + ".tar"),
            windowsHermesTar = path.join(incoming, "windows-hermes", windowsHermesName + ".tar"),
            linuxHermesTar = path.join(incoming, "linux-hermes", `native-linux-hermes-sdk-${suffix}.tar`),
            toolsParent = path.join(temp, `windows-dpcpp-static-tools-${suffix}`),
            windowsIoRoot = path.join(temp, ioName), windowsHermesRoot = path.join(temp, windowsHermesName),
            jitRoot = path.join("/tmp", jitName), jitSdk = path.join(jitRoot, "sdk");
          for (const pin of Object.values(pins)) {if (!/^[a-f0-9]{64}$/.test(pin || "")) throw new Error("Missing external Windows DPC++ artifact or handoff pin");}
          for (const output of [rootsFile, descriptorFile, toolsManifest, componentRoot, toolsParent, jitIsolation, sdkRoot, adaptersRoot]) {
            if (fs.existsSync(output)) throw new Error("Windows DPC++ CI refuses an existing run-attempt output: " + path.basename(output));
          }

          restore(sourceTar, pins.source, [source.sourceName], "/tmp", 8 * 1024 ** 3);
          ci.verifyLinuxSources(paths, source, fs.realpathSync("/usr/bin/git"));
          restore(dpcppTar, pins.dpcpp, [dpcpp.name], "/tmp", 8 * 1024 ** 3);
          ci.auditDpcppCudaInputs(dpcpp, windowsGpuDpcppManifest(dpcpp.manifest, pins.dpcppManifest, pins.source), pins.dpcppManifest);
          restore(jitTar, pins.jit, [jitName], "/tmp", 12 * 1024 ** 3);
          fs.mkdirSync(toolsParent, {mode: 0o700});
          restore(toolsTar, pins.tools, [toolsName], toolsParent, 2 * 1024 ** 3);
          restore(ioTar, pins.io, [ioName], temp, 2 * 1024 ** 3);
          restore(windowsHermesTar, pins.hermes, [windowsHermesName], temp, 2 * 1024 ** 3);
          restore(linuxHermesTar, pins.linuxHermes, [hermes.sourceName, hermes.sdkName], "/tmp", 12 * 1024 ** 3);

          const tools = linuxLlvmToolHandoffInputs(path.join(toolsParent, toolsName), {runAttempt, handoffSha256: pins.toolsHandoff}),
            io = windowsControllerHandoffInputs(windowsIoRoot, {kind: "io", runAttempt, handoffSha256: pins.ioHandoff}),
            windowsHermes = windowsControllerHandoffInputs(windowsHermesRoot, {kind: "hermes", runAttempt, handoffSha256: pins.hermesHandoff}),
            linuxHermes = nativeHermesInputs(path.join(hermes.sdkRoot, "result.json"));
          if (io.kind !== "io" || windowsHermes.kind !== "hermes" || !windowsHermes.intelRuntime) {
            throw new Error("Windows DPC++ composition requires admitted same-run I/O and Hermes handoffs");
          }
          const roots = readBuildJson(source.rootsFile), compilerNames = Object.keys(sdkComponents("compiler")),
            windowsNames = Object.keys(sdkComponents("windows")), preparedWindows = path.join(source.prepared, "windows");
          if (!roots || Object.keys(roots).sort().join("\0") !== compilerNames.sort().join("\0") ||
              windowsNames.some(name => roots[name] !== path.join(source.source, "roots", name)) || fs.existsSync(preparedWindows)) {
            throw new Error("Pinned Windows source roots are incomplete or the preparation output is not fresh");
          }
          const windowsRoots = Object.fromEntries(windowsNames.map(name => [name, roots[name]]));
          fs.writeFileSync(rootsFile, JSON.stringify(windowsRoots) + "\n", {flag: "wx", mode: 0o444});
          runNode("scripts/prepare-native-sdk-sources.js", ["windows", rootsFile, preparedWindows], 10 * 60 * 1000);
          const sourcesFile = path.join(preparedWindows, "sources.json"), hostState = ci.windowsHostSdkStatePaths(),
            hostProducer = ci.buildWindowsHostSdkSourcesCi(), hostPins = windowsGpuHostSdkPins(hostState.sdkOutput, hostProducer),
            intelRoot = "/opt/intel/oneapi/compiler/2026.2", clangCl = path.join(intelRoot, "bin/icx-cl"),
            llvmDescriptor = ci.composeWindowsLlvmSdkDescriptor({windowsSdkRoot: hostState.sdkOutput, windowsSdkPins: hostPins,
              hermesRoot: windowsHermesRoot, hermesExpectation: {kind: "hermes", runAttempt, handoffSha256: pins.hermesHandoff},
              tools: {clangCl: {path: clangCl, sha256: fileHash(clangCl)},
                lldLink: {path: tools.lldLink, sha256: fileHash(tools.lldLink), linkTarget: "lld"},
                llvmNm: {path: tools.llvmNm, sha256: fileHash(tools.llvmNm)},
                clangResourceInclude: path.join(intelRoot, "lib/clang/23/include")}}),
            allowedImports = ["advapi32.dll", "cfgmgr32.dll", "dbghelp.dll", "kernel32.dll", "ntdll.dll", "ole32.dll",
              "oleaut32.dll", "setupapi.dll", "shell32.dll", "shlwapi.dll", "version.dll"],
            config = composeWindowsApplicationConfig({runAttempt, llvmDescriptor: llvmDescriptor.descriptor, io, hermes: windowsHermes,
              hermesAot: linuxHermes, tools: {shermaot: linuxHermes.artifacts.compiler, llvmReadobj: path.join(tools.toolRoot, "llvm-readobj")}, allowedImports});
          fs.writeFileSync(descriptorFile, JSON.stringify(config, null, 2) + "\n", {flag: "wx", mode: 0o444});
          fs.writeFileSync(toolsManifest, JSON.stringify({version: 1, tools: {llvmAr: path.join(tools.toolRoot, "llvm-ar"),
            llvmNm: tools.llvmNm, llvmObjcopy: path.join(tools.toolRoot, "llvm-objcopy")}}, null, 2) + "\n", {flag: "wx", mode: 0o444});

          const sourceJitResult = path.join(jitSdk, "result.json"), sourceJitResultSha256 = fileHash(sourceJitResult);
          env.PATH = [path.join(dpcpp.dpcppRoot, "bin"), path.join(intelRoot, "bin"), tools.toolRoot, "/usr/local/bin", "/usr/bin", "/bin"].join(":");
          env.LD_LIBRARY_PATH = [path.join(dpcpp.dpcppRoot, "lib"), path.join(intelRoot, "lib"), "/usr/lib/x86_64-linux-gnu"].join(":");
          runNode("scripts/isolate-native-windows-jit.js", [jitSdk, sourceJitResultSha256, toolsManifest, jitIsolation], 15 * 60 * 1000);
          env.MOM_AOT_DPCPP_JIT_RECEIPT = path.join(jitIsolation, "result.json");
          runNode("scripts/build-native-windows-sdk.js", [sourcesFile, descriptorFile, dpcpp.dpcppRoot, dpcpp.cudaRoot, sdkRoot], 30 * 60 * 1000);
          runNode("scripts/prepare-native-windows-adapters.js", [path.join(sdkRoot, "result.json"), descriptorFile, dpcpp.cudaRoot, adaptersRoot], 10 * 60 * 1000);
          runNode("scripts/native-windows-dpcpp-component.js", [path.join(adaptersRoot, "result.json"), dpcpp.cudaRoot, componentRoot], 5 * 60 * 1000);
          windowsDpcppComponentInputs(componentRoot);
          for (const file of [sourceTar, dpcppTar, jitTar, toolsTar, ioTar, windowsHermesTar, linuxHermesTar]) {fs.unlinkSync(file);}
          fs.appendFileSync(env.GITHUB_ENV, [
            `MOM_NATIVE_WINDOWS_DPCPP_STATIC_DESCRIPTOR_FILE=${descriptorFile}`,
            `MOM_NATIVE_WINDOWS_DPCPP_STATIC_COMPONENT_ROOT=${componentRoot}`,
          ].join("\n") + "\n", "utf8");
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY, "### Original Windows static DPC++ component\n" +
            "- The public source-built SDK, adapter producer, source-JIT isolator, and component exporter consumed same-run hash-pinned inputs.\n" +
            "- Windows host-SDK vendor archives and the locally composed SDK stayed on this runner; only the relocatable DPC++ component is uploaded.\n" +
            "- Build-only: no executable, GPU, runtime, or publication qualification is claimed.\n", "utf8");
          NODE

      - name: Revalidate and seal only the relocatable DPC++ component
        id: seal
        timeout-minutes: 5
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path"), ci = require("./scripts/prepare-native-ci"),
            {fileHash, readBuildJson} = require("./scripts/build-source-inputs"),
            {windowsDpcppComponentInputs} = require("./scripts/native-windows-dpcpp-component");
          const env = process.env, suffix = `${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}`,
            root = path.join("/tmp", `native-windows-dpcpp-static-${suffix}`),
            archive = path.join(fs.realpathSync(env.RUNNER_TEMP), `native-windows-dpcpp-static-${suffix}.tar`),
            receipt = path.join(root, "component.json"), result = windowsDpcppComponentInputs(root), metadata = readBuildJson(receipt);
          if (env.MOM_NATIVE_WINDOWS_DPCPP_STATIC_COMPONENT_ROOT !== root || fs.existsSync(archive) ||
              !result.files[receipt] || result.files[receipt] !== fileHash(receipt)) {
            throw new Error("Windows DPC++ component does not match the fresh same-run seal paths");
          }
          const rows = [...metadata.link.libraries, ...metadata.link.wholeArchives, ...metadata.link.objects],
            expected = [path.basename(root), path.basename(root) + "/component.json", path.basename(root) + "/lib",
              path.basename(root) + "/objects", ...rows.map(name => path.basename(root) + "/" + name)].sort(),
            packed = ci.packState(archive, path.dirname(root), [path.basename(root)], 5 * 60 * 1000),
            members = ci.listState(archive, [path.basename(root)]).map(name => name.replace(/\/$/, "")).sort();
          if (!packed.bytes || !Number.isSafeInteger(packed.bytes) || members.join("\0") !== expected.join("\0") ||
              ci.tarExpandedBytes(archive, members.length) > 1024 ** 3 || fileHash(receipt) !== result.files[receipt]) {
            throw new Error("Windows DPC++ component bundle is incomplete or changed while packing");
          }
          fs.appendFileSync(env.GITHUB_OUTPUT, `bundle_sha256=${fileHash(archive)}\ncomponent_manifest_sha256=${fileHash(receipt)}\nartifact_name=native-windows-dpcpp-static-${suffix}.tar\n`, "utf8");
          NODE

      - name: Retain the relocatable Windows DPC++ component only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.seal.outputs.artifact_name }}
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report the build-only boundary
        run: |
          {
            echo '### Original Windows static DPC++ component'
            echo '- Same-run Linux source, DPC++/CUDA, Windows JIT, LLVM tools, Windows I/O/Hermes, and Linux Hermes inputs were externally hash-pinned and admitted by their existing readers.'
            echo '- The original Windows SDK and adapters were built locally; vendor Windows SDK payloads and compiler installations were not uploaded or cached.'
            echo '- Only the self-contained relocatable DPC++ component was retained. No GPU execution, application runtime, performance, release, or publication qualification is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
