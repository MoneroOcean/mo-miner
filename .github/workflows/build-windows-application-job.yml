          const handoffSha256 = fileHash(handoffFile), packed = ci.packState(archive, "/tmp", [evidenceName], remaining(5 * 60 * 1000)),
            expectedMembers = [evidenceName, ...["application-config.json", "entrypoint.json", "handoff.json", "result.json"].map(name => `${evidenceName}/${name}`)].sort(),
            members = ci.listState(archive, [evidenceName], remaining(5 * 60 * 1000)).map(name => name.replace(/\/$/, "")).sort();
          if (packed.bytes < 1 || packed.bytes > 128 << 20 || !/^[a-f0-9]{64}$/.test(handoffSha256) ||
              members.join("\0") !== expectedMembers.join("\0") || fileHash(handoffFile) !== handoffSha256 ||
              artifact.identity.dev !== fs.lstatSync(executable).dev || artifact.identity.ino !== fs.lstatSync(executable).ino ||
              fileHash(executable) !== artifact.sha256 || fileHash(configFile) !== configRecord.sha256 ||
              fileHash(resultFile) !== resultRecord.sha256 || fileHash(entrypointFile) !== entrypointRecord.sha256) {
            throw new Error("Windows application runtime or compact build handoff changed during sealing");
          }
          const bundleSha256 = fileHash(archive), outputStat = fs.lstatSync(output), summaryStat = fs.lstatSync(summary);
          if (!outputStat.isFile() || outputStat.isSymbolicLink() || outputStat.nlink !== 1 ||
              !summaryStat.isFile() || summaryStat.isSymbolicLink() || summaryStat.nlink !== 1) {
            throw new Error("Windows application workflow reports are not regular files");
          }
          fs.appendFileSync(output, [
            `executable_artifact_name=native-windows-executable-${suffix}`,
            `executable_sha256=${artifact.sha256}`, `executable_bytes=${artifact.bytes}`,
            `build_handoff_artifact_name=${evidenceName}.tar`, `build_handoff_bundle_sha256=${bundleSha256}`,
            `build_handoff_sha256=${handoffSha256}`,
          ].join("\n") + "\n");
          fs.appendFileSync(summary, `### Sealed Windows runtime executable\n- \`mom.exe\`: ${artifact.bytes} bytes, SHA-256 \`${artifact.sha256}\`.\n` +
            `- Compact build evidence: \`${bundleSha256}\`; GPU cohort and source-bound build receipts remain separately auditable.\n` +
            "- The uploaded runtime artifact contains only mom.exe; no SDK, map, object cache, or build directory is included.\n", "utf8");
          NODE

      - name: Upload the raw runtime executable only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.seal.outputs.executable_artifact_name }}
          path: ${{ steps.build.outputs.executable }}
          if-no-files-found: error
          archive: true
          compression-level: 0
          retention-days: 1

      - name: Upload compact build receipt and config evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.seal.outputs.build_handoff_artifact_name }}
          path: ${{ runner.temp }}/native-windows-application-build-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
