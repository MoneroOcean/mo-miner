name: Build the full Windows native application

on:
  workflow_call:
    inputs:
      gpu_handoffs_json:
        description: JSON array of the five same-run Windows GPU handoff bundle and receipt pins
        required: true
        type: string
      core_bundle_sha256:
        required: true
        type: string
      core_handoff_sha256:
        required: true
        type: string
      dpcpp_component_bundle_sha256:
        required: true
        type: string
      dpcpp_component_manifest_sha256:
        required: true
        type: string
      host_component_bundle_sha256:
        required: true
        type: string
      host_component_manifest_sha256:
        required: true
        type: string
      windows_io_bundle_sha256:
        required: true
        type: string
      windows_io_handoff_sha256:
        required: true
        type: string
      windows_hermes_bundle_sha256:
        required: true
        type: string
      windows_hermes_handoff_sha256:
        required: true
        type: string
      linux_hermes_bundle_sha256:
        required: true
        type: string
      linux_tools_bundle_sha256:
        required: true
        type: string
      linux_tools_handoff_sha256:
        required: true
        type: string
      dpcpp_inputs_bundle_sha256:
        required: true
        type: string
      dpcpp_inputs_manifest_sha256:
        required: true
        type: string
      linux_sources_bundle_sha256:
        required: true
        type: string
      hip_headers_bundle_sha256:
        required: true
        type: string
      hip_headers_handoff_sha256:
        required: true
        type: string
      cuda_images_bundle_sha256:
        required: true
        type: string
    outputs:
      executable_artifact_name:
        description: Raw single-file Windows executable artifact accepted by test-native-release.yml
        value: ${{ jobs.windows-application.outputs.executable_artifact_name }}
      executable_sha256:
        description: SHA-256 of the uncompressed mom.exe build output
        value: ${{ jobs.windows-application.outputs.executable_sha256 }}
      executable_bytes:
        description: Byte length of mom.exe
        value: ${{ jobs.windows-application.outputs.executable_bytes }}
      build_handoff_artifact_name:
        description: Small build-only receipt/config evidence tar; does not contain the executable or SDK payloads
        value: ${{ jobs.windows-application.outputs.build_handoff_artifact_name }}
      build_handoff_bundle_sha256:
        description: SHA-256 of the small build evidence tar
        value: ${{ jobs.windows-application.outputs.build_handoff_bundle_sha256 }}
      build_handoff_sha256:
        description: SHA-256 of handoff.json inside the build evidence tar
        value: ${{ jobs.windows-application.outputs.build_handoff_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  windows-application:
    name: Build full Windows application (build-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOM_AOT_BUILD_ONLY: "1"
      MOM_BUILD_JOBS: "2"
      MOM_NATIVE_SOURCE_DIR: /tmp/mom-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_SDK_DIR: /tmp/mom-native-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_IO_SOURCE_DIR: /tmp/mom-native-io-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_IO_SDK_DIR: /tmp/mom-native-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_SOURCES_DIR: /tmp/mom-native-linux-source-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ZSTD_SOURCE_DIR: /tmp/mom-native-zstd-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ZSTD_SDK_DIR: /tmp/mom-native-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_JIT_RESOURCES_DIR: /tmp/mom-native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_COMGR_SDK_DIR: /tmp/mom-native-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_RESOURCES_DIR: /tmp/mom-native-rocm-resources-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_HIP_HEADERS_DIR: /tmp/mom-native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_ROCM_HOST_SDK_DIR: /tmp/mom-native-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_LINUX_SDK_DESCRIPTOR_DIR: /tmp/mom-native-linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_DPCPP_CUDA_INPUTS_DIR: /tmp/mom-native-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_HERMES_SOURCE_DIR: /tmp/mom-native-hermes-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_HERMES_SDK_DIR: /tmp/mom-native-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_NVRTC_LINUX_SOURCE_DIR: /tmp/mom-native-nvrtc-linux-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_NVRTC_LINUX_SDK_DIR: /tmp/mom-native-nvrtc-linux-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_NVRTC_LINUX_126_SOURCE_DIR: /tmp/mom-native-nvrtc-linux-12.6-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_NVRTC_LINUX_126_SDK_DIR: /tmp/mom-native-nvrtc-linux-12.6-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_CUDA_IMAGES_DIR: /tmp/mom-native-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_WINDOWS_APPLICATION_GPU_HANDOFFS_JSON: ${{ inputs.gpu_handoffs_json }}
      MOM_NATIVE_WINDOWS_APPLICATION_CORE_BUNDLE_SHA256: ${{ inputs.core_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_CORE_HANDOFF_SHA256: ${{ inputs.core_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_COMPONENT_BUNDLE_SHA256: ${{ inputs.dpcpp_component_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_COMPONENT_MANIFEST_SHA256: ${{ inputs.dpcpp_component_manifest_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_HOST_COMPONENT_BUNDLE_SHA256: ${{ inputs.host_component_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_HOST_COMPONENT_MANIFEST_SHA256: ${{ inputs.host_component_manifest_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_IO_BUNDLE_SHA256: ${{ inputs.windows_io_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_IO_HANDOFF_SHA256: ${{ inputs.windows_io_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_HERMES_BUNDLE_SHA256: ${{ inputs.windows_hermes_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_HERMES_HANDOFF_SHA256: ${{ inputs.windows_hermes_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_LINUX_HERMES_BUNDLE_SHA256: ${{ inputs.linux_hermes_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_LINUX_TOOLS_BUNDLE_SHA256: ${{ inputs.linux_tools_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_LINUX_TOOLS_HANDOFF_SHA256: ${{ inputs.linux_tools_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_INPUTS_BUNDLE_SHA256: ${{ inputs.dpcpp_inputs_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_INPUTS_MANIFEST_SHA256: ${{ inputs.dpcpp_inputs_manifest_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_LINUX_SOURCES_BUNDLE_SHA256: ${{ inputs.linux_sources_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_HIP_HEADERS_BUNDLE_SHA256: ${{ inputs.hip_headers_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_HIP_HEADERS_HANDOFF_SHA256: ${{ inputs.hip_headers_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_APPLICATION_CUDA_IMAGES_BUNDLE_SHA256: ${{ inputs.cuda_images_bundle_sha256 }}
    outputs:
      executable_artifact_name: ${{ steps.seal.outputs.executable_artifact_name }}
      executable_sha256: ${{ steps.seal.outputs.executable_sha256 }}
      executable_bytes: ${{ steps.seal.outputs.executable_bytes }}
      build_handoff_artifact_name: ${{ steps.seal.outputs.build_handoff_artifact_name }}
      build_handoff_bundle_sha256: ${{ steps.seal.outputs.build_handoff_bundle_sha256 }}
      build_handoff_sha256: ${{ steps.seal.outputs.build_handoff_sha256 }}
    steps:
      - name: Start the immutable 55-minute aggregate deadline
        id: deadline
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          deadline=$((now + 3300))
          {
            echo "MOM_NATIVE_WINDOWS_APPLICATION_DEADLINE_EPOCH=$deadline"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_DEADLINE_EPOCH=$deadline"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_WORK_ROOT=$RUNNER_TEMP/mom-native-windows-host-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_ARCHIVE_DIR=$RUNNER_TEMP/mom-native-windows-host-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/archives"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_OUTPUT_DIR=$RUNNER_TEMP/mom-native-windows-host-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/native-windows-host-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_METADATA_TAR=$RUNNER_TEMP/native-windows-host-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-metadata.tar"
          } >> "$GITHUB_ENV"
          echo "deadline_epoch=$deadline" >> "$GITHUB_OUTPUT"

      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0

      - name: Install JavaScript dependencies without lifecycle scripts
        timeout-minutes: 8
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test application admission and reusable-job contracts
        timeout-minutes: 8
        run: >-
          node --require ./tests/common/no_pool_network.js --test
          tests/native_windows_application.js tests/native_windows_application_config.js
          tests/native_windows_application_ci_job.js tests/native_windows_controller_handoff.js
          tests/native_windows_core_handoff.js tests/native_windows_dpcpp_component.js
          tests/native_windows_gpu_handoff.js tests/native_windows_host_component.js
          tests/native_linux_llvm_tools.js tests/native_rocm_hip_headers.js tests/native_cuda_images.js

      - name: Validate every external bundle and receipt pin
        id: pins
        timeout-minutes: 2
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const profiles = ["acpp-cuda", "acpp-hip", "dpcpp", "dpcpp-opencl", "oneapi"];
          const suffix = `${process.env.GITHUB_RUN_ID || ""}-${process.env.GITHUB_RUN_ATTEMPT || ""}`;
          const pinNames = [
            "CORE_BUNDLE", "CORE_HANDOFF", "DPCPP_COMPONENT_BUNDLE", "DPCPP_COMPONENT_MANIFEST",
            "HOST_COMPONENT_BUNDLE", "HOST_COMPONENT_MANIFEST", "IO_BUNDLE", "IO_HANDOFF",
            "HERMES_BUNDLE", "HERMES_HANDOFF", "LINUX_HERMES_BUNDLE", "LINUX_TOOLS_BUNDLE",
            "LINUX_TOOLS_HANDOFF", "DPCPP_INPUTS_BUNDLE", "DPCPP_INPUTS_MANIFEST", "LINUX_SOURCES_BUNDLE",
            "HIP_HEADERS_BUNDLE", "HIP_HEADERS_HANDOFF", "CUDA_IMAGES_BUNDLE",
          ];
          if (!/^[0-9]{1,20}-[1-9][0-9]{0,5}$/.test(suffix)) {throw new Error("Missing exact GitHub run-attempt identity");}
          const pins = Object.fromEntries(pinNames.map(name => [name, process.env[`MOM_NATIVE_WINDOWS_APPLICATION_${name}_SHA256`] || ""]));
          if (Object.values(pins).some(pin => !/^[a-f0-9]{64}$/.test(pin))) {
            throw new Error("Missing or malformed external Windows application bundle/receipt pin");
          }
          const rawGpuPins = process.env.MOM_NATIVE_WINDOWS_APPLICATION_GPU_HANDOFFS_JSON || "";
          if (!rawGpuPins || Buffer.byteLength(rawGpuPins, "utf8") > 64 * 1024) {throw new Error("GPU handoff pins are empty or excessive");}
          let gpuPins;
          try {gpuPins = JSON.parse(rawGpuPins);} catch (error) {throw new Error("GPU handoff pins are invalid JSON", {cause: error});}
          const expectedKeys = ["bundleSha256", "configSha256", "handoffSha256", "profile", "receiptSha256"];
          if (!Array.isArray(gpuPins) || gpuPins.length !== profiles.length || gpuPins.some(pin =>
            !pin || typeof pin !== "object" || Array.isArray(pin) ||
            Object.keys(pin).sort().join(",") !== expectedKeys.join(",") ||
            typeof pin.profile !== "string" || !profiles.includes(pin.profile) ||
            [pin.bundleSha256, pin.configSha256, pin.handoffSha256, pin.receiptSha256].some(value => !/^[a-f0-9]{64}$/.test(value || ""))) ||
            new Set(gpuPins.map(pin => pin.profile)).size !== profiles.length) {
            throw new Error("GPU handoff pins must cover the exact five maintained profiles once each");
          }
          const output = process.env.GITHUB_OUTPUT || "";
          const stat = fs.lstatSync(output);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1) {throw new Error("Workflow output is not a canonical regular file");}
          fs.appendFileSync(output, `run_attempt=${suffix}\n`);
          NODE

      - name: Install archive tools and pinned Intel 2026.2 compiler
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends 7zip msitools unzip
          workspace="/var/tmp/mom-dev-native-windows-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo env MOM_DEV_WORKSPACE="$workspace" MOM_BUILD_JOBS=2 scripts/install-dev.sh --component oneapi --jobs 2
          test -x /opt/intel/oneapi/compiler/2026.2/bin/icx-cl
          /opt/intel/oneapi/compiler/2026.2/bin/icx-cl --version | rg --fixed-strings '2026.2'

      - name: Download pinned Windows Core handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-core-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/core

      - name: Download pinned Windows DPC++ component
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-dpcpp-static-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/dpcpp-component

      - name: Download pinned Windows host component
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-host-component-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/host-component

      - name: Download pinned Windows I/O handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-controller-io-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/io

      - name: Download pinned Windows Hermes handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-controller-hermes-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/windows-hermes

      - name: Download pinned Linux Hermes build state
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/linux-hermes

      - name: Download pinned thin Linux LLVM tools
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-linux-llvm-tools-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/linux-tools

      - name: Download pinned DPC++ and CUDA compiler inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/dpcpp-inputs

      - name: Download pinned Linux source cohort
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming/linux-sources

      - name: Download pinned HIP header handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/hip-headers

      - name: Download pinned CUDA-image input handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-linux-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/cuda-images

      - name: Download pinned Windows ACPP CUDA factory handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-gpu-acpp-cuda-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/gpu

      - name: Download pinned Windows ACPP HIP factory handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-gpu-acpp-hip-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/gpu

      - name: Download pinned Windows DPC++ factory handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-gpu-dpcpp-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/gpu

      - name: Download pinned Windows DPC++ OpenCL factory handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-gpu-dpcpp-opencl-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/gpu

      - name: Download pinned Windows oneAPI factory handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-windows-gpu-oneapi-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/gpu

      - name: Restore handoffs, compose the current SDK descriptor, and build
        id: build
        timeout-minutes: 50
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path"), {spawnSync} = require("node:child_process"),
            {isDeepStrictEqual} = require("node:util");
          const ci = require("./scripts/prepare-native-ci"), {fileHash, readBuildJson} = require("./scripts/build-source-inputs"),
            {linuxLlvmToolHandoffInputs} = require("./scripts/native-linux-llvm-tools"),
            {windowsControllerHandoffInputs} = require("./scripts/native-windows-controller-handoff"),
            {windowsNativeCoreHandoffInputs} = require("./scripts/native-windows-core-handoff"),
            {windowsDpcppComponentInputs} = require("./scripts/native-windows-dpcpp-component"),
            {windowsHostComponentInputs} = require("./scripts/native-windows-host-component"),
            {windowsGpuHandoffInputs} = require("./scripts/native-windows-gpu-handoff"),
            {rocmHipHeaderInputs} = require("./scripts/native-rocm-hip-headers"),
            {nativeHermesInputs} = require("./scripts/native-release-sdk-inputs"),
            {composeWindowsApplicationConfig} = require("./scripts/native-windows-application-config"),
            {windowsGpuHostSdkPins, windowsGpuDpcppManifest} = require("./scripts/run-native-windows-gpu-ci");
          const env = process.env, paths = ci.ciPaths(), suffix = paths.suffix, temp = paths.runnerTemp,
            deadline = Number(env.MOM_NATIVE_WINDOWS_APPLICATION_DEADLINE_EPOCH), repo = process.cwd(),
            inputRoot = path.join(temp, "incoming"), output = path.join(temp, `native-windows-application-output-${suffix}`),
            configFile = path.join(temp, `native-windows-application-config-${suffix}.json`),
            intelRoot = "/opt/intel/oneapi/compiler/2026.2", toolName = `native-linux-llvm-tools-${suffix}`;
          const remaining = (capMs, reserveMs = 60000) => {
            const milliseconds = Math.min(capMs, deadline * 1000 - Date.now() - reserveMs);
            if (!Number.isSafeInteger(milliseconds) || milliseconds < 1000) {throw new Error("Windows application aggregate deadline expired");}
            return milliseconds;
          };
          const pins = {
            coreBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_CORE_BUNDLE_SHA256,
            coreHandoff: env.MOM_NATIVE_WINDOWS_APPLICATION_CORE_HANDOFF_SHA256,
            dpcppComponentBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_COMPONENT_BUNDLE_SHA256,
            dpcppComponentManifest: env.MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_COMPONENT_MANIFEST_SHA256,
            hostComponentBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_HOST_COMPONENT_BUNDLE_SHA256,
            hostComponentManifest: env.MOM_NATIVE_WINDOWS_APPLICATION_HOST_COMPONENT_MANIFEST_SHA256,
            ioBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_IO_BUNDLE_SHA256,
            ioHandoff: env.MOM_NATIVE_WINDOWS_APPLICATION_IO_HANDOFF_SHA256,
            hermesBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_HERMES_BUNDLE_SHA256,
            hermesHandoff: env.MOM_NATIVE_WINDOWS_APPLICATION_HERMES_HANDOFF_SHA256,
            linuxHermesBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_LINUX_HERMES_BUNDLE_SHA256,
            linuxToolsBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_LINUX_TOOLS_BUNDLE_SHA256,
            linuxToolsHandoff: env.MOM_NATIVE_WINDOWS_APPLICATION_LINUX_TOOLS_HANDOFF_SHA256,
            dpcppInputsBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_INPUTS_BUNDLE_SHA256,
            dpcppInputsManifest: env.MOM_NATIVE_WINDOWS_APPLICATION_DPCPP_INPUTS_MANIFEST_SHA256,
            linuxSourcesBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_LINUX_SOURCES_BUNDLE_SHA256,
            hipHeadersBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_HIP_HEADERS_BUNDLE_SHA256,
            hipHeadersHandoff: env.MOM_NATIVE_WINDOWS_APPLICATION_HIP_HEADERS_HANDOFF_SHA256,
            cudaImagesBundle: env.MOM_NATIVE_WINDOWS_APPLICATION_CUDA_IMAGES_BUNDLE_SHA256,
          };
          if (!/^[0-9]{1,20}-[1-9][0-9]{0,5}$/.test(suffix) || env.MOM_AOT_BUILD_ONLY !== "1" || env.MOM_BUILD_JOBS !== "2" ||
              !Number.isSafeInteger(deadline) || deadline * 1000 <= Date.now() || Object.values(pins).some(pin => !/^[a-f0-9]{64}$/.test(pin || "")) ||
              fs.realpathSync(temp) !== temp || fs.existsSync(output) || fs.existsSync(configFile)) {
            throw new Error("Windows application inputs or fresh output paths differ from the bounded run plan");
          }
          let gpuPins;
          try {gpuPins = JSON.parse(env.MOM_NATIVE_WINDOWS_APPLICATION_GPU_HANDOFFS_JSON || "");}
          catch (error) {throw new Error("Windows GPU handoff pins became invalid JSON", {cause: error});}
