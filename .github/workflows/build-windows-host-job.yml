              resourcesConfigFile = path.join(paths.runnerTemp, "native-windows-rocm-resources-config-" + suffix + ".json"),
              resourceConfig = {version: 1, target: "win32", source: path.join(rocm.source, "roots/rocmLlvm"),
                clr: path.join(rocm.source, "roots/clr"), llvm: linuxSdk.sdk.path, cmake: "/usr/bin/cmake",
                hipHeaders: hipHeaders.include, hostCompilers: {cc: "/opt/intel/oneapi/compiler/2026.2/bin/icx",
