            fs.writeFileSync(resourcesConfigFile, JSON.stringify(resourceConfig, null, 2) + "\n", {flag: "wx", mode: 0o600});
            run("scripts/build-native-rocm-resources.js", [resourcesConfigFile, resourcesRoot], 12 * 60 * 1000);
