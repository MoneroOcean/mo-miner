      - name: Seal the archive-only component artifact
        id: build
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path"), {isDeepStrictEqual} = require("node:util"),
            ci = require("./scripts/prepare-native-ci"), {fileHash, readBuildJson} = require("./scripts/build-source-inputs"),
            {windowsHostComponentInputs} = require("./scripts/native-windows-host-component"), env = process.env,
            suffix = env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT,
            root = path.join("/tmp", "native-windows-host-component-" + suffix), componentName = path.basename(root),
            runnerTemp = fs.realpathSync(env.RUNNER_TEMP || ""), archive = path.join(runnerTemp, componentName + ".tar"),
            receipt = path.join(root, "component.json"), jobDeadlineMs = Number(env.MOM_NATIVE_WINDOWS_LLVM_DEADLINE_EPOCH) * 1000,
            deadlineMs = Math.min(Date.now() + 5 * 60 * 1000, jobDeadlineMs - 30_000), digest = /^[a-f0-9]{64}$/;
          if (env.MOM_NATIVE_WINDOWS_HOST_COMPONENT_ROOT !== root || !/^[0-9]{1,20}-[1-9][0-9]{0,5}$/.test(suffix) ||
              !Number.isSafeInteger(jobDeadlineMs) || !Number.isSafeInteger(deadlineMs) || deadlineMs - Date.now() < 2_000 ||
              archive.startsWith("/tmp/")) {
            throw new Error("Windows host-component seal paths or inherited job deadline are invalid");
          }
          function operationTimeout() {
            const ms = Math.floor(deadlineMs - Date.now());
            if (!Number.isSafeInteger(ms) || ms < 2_000) {throw new Error("Windows host-component sealing deadline exhausted");}
            return ms;
          }
          const before = windowsHostComponentInputs(root), metadata = readBuildJson(receipt), manifestSha256 = fileHash(receipt);
          if (fs.existsSync(archive) || before.files[receipt] !== manifestSha256 || metadata.buildOnly !== true || metadata.publicationQualified !== false) {
            throw new Error("Windows host component differs from its fresh build-only manifest before sealing");
          }
          const expected = new Set([componentName]);
          for (const file of Object.keys(before.files)) {
            const relative = path.relative(root, file).split(path.sep).join("/");
            expected.add(componentName + "/" + relative);
            let parent = path.posix.dirname(relative);
            while (parent !== ".") {expected.add(componentName + "/" + parent); parent = path.posix.dirname(parent);}
          }
          const packed = ci.packState(archive, path.dirname(root), [componentName], operationTimeout()),
            listed = ci.listState(archive, [componentName], operationTimeout()),
            actual = listed.map(name => name.endsWith("/") ? name.slice(0, -1) : name).sort(),
            after = windowsHostComponentInputs(root), expandedBytes = ci.tarExpandedBytes(archive, listed.length, operationTimeout()),
            bundleSha256 = fileHash(archive), output = env.GITHUB_OUTPUT || "", summary = env.GITHUB_STEP_SUMMARY || "";
          if (!packed.bytes || actual.join("\0") !== [...expected].sort().join("\0") || expandedBytes < 1 || expandedBytes > 1024 ** 3 ||
              !isDeepStrictEqual(after.files, before.files) || !digest.test(bundleSha256) || fileHash(receipt) !== manifestSha256 ||
              !path.isAbsolute(output) || !path.isAbsolute(summary)) {
            throw new Error("Final Windows host-component tar is incomplete, changed, or outside its archive-only closure");
          }
          operationTimeout();
          fs.appendFileSync(output, `bundle_sha256=${bundleSha256}\nmanifest_sha256=${manifestSha256}\nartifact_name=${componentName}.tar\n`);
          fs.appendFileSync(summary, "### Windows static host component\n- Raw artifact: " + componentName + ".tar (SHA-256 " + bundleSha256 + ").\n" +
            "- Component manifest SHA-256: " + manifestSha256 + ".\n- Build-only: true; executed: false; publication-qualified: false.\n" +
            "- No runtime execution, GPU validation or redistribution qualification was performed.\n");
          NODE

      - name: Upload only the static Windows host component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/native-windows-host-component-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
