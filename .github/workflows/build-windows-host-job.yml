            run("scripts/build-native-windows-comgr-sdk.js", ["configure", rocm.source + "/roots/rocmLlvm", windowsState.descriptor,
              windowsState.output, linuxSdk.sdk.path, "/opt/intel/oneapi/compiler/2026.2/bin/icx", resourceResult, comgrRoot, "2"], 12 * 60 * 1000);
            run("scripts/build-native-windows-comgr-sdk.js", ["build", comgrRoot], 12 * 60 * 1000);

            const hiprtcBuilder = require("./scripts/build-native-windows-hiprtc-sdk"),
              hiprtcSource = path.join(rocm.source, "roots/clr"),
              hiprtcCheckout = path.join(paths.runnerTemp, "native-windows-hiprtc-source-" + suffix),
