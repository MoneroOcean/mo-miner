name: Build one Windows LLVM SDK phase

on:
  workflow_call:
    inputs:
      phase:
        description: configure, llvm-amdgpu, bounded llvm-mid group, clang, lld, or audit
        required: true
        type: string
      run_deadline_epoch:
        description: Original configure-job Unix deadline; empty only for the first configure call
        required: false
        default: ""
        type: string
      previous_stage:
        description: Exact immediately preceding state artifact suffix; empty only for configure
        required: false
        default: ""
        type: string
      hermes_bundle_sha256:
        required: true
        type: string
      hermes_handoff_sha256:
        required: true
        type: string
      linux_tools_bundle_sha256:
        required: true
        type: string
      linux_tools_handoff_sha256:
        required: true
        type: string
      state_bundle_sha256:
        description: External SHA-256 for the previous phase archive; empty only for configure
        required: false
        default: ""
        type: string
      state_manifest_sha256:
        description: External SHA-256 for the previous phase manifest; empty only for configure
        required: false
        default: ""
        type: string
    outputs:
      run_deadline_epoch:
        description: Immutable original eight-hour run deadline
        value: ${{ jobs.windows-llvm.outputs.run_deadline_epoch }}
      bundle_sha256:
        description: SHA-256 of the newly produced raw phase-state tar
        value: ${{ jobs.windows-llvm.outputs.bundle_sha256 }}
      manifest_sha256:
        description: SHA-256 of the independent phase-state manifest
        value: ${{ jobs.windows-llvm.outputs.manifest_sha256 }}
      state_artifact_name:
        description: Exact same-run Actions artifact name containing the state tar
        value: ${{ jobs.windows-llvm.outputs.state_artifact_name }}
      manifest_artifact_name:
        description: Exact same-run Actions artifact name containing the manifest
        value: ${{ jobs.windows-llvm.outputs.manifest_artifact_name }}
      state_input_artifact_name:
        description: Exact immediately preceding state tar artifact consumed by this phase
        value: ${{ jobs.windows-llvm.outputs.state_input_artifact_name }}
      manifest_input_artifact_name:
        description: Exact immediately preceding manifest artifact consumed by this phase
        value: ${{ jobs.windows-llvm.outputs.manifest_input_artifact_name }}
      admission_sha256:
        description: Windows LLVM admission digest, set only by audit
        value: ${{ jobs.windows-llvm.outputs.admission_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  windows-llvm:
    name: Windows LLVM ${{ inputs.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOM_AOT_BUILD_ONLY: "1"
      MOM_BUILD_JOBS: "2"
      MOM_NATIVE_WINDOWS_LLVM_DIR: /tmp/mom-native-windows-llvm21-${{ github.run_id }}-${{ github.run_attempt }}
      MOM_NATIVE_WINDOWS_LLVM_HERMES_BUNDLE_SHA256: ${{ inputs.hermes_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_LLVM_HERMES_HANDOFF_SHA256: ${{ inputs.hermes_handoff_sha256 }}
      MOM_NATIVE_LINUX_LLVM_TOOLS_BUNDLE_SHA256: ${{ inputs.linux_tools_bundle_sha256 }}
      MOM_NATIVE_LINUX_LLVM_TOOLS_HANDOFF_SHA256: ${{ inputs.linux_tools_handoff_sha256 }}
      MOM_NATIVE_WINDOWS_LLVM_STATE_BUNDLE_SHA256: ${{ inputs.state_bundle_sha256 }}
      MOM_NATIVE_WINDOWS_LLVM_STATE_MANIFEST_SHA256: ${{ inputs.state_manifest_sha256 }}
      MOM_NATIVE_WINDOWS_LLVM_STATE_PREVIOUS_STAGE: ${{ inputs.previous_stage }}
      MOM_WINDOWS_LLVM_PHASE: ${{ inputs.phase }}
    outputs:
      run_deadline_epoch: ${{ steps.deadline.outputs.run_deadline_epoch }}
      bundle_sha256: ${{ steps.run-phase.outputs.bundle_sha256 }}
      manifest_sha256: ${{ steps.run-phase.outputs.manifest_sha256 }}
      state_artifact_name: ${{ steps.artifact-names.outputs.state_artifact_name }}
      manifest_artifact_name: ${{ steps.artifact-names.outputs.manifest_artifact_name }}
      state_input_artifact_name: ${{ steps.artifact-names.outputs.state_input_artifact_name }}
      manifest_input_artifact_name: ${{ steps.artifact-names.outputs.manifest_input_artifact_name }}
      admission_sha256: ${{ steps.run-phase.outputs.admission_sha256 }}
    steps:
      - name: Start immutable run and bounded job deadlines
        id: deadline
        shell: bash
        env:
          REQUESTED_RUN_DEADLINE: ${{ inputs.run_deadline_epoch }}
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          if [[ -n "$REQUESTED_RUN_DEADLINE" ]]; then
            [[ "$REQUESTED_RUN_DEADLINE" =~ ^[0-9]{10}$ ]] || { echo 'Invalid original run deadline' >&2; exit 1; }
            run_epoch=$((10#$REQUESTED_RUN_DEADLINE))
          else
            [[ "$REQUESTED_PHASE" == configure ]] || { echo 'Only configure may create the original run deadline' >&2; exit 1; }
            run_epoch=$((now + 28800))
          fi
          if (( run_epoch <= now || run_epoch - now > 28800 )); then
            echo 'Original Windows LLVM run deadline is expired or exceeds eight hours' >&2
            exit 1
          fi
          # Include cold provisioning/transfers in every phase's existing bound;
          # reserve five minutes for upload. A fast phase still exits immediately.
          job_epoch=$((now + 3300))
          if (( run_epoch < job_epoch )); then job_epoch=$run_epoch; fi
          if (( job_epoch - now < 120 )); then echo 'Insufficient time remains in the original Windows LLVM run' >&2; exit 1; fi
          {
            echo "run_deadline_epoch=$run_epoch"
            echo "job_deadline_epoch=$job_epoch"
          } >> "$GITHUB_OUTPUT"
          {
            echo "MOM_NATIVE_WINDOWS_LLVM_RUN_DEADLINE_EPOCH=$run_epoch"
            echo "MOM_NATIVE_WINDOWS_LLVM_DEADLINE_EPOCH=$job_epoch"
            echo "MOM_NATIVE_WINDOWS_HOST_SDK_DEADLINE_EPOCH=$job_epoch"
            echo "MOM_NATIVE_WINDOWS_LLVM_DESCRIPTOR_DIR=$RUNNER_TEMP/mom-native-windows-llvm21-descriptor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Validate phase, predecessor, and externally pinned inputs
        id: artifact-names
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          PREVIOUS_STAGE: ${{ inputs.previous_stage }}
          STATE_BUNDLE_SHA256: ${{ inputs.state_bundle_sha256 }}
          STATE_MANIFEST_SHA256: ${{ inputs.state_manifest_sha256 }}
          HERMES_BUNDLE_SHA256: ${{ inputs.hermes_bundle_sha256 }}
          HERMES_HANDOFF_SHA256: ${{ inputs.hermes_handoff_sha256 }}
          TOOLS_BUNDLE_SHA256: ${{ inputs.linux_tools_bundle_sha256 }}
          TOOLS_HANDOFF_SHA256: ${{ inputs.linux_tools_handoff_sha256 }}
        run: |
          set -euo pipefail
          case "$PHASE" in
            configure) expected_previous=""; output_phase=configured ;;
            llvm-amdgpu) expected_previous=configured; output_phase=$PHASE ;;
            llvm-mid) expected_previous=llvm-amdgpu; output_phase=llvm-core ;;
            clang) expected_previous=llvm-core; output_phase=$PHASE ;;
            lld) expected_previous=clang; output_phase=$PHASE ;;
            audit) expected_previous=lld; output_phase=audited ;;
            *) echo 'Unknown Windows LLVM phase' >&2; exit 1 ;;
          esac
          [[ "$PREVIOUS_STAGE" == "$expected_previous" ]] || { echo 'Previous phase is not the exact predecessor' >&2; exit 1; }
          for pin in "$HERMES_BUNDLE_SHA256" "$HERMES_HANDOFF_SHA256" "$TOOLS_BUNDLE_SHA256" "$TOOLS_HANDOFF_SHA256"; do
            [[ "$pin" =~ ^[0-9a-f]{64}$ ]] || { echo 'Missing or malformed same-run source pin' >&2; exit 1; }
          done
          if [[ "$PHASE" == configure ]]; then
            [[ -z "$STATE_BUNDLE_SHA256" && -z "$STATE_MANIFEST_SHA256" ]] || { echo 'Configure cannot consume a prior state' >&2; exit 1; }
          else
            [[ "$STATE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ && "$STATE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo 'Resume phases require externally pinned archive and manifest' >&2; exit 1;
            }
          fi
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$PREVIOUS_STAGE" in
            configured|llvm-amdgpu|llvm-core|clang|lld) input_phase=$PREVIOUS_STAGE ;;
            "") input_phase="" ;;
            *) echo 'Invalid previous state phase' >&2; exit 1 ;;
          esac
          {
            echo "output_phase=$output_phase"
            echo "state_artifact_name=native-windows-llvm-state-${suffix}-${output_phase}.tar"
            echo "manifest_artifact_name=native-windows-llvm-state-${suffix}-${output_phase}.json"
            if [[ -n "$input_phase" ]]; then
              echo "state_input_artifact_name=native-windows-llvm-state-${suffix}-${input_phase}.tar"
              echo "manifest_input_artifact_name=native-windows-llvm-state-${suffix}-${input_phase}.json"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0

      - name: Install locked Node dependencies
        timeout-minutes: 8
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Provision pinned Intel 2026.2 compiler
        timeout-minutes: 20
        run: sudo env MOM_DEV_WORKSPACE=/var/tmp/mom-dev-native-windows-llvm-${{ github.run_id }}-${{ github.run_attempt }} scripts/install-dev.sh --component oneapi --jobs 2

      - name: Download exact same-run Hermes controller state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-windows-controller-hermes-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/hermes

      - name: Download exact same-run thin Linux LLVM tools and source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-llvm-tools-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/tools

      - name: Download immediately preceding Windows LLVM state archive
        if: ${{ inputs.phase != 'configure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.artifact-names.outputs.state_input_artifact_name }}
          path: ${{ runner.temp }}/incoming/state

      - name: Download immediately preceding Windows LLVM state manifest
        if: ${{ inputs.phase != 'configure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.artifact-names.outputs.manifest_input_artifact_name }}
          path: ${{ runner.temp }}/incoming/state

      - name: Install archive and MSI extraction tools
        timeout-minutes: 8
        run: |
          # A dead first-choice mirror must not consume the whole prerequisite deadline.
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends 7zip msitools
          test -x /usr/bin/7z
          test -x /usr/bin/msiinfo
          test -x /usr/bin/msiextract

      - name: Test bounded Windows LLVM stage contracts
        timeout-minutes: 5
        run: node --require ./tests/common/no-pool-network.js --test tests/native-ci.js tests/native-sdk-fetch.js tests/native-windows-sdk.js tests/native-windows-llvm21-sdk.js tests/native-windows-llvm-state.js tests/native-windows-llvm-ci-job.js tests/native-windows-host-sdk-inputs.js tests/native-linux-llvm-tools.js

      - name: Run maintained Windows LLVM phase or group and pack its state
        id: run-phase
        timeout-minutes: 45
        env:
          MOM_WINDOWS_LLVM_PHASE: ${{ inputs.phase }}
        run: scripts/run-bounded-native-ci.sh node scripts/run-native-windows-llvm-ci.js "$MOM_WINDOWS_LLVM_PHASE"

      - name: Retain same-run Windows LLVM phase state archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact-names.outputs.state_artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact-names.outputs.state_artifact_name }}
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

      - name: Retain independent Windows LLVM phase manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact-names.outputs.manifest_artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact-names.outputs.manifest_artifact_name }}
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

      - name: Report build-only phase boundary
        env:
          MOM_WINDOWS_LLVM_PHASE: ${{ inputs.phase }}
        run: |
          {
            echo "### Windows LLVM ${{ inputs.phase }} phase/group"
            echo '- Every call provisions a fresh bounded runner, reacquires and locally composes the pinned Windows host-SDK inputs, and re-admits the same-run Hermes and thin Linux LLVM handoffs.'
            echo '- The previous Windows LLVM checkpoint is accepted only with its external archive and manifest pins. Phase tar/manifest artifacts preserve the original canonical paths and receipts for the next explicit caller job.'
            if [[ "$MOM_WINDOWS_LLVM_PHASE" == llvm-mid ]]; then
              echo '- This group runs the original NVPTX, X86, and core builder phases in order, then packs only the final core checkpoint.'
            fi
            echo '- Vendor Windows SDK archives and composed SDK files remain local to this runner; no SDK payload or persistent Actions cache is uploaded.'
            echo '- This job is build-only and is not a GPU, pool, runtime, publication, or release qualification.'
          } >> "$GITHUB_STEP_SUMMARY"
