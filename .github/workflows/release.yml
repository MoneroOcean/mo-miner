name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Serialize attempts for the same ref without interrupting an in-flight qualification.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    uses: ./.github/workflows/build-release-artifacts.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{${{ needs.build-and-test.outputs.linux_archive_artifact_name }},${{ needs.build-and-test.outputs.windows_archive_artifact_name }}}"
          path: artifacts
      - name: Verify admitted archive hashes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LINUX_ARCHIVE_SHA256: ${{ needs.build-and-test.outputs.linux_archive_sha256 }}
          EXPECTED_WINDOWS_ARCHIVE_SHA256: ${{ needs.build-and-test.outputs.windows_archive_sha256 }}
        run: scripts/ci/publish-release.sh artifacts
