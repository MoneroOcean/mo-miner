name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize attempts for the same ref and never discard a package build that may seed a cache.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test release archives
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      upload_artifacts: true

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f -print0)
          mapfile -t linux_files < <(find artifacts -type f -name 'mom-*-lin.tgz' -print)
          mapfile -t windows_files < <(find artifacts -type f -name 'mom-*-win.zip' -print)
          if (( ${#files[@]} != 2 || ${#linux_files[@]} != 1 || ${#windows_files[@]} != 1 )); then
            printf 'Expected exactly one unified Linux tgz and one unified Windows zip; found:\n' >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          meta=(--repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "mom ${GITHUB_REF_NAME}")
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Release already exists (e.g. a re-run): refresh metadata, then overwrite assets.
            gh release edit "${GITHUB_REF_NAME}" "${meta[@]}"
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" "${meta[@]}"
          fi
