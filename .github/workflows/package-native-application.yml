name: Package an admitted native application with late-bound notices

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      packed_build_bundle_sha256:
        required: true
        type: string
      raw_executable_sha256:
        required: true
        type: string
      original_build_bundle_sha256:
        required: true
        type: string
      original_handoff_sha256:
        required: true
        type: string
    outputs:
      archive_artifact_name:
        value: ${{ jobs.package.outputs.archive_artifact_name }}
      archive_sha256:
        value: ${{ jobs.package.outputs.archive_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  package:
    name: Package ${{ inputs.platform }} without rebuilding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_artifact_name: ${{ steps.package.outputs.archive_artifact_name }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    env:
      NATIVE_PLATFORM: ${{ inputs.platform }}
      PACKED_BUILD_BUNDLE_SHA256: ${{ inputs.packed_build_bundle_sha256 }}
      RAW_EXECUTABLE_SHA256: ${{ inputs.raw_executable_sha256 }}
      ORIGINAL_BUILD_BUNDLE_SHA256: ${{ inputs.original_build_bundle_sha256 }}
      ORIGINAL_HANDOFF_SHA256: ${{ inputs.original_handoff_sha256 }}
      NATIVE_NAME: native-${{ inputs.platform == 'win32' && 'windows' || 'linux' }}
      NATIVE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: cmake
        run: node scripts/ci/package-native.js preflight
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_NAME }}-executable-${{ env.NATIVE_SUFFIX }}
          path: ${{ runner.temp }}/native-package-inputs/raw
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_NAME }}-packed-executable-${{ env.NATIVE_SUFFIX }}
          path: ${{ runner.temp }}/native-package-inputs/packed-executable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "${{ env.NATIVE_NAME }}-{packed,application}-build-${{ env.NATIVE_SUFFIX }}.tar"
          merge-multiple: true
          path: ${{ runner.temp }}/incoming
      - id: package
        env:
          MOM_CMAKE_PATH: ${{ steps.cmake.outputs.path }}
        run: node scripts/ci/package-native.js package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.archive_artifact_name }}
          path: ${{ steps.package.outputs.archive_file }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.metadata_artifact_name }}
          path: ${{ steps.package.outputs.metadata_file }}
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
