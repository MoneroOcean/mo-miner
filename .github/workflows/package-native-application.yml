name: Package an admitted native application with late-bound notices

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      packed_build_bundle_sha256:
        required: true
        type: string
      raw_executable_sha256:
        required: true
        type: string
      original_build_bundle_sha256:
        required: true
        type: string
      original_handoff_sha256:
        required: true
        type: string
    outputs:
      archive_artifact_name:
        value: ${{ jobs.package.outputs.archive_artifact_name }}
      archive_sha256:
        value: ${{ jobs.package.outputs.archive_sha256 }}
      metadata_artifact_name:
        value: ${{ jobs.package.outputs.metadata_artifact_name }}

permissions:
  actions: read
  contents: read

jobs:
  package:
    name: Package ${{ inputs.platform }} without rebuilding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_artifact_name: ${{ steps.package.outputs.archive_artifact_name }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      metadata_artifact_name: ${{ steps.package.outputs.metadata_artifact_name }}
    env:
      NATIVE_PLATFORM: ${{ inputs.platform }}
      PACKED_BUILD_BUNDLE_SHA256: ${{ inputs.packed_build_bundle_sha256 }}
      RAW_EXECUTABLE_SHA256: ${{ inputs.raw_executable_sha256 }}
      ORIGINAL_BUILD_BUNDLE_SHA256: ${{ inputs.original_build_bundle_sha256 }}
      ORIGINAL_HANDOFF_SHA256: ${{ inputs.original_handoff_sha256 }}
    steps:
      - name: Checkout the packaging and admission recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test the late packaging workflow body
        timeout-minutes: 5
        run: node --test tests/native-package-ci.js
      - name: Validate same-run artifact names before downloading
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const path = require("node:path"), env = process.env, suffix = env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT,
            platform = env.NATIVE_PLATFORM === "win32" ? "windows" : env.NATIVE_PLATFORM,
            hashes = [env.PACKED_BUILD_BUNDLE_SHA256, env.RAW_EXECUTABLE_SHA256, env.ORIGINAL_BUILD_BUNDLE_SHA256,
              env.ORIGINAL_HANDOFF_SHA256], {checkNativeNoticeReview} = require("./scripts/check-native-notices");
          if (!/^[0-9]{1,20}-[1-9][0-9]{0,5}$/.test(suffix) || !["linux", "win32"].includes(env.NATIVE_PLATFORM) ||
              !["linux", "windows"].includes(platform) ||
              !hashes.every(pin => /^[a-f0-9]{64}$/.test(pin || "")) ||
              !path.isAbsolute(env.GITHUB_WORKSPACE || "")) {
            throw new Error("Late native packaging needs this run attempt's exact platform, workspace and build SHA-256 pins");
          }
          checkNativeNoticeReview();
          NODE
      - name: Resolve CMake before artifact downloads
        id: cmake
        shell: bash
        run: |
          set -euo pipefail
          cmake_path="$(command -v cmake || true)"
          if [[ -z "$cmake_path" ]]; then
            printf 'CMake is required for native package creation and archive audit.\n' >&2
            exit 1
          fi
          if ! cmake_path="$(realpath -e -- "$cmake_path")"; then
            printf 'CMake on PATH could not be resolved to a canonical file.\n' >&2
            exit 1
          fi
          if [[ ! "$cmake_path" = /* || "$cmake_path" =~ [[:cntrl:]] || ! -f "$cmake_path" || ! -x "$cmake_path" ]]; then
            printf 'CMake on PATH is not a canonical absolute executable file.\n' >&2
            exit 1
          fi
          if ! cmake_version="$("$cmake_path" --version 2>&1)"; then
            printf 'CMake on PATH failed its version check.\n' >&2
            exit 1
          fi
          cmake_version_line="${cmake_version%%$'\n'*}"
          if [[ ! "$cmake_version_line" =~ ^cmake\ version[[:space:]][0-9]+(\.[0-9]+){1,2}([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'CMake on PATH returned an invalid version banner.\n' >&2
            exit 1
          fi
          printf 'path=%s\n' "$cmake_path" >> "$GITHUB_OUTPUT"
      - name: Download the original raw executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ inputs.platform == 'win32' && 'windows' || 'linux' }}-executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-package-inputs/raw
      - name: Download the packed executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ inputs.platform == 'win32' && 'windows' || 'linux' }}-packed-executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-package-inputs/packed-executable
      - name: Download the complete packed build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ inputs.platform == 'win32' && 'windows' || 'linux' }}-packed-build-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-package-inputs/packed-build
      - name: Download the original application build handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ inputs.platform == 'win32' && 'windows' || 'linux' }}-application-build-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-package-inputs/original-build
      - name: Admit build evidence, package, and audit the archive without runtime execution
        id: package
        env:
          MOM_CMAKE_PATH: ${{ steps.cmake.outputs.path }}
        timeout-minutes: 25
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path"), {spawnSync} = require("node:child_process"),
            ci = require("./scripts/prepare-native-ci"), {fileHash, readBuildJson} = require("./scripts/build-source-inputs"),
            {auditNativeRelease} = require("./scripts/check-native-release"), {packageNativeRelease} = require("./scripts/package-native-release"),
            {checkNativeNoticeReview} = require("./scripts/check-native-notices"),
            env = process.env, temp = env.RUNNER_TEMP || "", suffix = (env.GITHUB_RUN_ID || "") + "-" + (env.GITHUB_RUN_ATTEMPT || ""),
            platform = env.NATIVE_PLATFORM === "win32" ? "windows" : env.NATIVE_PLATFORM,
            target = platform === "windows" ? "win32" : "linux", binary = platform === "windows" ? "mom.exe" : "mom",
            roots = {
              packed: `native-${platform}-packed-build-${suffix}`,
              original: `native-${platform}-application-build-${suffix}`,
            },
            inputDirs = Object.fromEntries(["raw", "packed-executable", "packed-build", "original-build"].map(name =>
              [name, path.join(temp, "native-package-inputs", name)])),
            tarFiles = {
              packed: path.join(inputDirs["packed-build"], roots.packed + ".tar"),
              original: path.join(inputDirs["original-build"], roots.original + ".tar"),
            },
            rawDownload = path.join(inputDirs["raw"], binary), packedDownload = path.join(inputDirs["packed-executable"], binary),
            rawDirectory = path.join(temp, "native-raw"), raw = path.join(rawDirectory, binary), producer = path.join(rawDirectory, "result.json"),
            originalRoot = path.join("/tmp", roots.original), packedRoot = path.join("/tmp", roots.packed),
            originalEntry = path.join(originalRoot, "entrypoint.json"), originalConfig = path.join(originalRoot, "application-config.json"),
            runTempConfig = path.join(temp, target === "linux" ? `native-linux-assembly-config-${suffix}.json` : `native-windows-application-config-${suffix}.json`),
            entrypoint = path.join(packedRoot, "entrypoint.json"), packReceipt = path.join(packedRoot, "result.json"),
            repoRoot = fs.realpathSync(process.cwd()), noticeBody = path.join(repoRoot, "THIRD-PARTY-NOTICES.txt"),
            noticeManifest = path.join(repoRoot, "runtime/native-notice-review.json"),
            outputRoot = path.join(temp, `native-${platform}-package-output-${suffix}`),
            metadataName = `native-${platform}-package-metadata-${suffix}`, metadataRoot = path.join(outputRoot, metadataName),
            metadataTar = path.join(temp, metadataName + ".tar"), cmake = env.MOM_CMAKE_PATH || "";
          const hashPattern = /^[a-f0-9]{64}$/;
          const fail = message => {throw new Error(message);};
          const canonicalExecutable = file => {
            if (!file || !path.isAbsolute(file) || path.resolve(file) !== file || /[\u0000-\u001f\u007f]/.test(file)) {return false;}
            try {
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.isSymbolicLink() || fs.realpathSync(file) !== file) {return false;}
              fs.accessSync(file, fs.constants.X_OK);
              return true;
            } catch {return false;}
          };
          if (!canonicalExecutable(cmake)) {fail("Resolved CMake path is missing, non-executable or non-canonical");}
          const regular = (file, pin, maximum, label) => {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 || stat.size > maximum ||
                path.resolve(file) !== file || fs.realpathSync(file) !== file) {
              fail("Invalid or unpinned native packaging " + label);
            }
            const sha256 = fileHash(file);
            if (pin !== null && (!hashPattern.test(pin || "") || sha256 !== pin)) {fail("Invalid or unpinned native packaging " + label);}
            return {bytes: stat.size, mode: stat.mode, sha256};
          };
          const exactDirectory = (directory, names, label) => {
            const stat = fs.lstatSync(directory);
            if (!stat.isDirectory() || stat.isSymbolicLink() || path.resolve(directory) !== directory || fs.realpathSync(directory) !== directory ||
                fs.readdirSync(directory).sort().join("\0") !== [...names].sort().join("\0")) {fail("Unexpected native packaging " + label + " contents");}
          };
          const runTarList = (archive, expected, maxExpanded) => {
            const members = ci.listState(archive, [path.basename(expected[0] || "")], 60000),
              normalized = members.map(name => name.replace(/\/$/, "")).sort(), wanted = [...expected].sort();
            if (normalized.length !== wanted.length || normalized.join("\0") !== wanted.join("\0")) {
              fail("Native packaging tar has missing or unexpected members");
            }
            const expanded = ci.tarExpandedBytes(archive, members.length, 60000);
            if (expanded > maxExpanded) {fail("Native packaging tar exceeds its bounded expansion limit");}
            const listed = spawnSync("/usr/bin/tar", ["--list", "--verbose", "--numeric-owner", "--full-time", "--quoting-style=literal", "--file", archive],
              {encoding: "utf8", timeout: 60000, maxBuffer: 8 << 20, windowsHide: true});
            const lines = typeof listed.stdout === "string" ? listed.stdout.replace(/\r/g, "").split("\n").filter(Boolean) : [];
            if (listed.error || listed.signal || listed.status !== 0 || lines.length !== members.length ||
                members.some((name, index) => {
                  const line = lines[index] || "", normalizedName = name.replace(/\/$/, ""), isDirectory = name.endsWith("/");
                  return line[0] !== (isDirectory ? "d" : "-") ||
                    !(line.endsWith(" " + name) || isDirectory && line.endsWith(" " + normalizedName));
                })) {fail("Native packaging tar contains a link, special file or ambiguous member listing");}
            return members;
          };
          if (!/^[0-9]{1,20}-[1-9][0-9]{0,5}$/.test(suffix) || !["linux", "win32"].includes(env.NATIVE_PLATFORM) ||
              !["linux", "windows"].includes(platform) ||
              ![env.PACKED_BUILD_BUNDLE_SHA256, env.RAW_EXECUTABLE_SHA256, env.ORIGINAL_BUILD_BUNDLE_SHA256,
                env.ORIGINAL_HANDOFF_SHA256].every(pin => hashPattern.test(pin || "")) || path.resolve(temp) !== temp || fs.realpathSync(temp) !== temp ||
              repoRoot !== path.resolve(process.cwd()) || repoRoot !== path.resolve(env.GITHUB_WORKSPACE || "") ||
              fs.existsSync(rawDirectory) || fs.existsSync(originalRoot) || fs.existsSync(packedRoot) ||
              fs.existsSync(runTempConfig) || fs.existsSync(outputRoot) || fs.existsSync(metadataRoot) || fs.existsSync(metadataTar) ||
              !path.isAbsolute(env.GITHUB_OUTPUT || "") || !path.isAbsolute(env.GITHUB_STEP_SUMMARY || "")) {
            fail("Late native package paths, pins, platform or run identity differ from the exact fresh attempt plan");
          }
          for (const directory of Object.values(inputDirs)) {
            if (path.dirname(directory) !== path.join(temp, "native-package-inputs")) {fail("Native download directory escaped its bounded root");}
            const stat = fs.lstatSync(directory);
            if (!stat.isDirectory() || stat.isSymbolicLink() || fs.realpathSync(directory) !== directory) {fail("Native download root is not canonical");}
          }
          const noticeReview = checkNativeNoticeReview(undefined, noticeBody),
            noticeManifestInfo = regular(noticeManifest, null, 2 << 20, "notice review manifest"),
            reviewedNoticeInfo = regular(noticeBody, noticeReview.notice?.sha256, 8 << 20, "reviewed third-party notices");
          if (noticeReview.version !== 1 || !noticeReview.dependencies || typeof noticeReview.dependencies !== "object" ||
              Array.isArray(noticeReview.dependencies) || noticeReview.notice?.bytes !== reviewedNoticeInfo.bytes) {
            fail("Native notice review did not admit the tracked notice body and dependency snapshot");
          }
          const assertNoticeReviewStable = () => {
            const manifest = regular(noticeManifest, null, 2 << 20, "notice review manifest"),
              notice = regular(noticeBody, null, 8 << 20, "reviewed third-party notices");
            if (manifest.sha256 !== noticeManifestInfo.sha256 || manifest.bytes !== noticeManifestInfo.bytes ||
                notice.sha256 !== noticeReview.notice.sha256 || notice.bytes !== noticeReview.notice.bytes) {
              fail("Reviewed notice body or manifest changed during packaging");
            }
          };
          const noticeReviewAudit = {version: 1, manifest: {file: "runtime/native-notice-review.json",
            bytes: noticeManifestInfo.bytes, sha256: noticeManifestInfo.sha256}, snapshot: noticeReview};
          const singleDownload = (directory, name, pin, maximum, label) => {
            exactDirectory(directory, [name], label + " artifact");
            return regular(path.join(directory, name), pin, maximum, label);
          };
          const rawInfo = singleDownload(inputDirs["raw"], binary, env.RAW_EXECUTABLE_SHA256, (1 << 30) - 1, "raw executable"),
            packedInfo = singleDownload(inputDirs["packed-executable"], binary, null, (1 << 30) - 1, "packed executable");
          exactDirectory(inputDirs["packed-build"], [roots.packed + ".tar"], "packed-build bundle");
          exactDirectory(inputDirs["original-build"], [roots.original + ".tar"], "original-build bundle");
          regular(tarFiles.packed, env.PACKED_BUILD_BUNDLE_SHA256, 128 << 20, "packed-build bundle");
          regular(tarFiles.original, env.ORIGINAL_BUILD_BUNDLE_SHA256, 128 << 20, "original-build bundle");

          const packedExpected = [roots.packed, ...[binary, "entrypoint.json", "result.json", "pack.log", "integrity.log", "restore.log"].map(name => `${roots.packed}/${name}`)],
            originalExpected = [roots.original, ...["application-config.json", "entrypoint.json", "handoff.json", "result.json"].map(name => `${roots.original}/${name}`)];
          runTarList(tarFiles.packed, packedExpected, 128 << 20);
          runTarList(tarFiles.original, originalExpected, 128 << 20);
          ci.extractState(tarFiles.packed, "/tmp", [roots.packed], [roots.packed], 60000);
          ci.extractState(tarFiles.original, "/tmp", [roots.original], [roots.original], 60000);
          exactDirectory(packedRoot, [binary, "entrypoint.json", "result.json", "pack.log", "integrity.log", "restore.log"], "restored packed candidate");
          exactDirectory(originalRoot, ["application-config.json", "entrypoint.json", "handoff.json", "result.json"], "restored original handoff");
          const packedArtifact = regular(path.join(packedRoot, binary), null, (1 << 30) - 1, "packed candidate"),
            candidateEntryInfo = regular(entrypoint, null, 8 << 20, "packed entrypoint"),
            packInfo = regular(packReceipt, null, 8 << 20, "packing receipt"),
            originInfo = regular(originalEntry, null, 8 << 20, "original entrypoint"),
            handoffFile = path.join(originalRoot, "handoff.json"), handoffInfo = regular(handoffFile, env.ORIGINAL_HANDOFF_SHA256, 8 << 20, "original handoff"),
            originProducer = path.join(originalRoot, "result.json"), originProducerInfo = regular(originProducer, null, 128 << 20, "original producer receipt"),
            originConfigInfo = regular(originalConfig, null, 8 << 20, "original application config"),
            candidate = readBuildJson(entrypoint), origin = readBuildJson(originalEntry), handoff = readBuildJson(handoffFile),
            packing = readBuildJson(packReceipt);
          if (packedArtifact.sha256 !== packedInfo.sha256 || packedArtifact.bytes !== packedInfo.bytes ||
              packInfo.sha256 !== candidate.packingReceipt?.sha256 ||
              candidate.version !== 1 || candidate.target !== target || candidate.buildOnly !== true || candidate.publicationQualified !== false ||
              candidate.artifact?.path !== path.join(packedRoot, binary) || candidate.artifact.sha256 !== packedArtifact.sha256 || candidate.artifact.bytes !== packedArtifact.bytes ||
              candidate.source?.path !== raw || candidate.source.sha256 !== env.RAW_EXECUTABLE_SHA256 || candidate.source.bytes !== rawInfo.bytes ||
              candidate.sourceEntrypoint?.path !== originalEntry || candidate.sourceEntrypoint.sha256 !== originInfo.sha256 ||
              candidate.producerReceipt?.path !== producer || candidate.producerReceipt.sha256 !== originProducerInfo.sha256 ||
              candidate.packingReceipt?.path !== packReceipt || candidate.packingReceipt.sha256 !== packInfo.sha256 ||
              candidate.configFile !== runTempConfig || candidate.configHash !== origin.configHash ||
              !handoff || handoff.version !== 1 || handoff.format !== `mom-${platform}-application-build-handoff-v1` || handoff.runAttempt !== suffix ||
              handoff.target !== (target === "win32" ? "x86_64-pc-windows-msvc" : "x86_64-unknown-linux-gnu") ||
              handoff.buildOnly !== true || handoff.executed !== false || handoff.publicationQualified !== false ||
              handoff.artifact?.file !== binary || handoff.artifact.sha256 !== env.RAW_EXECUTABLE_SHA256 || handoff.artifact.bytes !== rawInfo.bytes ||
              handoff.config?.file !== "application-config.json" || handoff.config.sha256 !== originConfigInfo.sha256 ||
              handoff.entrypointReceipt?.file !== "entrypoint.json" || handoff.entrypointReceipt.sha256 !== originInfo.sha256 ||
              handoff.producerReceipt?.file !== "result.json" || handoff.producerReceipt.sha256 !== originProducerInfo.sha256 ||
              origin.version !== 1 || origin.target !== target || origin.buildOnly !== true || origin.publicationQualified !== false ||
              origin.source?.path !== path.join(target === "linux" ? "/tmp" : temp,
                target === "linux" ? `mom-native-linux-application-${suffix}` : `native-windows-application-output-${suffix}`, binary) ||
              origin.source.sha256 !== env.RAW_EXECUTABLE_SHA256 || origin.artifact?.path !== origin.source.path ||
              origin.artifact.sha256 !== env.RAW_EXECUTABLE_SHA256 || origin.artifact.bytes !== rawInfo.bytes ||
              origin.producerReceipt?.sha256 !== originProducerInfo.sha256 || origin.configFile !== runTempConfig ||
              origin.configHash !== originConfigInfo.sha256 ||
              packing.source?.path !== raw || packing.source.sha256 !== env.RAW_EXECUTABLE_SHA256 || packing.source.bytes !== rawInfo.bytes ||
              packing.artifact?.path !== path.join(packedRoot, binary) || packing.artifact.sha256 !== packedArtifact.sha256 ||
              packing.artifact.bytes !== packedArtifact.bytes || packing.buildOnly !== true || packing.publicationQualified !== false ||
              Object.keys(packing.logs || {}).sort().join(",") !== "integrity,pack,restore") {
            fail("Packed artifact, original handoff, raw executable or retained packing evidence does not join the pinned run attempt");
          }
          for (const stage of ["pack", "integrity", "restore"]) {
            const logPath = path.join(packedRoot, stage + ".log"), row = packing.logs[stage];
            if (row?.path !== logPath || !hashPattern.test(row.sha256 || "")) {fail("Packed receipt has an invalid " + stage + " log binding");}
            regular(logPath, row.sha256, 8 << 20, stage + " log");
          }
          fs.mkdirSync(rawDirectory, {mode: 0o700});
          fs.copyFileSync(rawDownload, raw, fs.constants.COPYFILE_EXCL);
          fs.copyFileSync(originProducer, producer, fs.constants.COPYFILE_EXCL);
          fs.copyFileSync(originalConfig, runTempConfig, fs.constants.COPYFILE_EXCL);
          if (regular(raw, env.RAW_EXECUTABLE_SHA256, (1 << 30) - 1, "restored raw executable").bytes !== rawInfo.bytes ||
              regular(producer, originProducerInfo.sha256, 128 << 20, "unchanged producer receipt").sha256 !== originProducerInfo.sha256 ||
              regular(runTempConfig, originConfigInfo.sha256, 8 << 20, "restored original config").sha256 !== originConfigInfo.sha256) {
            fail("Restored raw/config/producer bytes differ from their original same-run pins");
          }
          const preAudit = auditNativeRelease(entrypoint);
          if (preAudit.scope !== "build-audit" || preAudit.target !== target || preAudit.buildEvidencePassed !== true ||
              preAudit.runtimeTested !== false || preAudit.publicationQualified !== false ||
              preAudit.sourceSha256 !== env.RAW_EXECUTABLE_SHA256 || preAudit.sha256 !== packedArtifact.sha256 || preAudit.bytes !== packedArtifact.bytes ||
              fileHash(entrypoint) !== candidateEntryInfo.sha256) {
            fail("Existing build-only audit did not admit the packed candidate and its original build chain");
          }
          const version = require("./package.json").version, lateNotice = {output: outputRoot, notices: noticeBody},
            archiveName = `mom-v${version}-${target === "win32" ? "win.zip" : "lin.tgz"}`,
            archivePath = path.join(outputRoot, archiveName), packageReceipt = path.join(outputRoot, "native-package.json");
          assertNoticeReviewStable();
          let packaged;
          try {packaged = packageNativeRelease(entrypoint, cmake, version, undefined, lateNotice);}
          finally {assertNoticeReviewStable();}
          if (packaged.archive?.path !== archivePath || packaged.archive.sha256 !== fileHash(archivePath) ||
              packaged.executable?.path !== path.join(packedRoot, binary) || packaged.executable.sha256 !== packedArtifact.sha256 ||
              packaged.executable.bytes !== packedArtifact.bytes || packaged.buildOnly !== true || packaged.publicationQualified !== false ||
              packaged.members?.join("\0") !== [binary, "THIRD-PARTY-NOTICES.txt"].join("\0")) {
            fail("Existing late-notice package API returned a receipt for different bytes or members");
          }
          const archiveInfo = regular(archivePath, packaged.archive.sha256, 1 << 30, "native release archive"),
            packageInfo = regular(packageReceipt, null, 8 << 20, "native package receipt");
          if (archiveInfo.bytes !== packaged.archive.bytes ||
              regular(path.join(outputRoot, "THIRD-PARTY-NOTICES.txt"), noticeReview.notice.sha256, 8 << 20,
                "packaged third-party notices").bytes !== noticeReview.notice.bytes) {
            fail("Late package archive bytes or selected notice body are missing");
          }
          const postAudit = auditNativeRelease(entrypoint, {archive: {path: archivePath, tool: cmake}});
          if (postAudit.scope !== "build-audit" || postAudit.target !== target || postAudit.archiveChecked !== true ||
              postAudit.buildEvidencePassed !== true || postAudit.runtimeTested !== false || postAudit.publicationQualified !== false ||
              postAudit.sha256 !== packedArtifact.sha256 || postAudit.archiveSha256 !== packaged.archive.sha256 ||
              fileHash(entrypoint) !== candidateEntryInfo.sha256) {
            fail("Existing archive audit did not admit the exact two-member build-only package");
          }
          fs.mkdirSync(metadataRoot, {mode: 0o700});
          fs.copyFileSync(packageReceipt, path.join(metadataRoot, "native-package.json"), fs.constants.COPYFILE_EXCL);
          fs.writeFileSync(path.join(metadataRoot, "build-audit.json"), JSON.stringify({beforePackaging: preAudit, archive: postAudit}, null, 2) + "\n",
            {flag: "wx", mode: 0o600});
          fs.writeFileSync(path.join(metadataRoot, "native-notice-review.json"), JSON.stringify(noticeReviewAudit, null, 2) + "\n",
            {flag: "wx", mode: 0o600});
          regular(path.join(metadataRoot, "native-notice-review.json"), null, 8 << 20, "notice review snapshot");
          if (regular(path.join(metadataRoot, "native-package.json"), packageInfo.sha256, 8 << 20, "copied package receipt").sha256 !== packageInfo.sha256) {
            fail("Package receipt changed while retaining the audit metadata");
          }
          const metadataBundle = ci.packState(metadataTar, outputRoot, [metadataName], 60000),
            metadataExpected = [metadataName, `${metadataName}/build-audit.json`, `${metadataName}/native-package.json`,
              `${metadataName}/native-notice-review.json`],
            metadataBundleInfo = regular(metadataTar, null, 16 << 20, "package metadata tar");
          if (!Number.isSafeInteger(metadataBundle?.bytes) || metadataBundle.bytes < 1 || metadataBundle.bytes > 16 << 20 ||
              metadataBundle.bytes !== metadataBundleInfo.bytes) {fail("Native package metadata tar exceeds its bounded receipt-only size");}
          runTarList(metadataTar, metadataExpected, 16 << 20);
          const archiveArtifactName = `native-${platform}-application-package-${suffix}`,
            metadataArtifactName = metadataName + ".tar", outputFile = env.GITHUB_OUTPUT || "";
          fs.appendFileSync(outputFile, `archive_artifact_name=${archiveArtifactName}\narchive_sha256=${packaged.archive.sha256}\n` +
            `archive_file=${archivePath}\nmetadata_artifact_name=${metadataArtifactName}\nmetadata_file=${metadataTar}\n`);
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY || "", `### Late-notice ${platform} package\n` +
            `- Archive SHA-256: \`${packaged.archive.sha256}\`; members are exactly \`${binary}\` and \`THIRD-PARTY-NOTICES.txt\`.\n` +
            "- The unchanged packed candidate passed build-evidence and archive audits; no candidate execution or publication qualification occurred.\n");
          NODE
      - name: Upload the exact two-member release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.archive_artifact_name }}
          path: ${{ steps.package.outputs.archive_file }}
          if-no-files-found: error
          archive: true
          compression-level: 0
          retention-days: 1
      - name: Upload package and audit receipts separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.metadata_artifact_name }}
          path: ${{ steps.package.outputs.metadata_file }}
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
