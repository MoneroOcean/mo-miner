name: Stability

# Pull requests and pushes run the fast source gates only. The complete cold native build, runtime lanes
# and packaging run only on demand (and on every release tag via release.yml).
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: stability-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/source-gates.yml

  native:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-release-artifacts.yml
