name: Stability

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A cold LLVM/AdaptiveCpp seed is hours of reusable work. Queue a newer push behind it so the
  # cache is saved instead of cancelling near completion and rebuilding the same compiler.
  group: stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test release archives
    uses: ./.github/workflows/build-release-artifacts.yml
