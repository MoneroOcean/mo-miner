name: Stability

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Keep qualification runs serialized per ref without interrupting an in-flight native run.
  group: stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test release archives
    uses: ./.github/workflows/build-release-artifacts.yml
