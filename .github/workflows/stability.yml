name: Stability

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Keep same-commit retries serialized; fixes need not wait for an older commit's remaining evidence.
  group: stability-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test release archives
    uses: ./.github/workflows/build-release-artifacts.yml
