name: Build one Linux native component

on:
  workflow_call:
    inputs:
      profile:
        description: The exact native Core or GPU factory profile to build
        required: true
        type: string
    outputs:
      bundle_sha256:
        description: SHA-256 of the raw producer tar retained by this workflow
        value: ${{ jobs.component.outputs.bundle_sha256 }}

permissions:
  actions: read
  contents: read

env:
  MOM_AOT_BUILD_ONLY: "1"
  MOM_BUILD_JOBS: "2"
  MOM_NATIVE_SOURCE_DIR: /tmp/mom-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_SDK_DIR: /tmp/mom-native-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_IO_SOURCE_DIR: /tmp/mom-native-io-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_IO_SDK_DIR: /tmp/mom-native-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_HERMES_SOURCE_DIR: /tmp/mom-native-hermes-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_HERMES_SDK_DIR: /tmp/mom-native-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ACPP_SOURCE_DIR: /tmp/mom-native-acpp-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_SOURCES_DIR: /tmp/mom-native-linux-source-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_DPCPP_CUDA_INPUTS_DIR: /tmp/mom-native-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_GNU_HEADERS_DIR: /tmp/mom-native-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_WINDOWS_GNU_HEADERS_DIR: /tmp/mom-native-windows-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_JIT_RESOURCES_DIR: /tmp/mom-native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_JIT_SDK_DIR: /tmp/mom-native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_SOURCE_DIR: /tmp/mom-native-rocm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_COMGR_SDK_DIR: /tmp/mom-native-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_RESOURCES_DIR: /tmp/mom-native-rocm-resources-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_HIP_HEADERS_DIR: /tmp/mom-native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_HOST_SDK_DIR: /tmp/mom-native-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ZSTD_SOURCE_DIR: /tmp/mom-native-zstd-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ZSTD_SDK_DIR: /tmp/mom-native-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_OPENMP_SDK_DIR: /tmp/mom-native-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ACPP_CUDA_HIP_SDK_DIR: /tmp/mom-native-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_SOURCE_DIR: /tmp/mom-native-nvrtc-linux-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_SDK_DIR: /tmp/mom-native-nvrtc-linux-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_126_SOURCE_DIR: /tmp/mom-native-nvrtc-linux-12.6-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_126_SDK_DIR: /tmp/mom-native-nvrtc-linux-12.6-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_CUDA_IMAGES_DIR: /tmp/mom-native-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_SDK_DESCRIPTOR_DIR: /tmp/mom-native-linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_WINDOWS_SOURCE_DIR: /tmp/mom-native-nvrtc-windows-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_WINDOWS_SDK_DIR: /tmp/mom-native-nvrtc-windows-sdk-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  component:
    name: Build Linux component / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bundle_sha256: ${{ steps.seal.outputs.bundle_sha256 }}
    steps:
      - name: Start the bounded component deadline
        id: component-deadline
        shell: bash
        run: echo "epoch=$(( $(date +%s) + 3300 ))" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Install pinned native-build tooling and AOT dependencies
        timeout-minutes: 10
        run: |
          sudo env MOM_DEV_WORKSPACE=/var/tmp/mom-dev-native-component-${{ github.run_id }}-${{ github.run_attempt }} \
            scripts/install-dev.sh --component node --jobs 2
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'for (const name of ["buffer/", "events/", "string_decoder/", "core-js-pure"]) require.resolve(name); require("esbuild").transformSync("const ready = 1");'
      - name: Validate the requested Core or GPU profile
        id: component-profile
        env:
          NATIVE_PROFILE: ${{ inputs.profile }}
        run: |
          node <<'NODE'
          const ci = require("./scripts/prepare-native-ci.js"), profile = process.env.NATIVE_PROFILE || "";
          if (profile !== "core" && !ci.linuxNativeGpuProfiles.includes(profile)) {
            throw new Error("Select one exact Linux Core or GPU factory profile");
          }
          NODE
      - name: Download the exact same-run SDK descriptor and producer tars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-{linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources,linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }},linux-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }},linux-cuda-images-${{ github.run_id }}-${{ github.run_attempt }},linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-static-dpcpp,acpp-state-${{ github.run_id }}-${{ github.run_attempt }}-sources,linux-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}}.tar
          merge-multiple: true
          path: ${{ runner.temp }}/downloads
      - name: Build exactly the requested maintained component
        timeout-minutes: 50
        env:
          MOM_NATIVE_COMPONENT_DEADLINE_EPOCH: ${{ steps.component-deadline.outputs.epoch }}
          NATIVE_PROFILE: ${{ inputs.profile }}
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage linux-native-component "$NATIVE_PROFILE"
      - name: Seal the exact producer archive for downstream admission
        id: seal
        env:
          NATIVE_PROFILE: ${{ inputs.profile }}
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path");
          const ci = require("./scripts/prepare-native-ci.js"), {fileHash} = require("./scripts/build-source-inputs.js");
          const profile = process.env.NATIVE_PROFILE || "";
          if (profile !== "core" && !ci.linuxNativeGpuProfiles.includes(profile)) {
            throw new Error("Select one exact Linux Core or GPU factory profile");
          }
          const paths = ci.ciPaths(), state = ci.linuxNativeComponentStatePaths(paths, profile), archive = state.archive;
          const stat = fs.lstatSync(archive);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 || stat.size > 16 * 1024 ** 3 ||
              fs.realpathSync(archive) !== archive) {
            throw new Error("Linux component handoff must be a bounded canonical singly-linked regular tar");
          }
          if (!ci.listState(archive, [state.name]).includes(state.name + "/component.json")) {
            throw new Error("Linux component handoff is missing its producer manifest");
          }
          const sha256 = fileHash(archive), output = process.env.GITHUB_OUTPUT || "";
          if (!/^[a-f0-9]{64}$/.test(sha256) || !path.isAbsolute(output)) {
            throw new Error("Linux component SHA-256 or GitHub output path is invalid");
          }
          fs.appendFileSync(output, "bundle_sha256=" + sha256 + "\n", {flag: "a"});
          NODE
      - name: Retain bounded component logs on failure
        if: failure() && steps.component-profile.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-component-${{ inputs.profile }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mom-native-linux-component-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}/logs
          if-no-files-found: warn
          archive: true
          compression-level: 0
          retention-days: 1
      - name: Retain the unchanged Linux component producer output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-component-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-component-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
