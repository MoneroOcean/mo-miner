        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download frontend phase mutable source-JIT state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-frontend.tar
          path: ${{ runner.temp }}/incoming
      - name: Link the proof executable and capture the final receipt
        timeout-minutes: 55
        env:
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage linux-jit-link
      - name: Retain linked mutable source-JIT state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-link.tar
          path: ${{ runner.temp }}/native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-link.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Package the proof-only CPU runtime fixture
        id: retain-runtime-proof
        run: node scripts/prepare-native-ci.js stage linux-jit-runtime-proof
      - name: Retain same-run proof-only runtime fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-jit-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar
