      dpcpp_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}
      images_bundle_sha256: ${{ needs.build-linux-cuda-images.outputs.bundle_sha256 }}

  build-windows-opencl-gpu:
    name: Build Windows portable OpenCL GPU factory from original inputs
    needs: [linux-sources, provision-linux-dpcpp-cuda-inputs, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-gpu-job.yml
    with:
      profile: dpcpp-opencl
      source_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      dpcpp_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  build-windows-acpp-cuda-gpu:
    name: Build Windows AdaptiveCpp CUDA GPU factory from original inputs
    needs: [linux-sources, fetch-linux-acpp-sources, build-linux-acpp-cuda-hip-sdk, install-audit-linux-sdk, provision-linux-dpcpp-cuda-inputs, build-linux-cuda-images]
    uses: ./.github/workflows/build-windows-gpu-job.yml
    with:
      profile: acpp-cuda
      source_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      acpp_source_bundle_sha256: ${{ needs.fetch-linux-acpp-sources.outputs.bundle_sha256 }}
      acpp_sdk_bundle_sha256: ${{ needs.build-linux-acpp-cuda-hip-sdk.outputs.bundle_sha256 }}
      frontend_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.frontend_bundle_sha256 }}
      frontend_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.frontend_handoff_sha256 }}
      tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}
      dpcpp_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      images_bundle_sha256: ${{ needs.build-linux-cuda-images.outputs.bundle_sha256 }}

  build-windows-acpp-hip-gpu:
    name: Build Windows AdaptiveCpp HIP GPU factory from original inputs
    needs: [linux-sources, fetch-linux-acpp-sources, build-linux-acpp-cuda-hip-sdk, install-audit-linux-sdk, build-linux-rocm-comgr-sdk]
    uses: ./.github/workflows/build-windows-gpu-job.yml
    with:
      profile: acpp-hip
      hip_headers_bundle_sha256: ${{ needs.build-linux-rocm-comgr-sdk.outputs.hip_headers_bundle_sha256 }}
      hip_headers_handoff_sha256: ${{ needs.build-linux-rocm-comgr-sdk.outputs.hip_headers_handoff_sha256 }}
      source_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      acpp_source_bundle_sha256: ${{ needs.fetch-linux-acpp-sources.outputs.bundle_sha256 }}
      acpp_sdk_bundle_sha256: ${{ needs.build-linux-acpp-cuda-hip-sdk.outputs.bundle_sha256 }}
      frontend_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.frontend_bundle_sha256 }}
      frontend_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.frontend_handoff_sha256 }}
      tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  assemble-windows-native-application:
    name: Assemble the complete standalone Windows application
    needs: [build-windows-native-core, build-windows-dpcpp-component, build-windows-host-component,
      build-windows-controller-sdk, build-linux-hermes-sdk, install-audit-linux-sdk,
      provision-linux-dpcpp-cuda-inputs, linux-sources, build-linux-rocm-comgr-sdk, build-linux-cuda-images,
      build-windows-oneapi-gpu, build-windows-dpcpp-gpu, build-windows-opencl-gpu,
      build-windows-acpp-cuda-gpu, build-windows-acpp-hip-gpu]
    uses: ./.github/workflows/build-windows-application-job.yml
    with:
      core_bundle_sha256: ${{ needs.build-windows-native-core.outputs.bundle_sha256 }}
      core_handoff_sha256: ${{ needs.build-windows-native-core.outputs.handoff_sha256 }}
      dpcpp_component_bundle_sha256: ${{ needs.build-windows-dpcpp-component.outputs.bundle_sha256 }}
      dpcpp_component_manifest_sha256: ${{ needs.build-windows-dpcpp-component.outputs.component_manifest_sha256 }}
      host_component_bundle_sha256: ${{ needs.build-windows-host-component.outputs.component_bundle_sha256 }}
      host_component_manifest_sha256: ${{ needs.build-windows-host-component.outputs.component_manifest_sha256 }}
      windows_io_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.io_bundle_sha256 }}
      windows_io_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.io_handoff_sha256 }}
      windows_hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      windows_hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_hermes_bundle_sha256: ${{ needs.build-linux-hermes-sdk.outputs.bundle_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}
      dpcpp_inputs_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_inputs_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      linux_sources_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      hip_headers_bundle_sha256: ${{ needs.build-linux-rocm-comgr-sdk.outputs.hip_headers_bundle_sha256 }}
      hip_headers_handoff_sha256: ${{ needs.build-linux-rocm-comgr-sdk.outputs.hip_headers_handoff_sha256 }}
      cuda_images_bundle_sha256: ${{ needs.build-linux-cuda-images.outputs.bundle_sha256 }}
      gpu_handoffs_json: |
        [
          {"profile":"oneapi","bundleSha256":"${{ needs.build-windows-oneapi-gpu.outputs.bundle_sha256 }}","receiptSha256":"${{ needs.build-windows-oneapi-gpu.outputs.result_sha256 }}","configSha256":"${{ needs.build-windows-oneapi-gpu.outputs.config_sha256 }}","handoffSha256":"${{ needs.build-windows-oneapi-gpu.outputs.handoff_sha256 }}"},
          {"profile":"dpcpp","bundleSha256":"${{ needs.build-windows-dpcpp-gpu.outputs.bundle_sha256 }}","receiptSha256":"${{ needs.build-windows-dpcpp-gpu.outputs.result_sha256 }}","configSha256":"${{ needs.build-windows-dpcpp-gpu.outputs.config_sha256 }}","handoffSha256":"${{ needs.build-windows-dpcpp-gpu.outputs.handoff_sha256 }}"},
          {"profile":"dpcpp-opencl","bundleSha256":"${{ needs.build-windows-opencl-gpu.outputs.bundle_sha256 }}","receiptSha256":"${{ needs.build-windows-opencl-gpu.outputs.result_sha256 }}","configSha256":"${{ needs.build-windows-opencl-gpu.outputs.config_sha256 }}","handoffSha256":"${{ needs.build-windows-opencl-gpu.outputs.handoff_sha256 }}"},
          {"profile":"acpp-cuda","bundleSha256":"${{ needs.build-windows-acpp-cuda-gpu.outputs.bundle_sha256 }}","receiptSha256":"${{ needs.build-windows-acpp-cuda-gpu.outputs.result_sha256 }}","configSha256":"${{ needs.build-windows-acpp-cuda-gpu.outputs.config_sha256 }}","handoffSha256":"${{ needs.build-windows-acpp-cuda-gpu.outputs.handoff_sha256 }}"},
          {"profile":"acpp-hip","bundleSha256":"${{ needs.build-windows-acpp-hip-gpu.outputs.bundle_sha256 }}","receiptSha256":"${{ needs.build-windows-acpp-hip-gpu.outputs.result_sha256 }}","configSha256":"${{ needs.build-windows-acpp-hip-gpu.outputs.config_sha256 }}","handoffSha256":"${{ needs.build-windows-acpp-hip-gpu.outputs.handoff_sha256 }}"}
        ]

  test-windows-native-runtime:
    name: Runtime-only Windows checks (not publication qualification)
    needs: assemble-windows-native-application
    uses: ./.github/workflows/test-native-release.yml
    with:
      artifact_name: ${{ needs.assemble-windows-native-application.outputs.executable_artifact_name }}
      expected_sha256: ${{ needs.assemble-windows-native-application.outputs.executable_sha256 }}
      platform: win32

  pack-windows-native-application:
    name: Pack the exact Windows application without rebuilding
    needs: assemble-windows-native-application
    uses: ./.github/workflows/pack-native-application.yml
    with:
      platform: win32
      executable_artifact_name: ${{ needs.assemble-windows-native-application.outputs.executable_artifact_name }}
      executable_sha256: ${{ needs.assemble-windows-native-application.outputs.executable_sha256 }}
      build_handoff_artifact_name: ${{ needs.assemble-windows-native-application.outputs.build_handoff_artifact_name }}
      build_handoff_bundle_sha256: ${{ needs.assemble-windows-native-application.outputs.build_handoff_bundle_sha256 }}
      build_handoff_sha256: ${{ needs.assemble-windows-native-application.outputs.build_handoff_sha256 }}

  test-windows-packed-runtime:
    name: Test the exact packed Windows executable
    needs: pack-windows-native-application
    uses: ./.github/workflows/test-native-release.yml
    with:
      artifact_name: ${{ needs.pack-windows-native-application.outputs.executable_artifact_name }}
      expected_sha256: ${{ needs.pack-windows-native-application.outputs.executable_sha256 }}
      platform: win32
      variant: packed

  windows-llvm-amdgpu:
    name: Build Windows LLVM AMDGPU libraries
    needs: [windows-llvm-configure, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-llvm-job.yml
    with:
      phase: llvm-amdgpu
      run_deadline_epoch: ${{ needs.windows-llvm-configure.outputs.run_deadline_epoch }}
      previous_stage: configured
      state_bundle_sha256: ${{ needs.windows-llvm-configure.outputs.bundle_sha256 }}
      state_manifest_sha256: ${{ needs.windows-llvm-configure.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  windows-llvm-mid:
    name: Build Windows LLVM NVPTX, X86 and core libraries
    needs: [windows-llvm-configure, windows-llvm-amdgpu, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-llvm-job.yml
    with:
      phase: llvm-mid
      run_deadline_epoch: ${{ needs.windows-llvm-configure.outputs.run_deadline_epoch }}
      previous_stage: llvm-amdgpu
      state_bundle_sha256: ${{ needs.windows-llvm-amdgpu.outputs.bundle_sha256 }}
      state_manifest_sha256: ${{ needs.windows-llvm-amdgpu.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  windows-llvm-clang:
    name: Build Windows Clang libraries
    needs: [windows-llvm-configure, windows-llvm-mid, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-llvm-job.yml
    with:
      phase: clang
      run_deadline_epoch: ${{ needs.windows-llvm-configure.outputs.run_deadline_epoch }}
      previous_stage: llvm-core
      state_bundle_sha256: ${{ needs.windows-llvm-mid.outputs.bundle_sha256 }}
      state_manifest_sha256: ${{ needs.windows-llvm-mid.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  windows-llvm-lld:
    name: Build Windows LLD libraries
    needs: [windows-llvm-configure, windows-llvm-clang, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-llvm-job.yml
    with:
      phase: lld
      run_deadline_epoch: ${{ needs.windows-llvm-configure.outputs.run_deadline_epoch }}
      previous_stage: clang
      state_bundle_sha256: ${{ needs.windows-llvm-clang.outputs.bundle_sha256 }}
      state_manifest_sha256: ${{ needs.windows-llvm-clang.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  windows-llvm-audit:
    name: Audit the complete Windows LLVM SDK
    needs: [windows-llvm-configure, windows-llvm-lld, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-llvm-job.yml
    with:
      phase: audit
      run_deadline_epoch: ${{ needs.windows-llvm-configure.outputs.run_deadline_epoch }}
      previous_stage: lld
      state_bundle_sha256: ${{ needs.windows-llvm-lld.outputs.bundle_sha256 }}
      state_manifest_sha256: ${{ needs.windows-llvm-lld.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  build-windows-host-component:
    name: Build the original Windows LLVM/COMGR/AdaptiveCpp host component
    needs: [windows-llvm-audit, build-windows-controller-sdk, install-audit-linux-sdk, linux-sources,
      provision-linux-dpcpp-cuda-inputs, fetch-linux-rocm-sources, fetch-linux-acpp-sources, build-linux-rocm-comgr-sdk]
    uses: ./.github/workflows/build-windows-host-job.yml
    with:
      windows_llvm_run_deadline_epoch: ${{ needs.windows-llvm-audit.outputs.run_deadline_epoch }}
      windows_llvm_state_bundle_sha256: ${{ needs.windows-llvm-audit.outputs.bundle_sha256 }}
      windows_llvm_state_manifest_sha256: ${{ needs.windows-llvm-audit.outputs.manifest_sha256 }}
      windows_llvm_admission_sha256: ${{ needs.windows-llvm-audit.outputs.admission_sha256 }}
      windows_hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      windows_hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}
      linux_sdk_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.bundle_sha256 }}
      linux_sources_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      dpcpp_cuda_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_cuda_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      rocm_sources_bundle_sha256: ${{ needs.fetch-linux-rocm-sources.outputs.bundle_sha256 }}
      acpp_sources_bundle_sha256: ${{ needs.fetch-linux-acpp-sources.outputs.bundle_sha256 }}
      hip_headers_bundle_sha256: ${{ needs.build-linux-rocm-comgr-sdk.outputs.hip_headers_bundle_sha256 }}
      hip_headers_handoff_sha256: ${{ needs.build-linux-rocm-comgr-sdk.outputs.hip_headers_handoff_sha256 }}
