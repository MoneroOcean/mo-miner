name: Build native SDK prerequisites

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      linux_executable_artifact_name:
        description: Exact packed Linux candidate artifact; native runtime lanes must also pass
        value: ${{ jobs.pack-linux-native-application.outputs.executable_artifact_name }}
      linux_executable_sha256:
        value: ${{ jobs.pack-linux-native-application.outputs.executable_sha256 }}
      linux_packing_bundle_sha256:
        value: ${{ jobs.pack-linux-native-application.outputs.build_bundle_sha256 }}
      linux_raw_executable_artifact_name:
        description: Exact raw Linux candidate artifact consumed by the packer
        value: ${{ jobs.assemble-linux-native-application.outputs.executable_artifact_name }}
      linux_raw_executable_sha256:
        value: ${{ jobs.assemble-linux-native-application.outputs.executable_sha256 }}
      linux_application_build_artifact_name:
        description: Original Linux application build handoff artifact
        value: ${{ jobs.assemble-linux-native-application.outputs.build_handoff_artifact_name }}
      linux_application_build_bundle_sha256:
        value: ${{ jobs.assemble-linux-native-application.outputs.build_handoff_bundle_sha256 }}
      linux_application_handoff_sha256:
        value: ${{ jobs.assemble-linux-native-application.outputs.build_handoff_sha256 }}
      windows_executable_artifact_name:
        description: Exact packed Windows candidate artifact; native runtime lanes must also pass
        value: ${{ jobs.pack-windows-native-application.outputs.executable_artifact_name }}
      windows_executable_sha256:
        value: ${{ jobs.pack-windows-native-application.outputs.executable_sha256 }}
      windows_packing_bundle_sha256:
        value: ${{ jobs.pack-windows-native-application.outputs.build_bundle_sha256 }}
      windows_raw_executable_artifact_name:
        description: Exact raw Windows candidate artifact consumed by the packer
        value: ${{ jobs.assemble-windows-native-application.outputs.executable_artifact_name }}
      windows_raw_executable_sha256:
        value: ${{ jobs.assemble-windows-native-application.outputs.executable_sha256 }}
      windows_application_build_artifact_name:
        description: Original Windows application build handoff artifact
        value: ${{ jobs.assemble-windows-native-application.outputs.build_handoff_artifact_name }}
      windows_application_build_bundle_sha256:
        value: ${{ jobs.assemble-windows-native-application.outputs.build_handoff_bundle_sha256 }}
      windows_application_handoff_sha256:
        value: ${{ jobs.assemble-windows-native-application.outputs.build_handoff_sha256 }}

permissions:
  actions: read
  contents: read

env:
  MOM_AOT_BUILD_ONLY: "1"
  MOM_BUILD_JOBS: "2"
  MOM_NATIVE_SOURCE_DIR: /tmp/mom-native-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_SDK_DIR: /tmp/mom-native-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_IO_SOURCE_DIR: /tmp/mom-native-io-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_IO_SDK_DIR: /tmp/mom-native-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_HERMES_SOURCE_DIR: /tmp/mom-native-hermes-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_HERMES_SDK_DIR: /tmp/mom-native-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ACPP_SOURCE_DIR: /tmp/mom-native-acpp-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_SOURCES_DIR: /tmp/mom-native-linux-source-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_DPCPP_CUDA_INPUTS_DIR: /tmp/mom-native-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_GNU_HEADERS_DIR: /tmp/mom-native-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_WINDOWS_GNU_HEADERS_DIR: /tmp/mom-native-windows-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_JIT_RESOURCES_DIR: /tmp/mom-native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_JIT_SDK_DIR: /tmp/mom-native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_SOURCE_DIR: /tmp/mom-native-rocm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_COMGR_SDK_DIR: /tmp/mom-native-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_RESOURCES_DIR: /tmp/mom-native-rocm-resources-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_HIP_HEADERS_DIR: /tmp/mom-native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ROCM_HOST_SDK_DIR: /tmp/mom-native-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ZSTD_SOURCE_DIR: /tmp/mom-native-zstd-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ZSTD_SDK_DIR: /tmp/mom-native-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_OPENMP_SDK_DIR: /tmp/mom-native-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_ACPP_CUDA_HIP_SDK_DIR: /tmp/mom-native-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_SOURCE_DIR: /tmp/mom-native-nvrtc-linux-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_SDK_DIR: /tmp/mom-native-nvrtc-linux-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_126_SOURCE_DIR: /tmp/mom-native-nvrtc-linux-12.6-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_LINUX_126_SDK_DIR: /tmp/mom-native-nvrtc-linux-12.6-sdk-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_CUDA_IMAGES_DIR: /tmp/mom-native-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_LINUX_SDK_DESCRIPTOR_DIR: /tmp/mom-native-linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_WINDOWS_SOURCE_DIR: /tmp/mom-native-nvrtc-windows-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
  MOM_NATIVE_NVRTC_WINDOWS_SDK_DIR: /tmp/mom-native-nvrtc-windows-sdk-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  capture-gnu-headers:
    name: Capture package-owned GNU headers (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      linux_bundle_sha256: ${{ steps.seal.outputs.linux_bundle_sha256 }}
      linux_result_sha256: ${{ steps.seal.outputs.linux_result_sha256 }}
      linux_copyrights_sha256: ${{ steps.seal.outputs.linux_copyrights_sha256 }}
      windows_bundle_sha256: ${{ steps.seal.outputs.windows_bundle_sha256 }}
      windows_result_sha256: ${{ steps.seal.outputs.windows_result_sha256 }}
      windows_copyrights_sha256: ${{ steps.seal.outputs.windows_copyrights_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            packages: libstdc++-13-dev libc6-dev linux-libc-dev
            stage: gnu-headers
          - target: windows
            packages: mingw-w64-common mingw-w64-x86-64-dev g++-mingw-w64-x86-64-posix
            stage: windows-gnu-headers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test bounded GNU header staging
        run: node --test tests/native_gnu_headers.js tests/native_ci.js
      - name: Install only the three GNU header packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Stage and re-admit the target include roots
        timeout-minutes: 10
        run: node scripts/prepare-native-ci.js stage ${{ matrix.stage }}
      - name: Seal target-specific GNU artifact and receipts
        id: seal
        env:
          GNU_TARGET: ${{ matrix.target }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const ci = require('./scripts/prepare-native-ci');
          const {fileHash} = require('./scripts/build-source-inputs');
          const target = process.env.GNU_TARGET;
          if (!['linux', 'windows'].includes(target)) throw new Error('GNU matrix target is unsupported');
          const paths = ci.ciPaths(), targetTriple = target === 'windows' ? 'x86_64-w64-windows-gnu' : 'x86_64-unknown-linux-gnu';
          const state = ci.gnuHeadersStatePaths(paths, process.env, targetTriple);
          const files = {
            bundle: state.sdkTar,
            result: path.join(state.root, 'result.json'),
            copyrights: path.join(state.root, 'copyrights.json'),
          };
          for (const [kind, file] of Object.entries(files)) {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || fs.realpathSync(file) !== file || stat.size < 1) {
              throw new Error(`GNU ${kind} output is not a canonical singly-linked regular file`);
            }
          }
          const prefix = target === 'linux' ? 'linux' : 'windows';
          const values = Object.entries(files).map(([kind, file]) => `${prefix}_${kind}_sha256=${fileHash(file)}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, values.join('\n') + '\n');
          NODE
      - name: Retain same-run GNU input tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-${{ matrix.target }}-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report data-only scope
        run: |
          {
            echo '### GNU target-header inputs'
            echo '- Only package-listed headers are copied into the explicit target include roots. Package versions, notices and every file hash are retained; no compiler binaries enter the handoff.'
            echo '- target-headers.json supplies the complete staged file list to the existing source emitter; no private historical overlay or host include-tree scan is needed.'
            echo '- This input-only tar is not a compiler SDK, runtime test, publication proof, or persistent cache. It expires after one day.'
          } >> "$GITHUB_STEP_SUMMARY"

  fetch-linux-zstd-source:
    name: Fetch pinned zstd source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test native prerequisite workflow
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_zstd_sdk.js
      - name: Fetch and verify the original pinned zstd archive
        timeout-minutes: 15
        run: node scripts/prepare-native-ci.js stage zstd-sources
      - name: Upload same-run zstd source tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-zstd-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/native-zstd-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report source-only scope and retention
        run: |
          {
            echo '### Pinned zstd source prerequisite'
            echo '- This same-run raw tar contains only the original hash-pinned zstd 1.5.7 archive and its immutable acquisition receipt at the run-scoped /tmp path.'
            echo '- Acquisition is the only networked step; no SDK compilation, GPU execution, runtime qualification, or release publication occurs.'
            echo '- The source-only handoff expires after one day and is not a persistent cache or release artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-zstd-sdk:
    name: Build and audit static zstd SDK
    needs: fetch-linux-zstd-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download same-run zstd source tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-zstd-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore, provision Intel 2026.2, and build/audit static zstd
        timeout-minutes: 55
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage zstd-sdk
      - name: Retain the complete same-run zstd SDK state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report scope and artifact boundary
        run: |
          {
            echo '### Linux static zstd prerequisite SDK'
            echo '- This same-run raw tar preserves the original pinned archive, fetch receipt, extracted source, static library, producer build tree, and result receipt at their original run-scoped /tmp paths.'
            echo '- This is a source-built, unpublished build-only prerequisite; it is not a complete native release, runtime qualification, or publication approval.'
            echo '- The final handoff is retained for seven days; the source-only transfer expires after one day.'
          } >> "$GITHUB_STEP_SUMMARY"

  fetch-linux-hermes-sources:
    name: Fetch pinned Static Hermes source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test native prerequisite workflow
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js
      - name: Fetch and verify the pinned Hermes source root
        timeout-minutes: 15
        run: node scripts/prepare-native-ci.js stage hermes-sources
      - name: Upload same-run Hermes source tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-hermes-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/native-hermes-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

  fetch-linux-acpp-sources:
    name: Fetch and prepare pinned AdaptiveCpp source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle_sha256: ${{ steps.handoff.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test native prerequisite workflow
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_acpp_sources.js
      - name: Fetch and prepare pinned ACPP source
        timeout-minutes: 25
        run: node scripts/prepare-native-ci.js stage acpp-sources
      - name: Pin the original source handoff for downstream jobs
        id: handoff
        run: |
          archive="$RUNNER_TEMP/native-acpp-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-sources.tar"
          test -f "$archive"
          test ! -L "$archive"
          pin=$(sha256sum -- "$archive")
          echo "bundle_sha256=${pin%% *}" >> "$GITHUB_OUTPUT"
      - name: Upload same-run ACPP source tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-acpp-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/native-acpp-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report source-only scope and retention
        run: |
          {
            echo '### AdaptiveCpp Linux source prerequisite'
            echo '- This same-run raw tar contains the pinned shallow bare Git root, its original patched working checkout, and fetch/preparation receipts at their run-scoped /tmp paths.'
            echo '- Fetch is the only networked step; source preparation uses the existing offline file-only Git path. No SDK compilation, GPU execution, runtime qualification, or release publication occurs.'
            echo '- The source-only handoff expires after one day and is not a persistent cache or release artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

  linux-sources:
    name: Fetch shared Linux/compiler SDK sources and prepare both views
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle_sha256: ${{ steps.sources.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test Linux source and SDK producer contracts
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_dpcpp_sdk.js
      - name: Fetch compiler source closure and prepare Linux and compiler views offline
        id: sources
        timeout-minutes: 25
        run: node scripts/prepare-native-ci.js stage linux-sources
      - name: Upload same-run Linux SDK source tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report source-only scope and retention
        run: |
          {
            echo '### Linux SDK source prerequisite'
            echo '- This same-run raw tar contains one fetch receipt for the exact pinned ten-repository compiler source cohort (the shared eight Linux roots plus VC intrinsics and SPIR-V headers).'
            echo '- It retains separate original prepared receipts and source trees for the eight-component Linux runtime target and ten-component compiler/JIT target at their run-scoped /tmp paths.'
            echo '- Fetch is the only networked step; both target preparations are offline and re-admitted without rewriting producer receipts. No compiler/SDK build, GPU execution, runtime qualification, or release publication occurs.'
            echo '- This source-only handoff expires after one day and is not a persistent cache or release artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

  provision-linux-dpcpp-cuda-inputs:
    name: Provision pinned DPC++23 and minimal CUDA 12.6 inputs
    needs: linux-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bundle_sha256: ${{ steps.inputs.outputs.bundle_sha256 }}
      manifest_sha256: ${{ steps.inputs.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test same-run DPC++/CUDA input handoff
        run: node --test tests/native_ci.js tests/native_dpcpp_sdk.js
      - name: Download same-run prepared Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Verify sources, provision pinned toolchains, and retain selected inputs
        id: inputs
        timeout-minutes: 55
        env:
          MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
        run: node scripts/prepare-native-ci.js stage dpcpp-cuda-inputs
      - name: Retain same-run DPC++/CUDA input tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report input-only scope and unfinished stages
        run: |
          {
            echo '### Linux DPC++23 and CUDA 12.6 build-input handoff'
            echo '- The original pinned Linux source cohort is re-admitted before the existing installer provisions DPC++23 and minimal CUDA developer packages; the raw run-attempt tar contains the marker-bound compiler, CUDA configure/header/device-resource inputs, and exact selected hashes.'
            echo '- A configure-only CMake FindCUDAToolkit smoke confirms the copied nvcc, headers, and libcudart resolve from this run-scoped root; the exact pinned static CUDART/culibos archives are also carried for the separate source-built ACPP CUDA/HIP runtime.'
            echo '- This handoff does not build or admit source JIT, the isolated compiler object, a static DPC++ runtime, an executable, or release payload. Those producer stages remain unfinished.'
            echo '- No GPU, runtime qualification, publication qualification, or persistent Actions cache is used; the input artifact expires after seven days.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-cuda-images:
    name: Build and admit Linux CUDA image bundle
    needs: [linux-sources, provision-linux-dpcpp-cuda-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bundle_sha256: ${{ steps.handoff.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test NVRTC, CUDA image, and same-run input contracts
        timeout-minutes: 10
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_nvrtc_sdk.js tests/native_cuda_images.js tests/native_cuda_images_build.js
      - name: Download original source receipts for CUDA input admission
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore and verify the pinned original source cohort
        env:
          MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
        run: |
          node <<'NODE'
          const fs = require("node:fs"), ci = require("./scripts/prepare-native-ci");
          const paths = ci.ciPaths(), state = ci.linuxSourceStatePaths(paths);
          ci.dpcppSourceArchivePin(state.incomingTar, process.env.MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256);
          ci.extractState(state.incomingTar, "/tmp", [state.sourceName]);
          ci.verifyLinuxSources(paths, state, "/usr/bin/git");
          fs.unlinkSync(state.incomingTar);
          NODE
      - name: Download same-run DPC++/CUDA 12.6 header inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Fetch both NVRTC cohorts, install pinned CUTLASS, and build the public image bundle
        timeout-minutes: 55
        env:
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage cuda-images-linux
      - name: Pin the admitted image handoff for downstream jobs
        id: handoff
        run: |
          archive="$RUNNER_TEMP/native-linux-cuda-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          test -f "$archive"
          test ! -L "$archive"
          pin=$(sha256sum -- "$archive")
          echo "bundle_sha256=${pin%% *}" >> "$GITHUB_OUTPUT"
      - name: Upload the admitted CUDA images and bounded notice-source subset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report build-only scope and license limitation
        run: |
          {
            echo '### Linux CUDA image build-only handoff'
            echo '- The public image producer queried and compiled both pinned NVRTC 12.6 and 13.3 workers against the same-run admitted CUDA 12.6 headers and pinned CUTLASS 4.6.1 headers; incompatibility is a real image-build failure, not an assumed compatibility pass.'
            echo '- The raw tar contains cuda-images.inc, its producer sidecar, the public result, and an exact same-run CUDA/NVRTC/CUTLASS license-source subset with body hashes and source receipts. Vendor SDKs and worker binaries remain on the runner.'
            echo '- This subset is not the complete native distribution notice set and does not establish redistribution or publication qualification.'
            echo '- No GPU/device execution, native runtime qualification, or release publishing occurs.'
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-linux-jit-resources:
    name: Prepare current Linux source-JIT resources
    needs: [linux-sources, provision-linux-dpcpp-cuda-inputs, capture-gnu-headers]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      resources_bundle_sha256: ${{ steps.seal.outputs.resources_bundle_sha256 }}
      resources_manifest_sha256: ${{ steps.seal.outputs.resources_manifest_sha256 }}
      resources_result_sha256: ${{ steps.seal.outputs.resources_result_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test source-JIT resource handoff contracts
        timeout-minutes: 10
        run: node --test tests/native_ci.js tests/native_jit_base.js tests/native_jit_resources.js
      - name: Download exact same-run prepared Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download exact same-run DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download exact same-run GNU target headers and notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Build and admit CPU-only JIT resource inputs
        timeout-minutes: 55
        env:
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage linux-jit-resources
      - name: Seal the unchanged Linux resource tar and receipts
        id: seal
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const ci = require('./scripts/prepare-native-ci');
          const {fileHash, readBuildJson} = require('./scripts/build-source-inputs');
          const paths = ci.ciPaths(), suffix = paths.suffix;
          const root = paths.linuxJitResourcesRoot;
          const resultFile = path.join(root, 'ci-result.json');
          const manifestFile = path.join(root, 'resources', 'manifest.json');
          const archive = path.join(paths.runnerTemp, `native-linux-jit-resources-${suffix}.tar`);
          function regular(file, maxBytes) {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 || stat.size > maxBytes ||
                fs.realpathSync(file) !== file) throw new Error('Expected a bounded canonical regular file: ' + file);
            return stat;
          }
          regular(resultFile, 64 << 20);
          regular(manifestFile, 64 << 20);
          regular(archive, 16 * 1024 ** 3);
          const result = readBuildJson(resultFile), manifest = readBuildJson(manifestFile);
          if (result.version !== 1 || result.target !== 'x86_64-unknown-linux-gnu' || result.buildOnly !== true ||
              result.executed !== false || result.publicationQualified !== false ||
              result.resources?.manifest !== manifestFile || result.resources.manifestSha256 !== fileHash(manifestFile) ||
              !Array.isArray(manifest.files) || manifest.files.length !== result.resources.files ||
              manifest.target !== 'x86_64-unknown-linux-gnu' || manifest.publicationQualified !== false) {
            throw new Error('Linux resource result does not bind its unchanged build-only resource manifest');
          }
          ci.listState(archive, [path.basename(root)]);
          const values = {
            resources_bundle_sha256: fileHash(archive),
            resources_manifest_sha256: fileHash(manifestFile),
            resources_result_sha256: fileHash(resultFile),
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          NODE
      - name: Retain complete same-run JIT resource and bootstrap state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report build-only boundary
        run: |
          {
            echo '### Linux source-JIT resource preparation'
            echo '- The three original same-run source, DPC++/CUDA and GNU tars are independently re-admitted and their hashes are bound into the new resource state tar.'
            echo '- The public CPU source emitter, headers-only CMake bootstrap, pinned bitcode base and GNU dependency resource pack are retained at their original absolute /tmp roots for the next phase.'
            echo '- This does not build the full source-JIT SDK/compiler object/static runtime, execute a device, or qualify runtime behavior or publication. No GPU or persistent Actions cache is used.'
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-windows-jit-resources:
    name: Prepare current Windows source-JIT resources
    needs: [linux-sources, provision-linux-dpcpp-cuda-inputs, capture-gnu-headers, prepare-linux-jit-resources]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      resources_bundle_sha256: ${{ steps.resources.outputs.resources_bundle_sha256 }}
      resources_manifest_sha256: ${{ steps.resources.outputs.resources_manifest_sha256 }}
      resources_result_sha256: ${{ steps.resources.outputs.resources_result_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test Windows source-JIT resource admission and job contracts
        timeout-minutes: 5
        run: node --test tests/native_ci.js tests/native_windows_jit_resources.js tests/native_windows_jit_ci_job.js
      - name: Download exact same-run Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming/linux-sources
      - name: Download exact same-run DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/dpcpp-cuda
      - name: Download pinned same-run Linux JIT resource state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/linux-jit-resources
      - name: Download exact same-run Windows GNU headers and notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-windows-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming/windows-gnu-headers
      - name: Admit immutable inputs, emit Windows bitcode, and seal the handoff
        id: resources
        timeout-minutes: 25
        env:
          MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
          MOM_NATIVE_LINUX_JIT_RESOURCES_BUNDLE_SHA256: ${{ needs.prepare-linux-jit-resources.outputs.resources_bundle_sha256 }}
          MOM_NATIVE_LINUX_JIT_RESOURCES_RESULT_SHA256: ${{ needs.prepare-linux-jit-resources.outputs.resources_result_sha256 }}
          MOM_NATIVE_LINUX_JIT_RESOURCES_MANIFEST_SHA256: ${{ needs.prepare-linux-jit-resources.outputs.resources_manifest_sha256 }}
          MOM_NATIVE_WINDOWS_GNU_BUNDLE_SHA256: ${{ needs.capture-gnu-headers.outputs.windows_bundle_sha256 }}
          MOM_NATIVE_WINDOWS_GNU_RESULT_SHA256: ${{ needs.capture-gnu-headers.outputs.windows_result_sha256 }}
          MOM_NATIVE_WINDOWS_GNU_COPYRIGHTS_SHA256: ${{ needs.capture-gnu-headers.outputs.windows_copyrights_sha256 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), {spawnSync} = require('node:child_process');
          const ci = require('./scripts/prepare-native-ci');
          const {fileHash, readBuildJson} = require('./scripts/build-source-inputs');
          const {windowsJitResourcePaths, admitWindowsJitNativeTools} = require('./scripts/native-windows-jit-resources');
          const paths = ci.ciPaths(), suffix = paths.suffix, env = process.env;
          const source = ci.linuxSourceStatePaths(paths, env), dpcpp = ci.dpcppCudaInputsStatePaths(paths, env);
          const gnu = ci.gnuHeadersStatePaths(paths, env, 'x86_64-w64-windows-gnu');
          const linuxResources = ci.linuxJitResourcesStatePaths(paths, env), output = windowsJitResourcePaths(suffix);
          const incoming = path.join(paths.runnerTemp, 'incoming');
          const sourceTar = path.join(incoming, 'linux-sources', path.basename(source.sourceTar));
          const dpcppTar = path.join(incoming, 'dpcpp-cuda', path.basename(dpcpp.sdkTar));
          const linuxResourcesTar = path.join(incoming, 'linux-jit-resources', `native-linux-jit-resources-${suffix}.tar`);
          const windowsGnuTar = path.join(incoming, 'windows-gnu-headers', `native-windows-gnu-headers-${suffix}.tar`);
          function pinnedArchive(file, expected, label) {
            if (!/^[a-f0-9]{64}$/.test(expected || '')) throw new Error(label + ' SHA-256 pin is missing');
            return ci.dpcppSourceArchivePin(file, expected);
          }
          function extract(file, root) {
            if (fs.existsSync(root)) throw new Error('Refusing to overwrite same-run input root: ' + root);
            ci.extractState(file, '/tmp', [path.basename(root)]);
          }
          if (!env.MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256 || !env.MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256 ||
              !env.MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256 || !env.MOM_NATIVE_LINUX_JIT_RESOURCES_BUNDLE_SHA256 ||
              !env.MOM_NATIVE_LINUX_JIT_RESOURCES_RESULT_SHA256 || !env.MOM_NATIVE_LINUX_JIT_RESOURCES_MANIFEST_SHA256 ||
              !env.MOM_NATIVE_WINDOWS_GNU_BUNDLE_SHA256 || !env.MOM_NATIVE_WINDOWS_GNU_RESULT_SHA256 ||
              !env.MOM_NATIVE_WINDOWS_GNU_COPYRIGHTS_SHA256) {
            throw new Error('Same-run Linux source, DPC++/CUDA, Linux JIT, and Windows GNU output pins are required');
          }
          const archivePins = {
            source: pinnedArchive(sourceTar, env.MOM_NATIVE_LINUX_SOURCE_BUNDLE_SHA256, 'Linux source'),
            dpcpp: pinnedArchive(dpcppTar, env.MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256, 'DPC++/CUDA inputs'),
            linuxResources: pinnedArchive(linuxResourcesTar, env.MOM_NATIVE_LINUX_JIT_RESOURCES_BUNDLE_SHA256, 'Linux JIT resources'),
            windowsGnu: pinnedArchive(windowsGnuTar, env.MOM_NATIVE_WINDOWS_GNU_BUNDLE_SHA256, 'Windows GNU headers'),
          };
          extract(sourceTar, source.source);
          extract(dpcppTar, dpcpp.root);
          extract(linuxResourcesTar, linuxResources.root);
          extract(windowsGnuTar, gnu.root);
          const git = fs.realpathSync('/usr/bin/git');
          ci.verifyLinuxSources(paths, source, git);
          const dpcppPins = ci.dpcppCudaInputPins(env);
          if (!dpcppPins || dpcppPins.bundleSha256 !== archivePins.dpcpp) throw new Error('DPC++/CUDA inputs lack matching external pins');
          ci.auditDpcppCudaInputs(dpcpp, readBuildJson(dpcpp.manifest), dpcppPins.manifestSha256);
          const linuxResult = path.join(linuxResources.root, 'ci-result.json');
          const linuxManifest = path.join(linuxResources.root, 'resources', 'manifest.json');
          const linuxResultSha = fileHash(linuxResult), linuxManifestSha = fileHash(linuxManifest);
          if (linuxResultSha !== env.MOM_NATIVE_LINUX_JIT_RESOURCES_RESULT_SHA256 ||
              linuxManifestSha !== env.MOM_NATIVE_LINUX_JIT_RESOURCES_MANIFEST_SHA256 || fs.existsSync(output.root)) {
            throw new Error('Extracted Linux JIT resource result or manifest differs from its upstream output pin');
          }
          const copyrights = path.join(gnu.root, 'copyrights.json'), gnuResult = path.join(gnu.root, 'result.json');
          const gnuResultSha = fileHash(gnuResult), copyrightsSha = fileHash(copyrights);
          if (gnuResultSha !== env.MOM_NATIVE_WINDOWS_GNU_RESULT_SHA256 || copyrightsSha !== env.MOM_NATIVE_WINDOWS_GNU_COPYRIGHTS_SHA256) {
            throw new Error('Extracted Windows GNU result or copyrights differ from their upstream output pins');
          }
          const gnuAudit = ci.auditGnuHeaders(gnu, 'x86_64-w64-windows-gnu');
          const args = ['scripts/native-windows-jit-resources.js', 'produce', suffix, linuxResources.root, linuxResultSha,
            gnu.root, gnuResultSha, copyrightsSha, dpcpp.dpcppRoot, dpcppPins.bundleSha256, dpcppPins.manifestSha256, output.root];
          const started = spawnSync(process.execPath, args, {cwd: process.cwd(), env, stdio: 'inherit', timeout: 20 * 60 * 1000});
          if (started.error || started.signal || started.status !== 0) throw new Error('Public Windows JIT resource producer failed', {cause: started.error});
          ci.verifyLinuxSources(paths, source, git);
          ci.auditDpcppCudaInputs(dpcpp, readBuildJson(dpcpp.manifest), dpcppPins.manifestSha256);
          ci.auditGnuHeaders(gnu, 'x86_64-w64-windows-gnu');
          for (const [file, sha256] of [[sourceTar, archivePins.source], [dpcppTar, archivePins.dpcpp],
            [linuxResourcesTar, archivePins.linuxResources], [windowsGnuTar, archivePins.windowsGnu]]) {
            if (fileHash(file) !== sha256) throw new Error('An input tar changed during Windows JIT resource production: ' + path.basename(file));
          }
          const manifestFile = path.join(output.resources, 'manifest.json'), profile = readBuildJson(output.profile),
            manifest = readBuildJson(manifestFile), emitterReceipt = path.join(output.emitter, 'result.json');
          if (profile.target !== 'x86_64-w64-windows-gnu' || manifest.target !== 'x86_64-w64-windows-gnu' ||
              manifest.publicationQualified !== false || !Array.isArray(manifest.files) || !manifest.files.length) {
            throw new Error('Public Windows JIT producer returned an incomplete or wrong-target resource tree');
          }
          const resultFile = path.join(output.root, 'ci-result.json');
          const nativeTools = admitWindowsJitNativeTools(output.root, suffix);
          const resultRecord = {
            version: 1, runAttempt: suffix, target: 'x86_64-w64-windows-gnu', buildOnly: true, executed: false, publicationQualified: false,
            scope: 'Windows source-JIT resources and source-matched build-only generators; no compiler SDK, device, runtime, or publication qualification.',
            producer: {script: 'scripts/native-windows-jit-resources.js', sha256: fileHash('scripts/native-windows-jit-resources.js')},
            inputs: {
              linuxSources: {artifact: path.basename(source.sourceTar), bundleSha256: archivePins.source},
              dpcppCuda: {artifact: path.basename(dpcpp.sdkTar), bundleSha256: archivePins.dpcpp, manifestSha256: dpcppPins.manifestSha256},
              linuxResources: {artifact: path.basename(linuxResources.sdkTar), bundleSha256: archivePins.linuxResources,
                resultSha256: linuxResultSha, manifestSha256: linuxManifestSha},
              windowsGnu: {artifact: `native-windows-gnu-headers-${suffix}.tar`, bundleSha256: archivePins.windowsGnu,
                resultSha256: gnuResultSha, copyrightsSha256: copyrightsSha, notices: gnuAudit.notices.length},
            },
            emitter: {receipt: emitterReceipt, sha256: fileHash(emitterReceipt)},
            profile: {path: output.profile, sha256: fileHash(output.profile)},
            resources: {manifest: manifestFile, manifestSha256: fileHash(manifestFile), files: manifest.files.length},
            nativeTools: {root: nativeTools.toolRoot, manifest: nativeTools.manifestFile, manifestSha256: nativeTools.manifestSha256,
              files: nativeTools.files, hashes: nativeTools.hashes, source: nativeTools.source},
          };
          fs.writeFileSync(resultFile, JSON.stringify(resultRecord, null, 2) + '\n', {flag: 'wx', mode: 0o600});
          const archive = path.join(paths.runnerTemp, `mom-native-windows-jit-resources-${suffix}.tar`);
          const packed = ci.packState(archive, '/tmp', [path.basename(output.root)], 5 * 60 * 1000);
          ci.listState(archive, [path.basename(output.root)]);
          const archiveStat = fs.lstatSync(archive);
          if (!archiveStat.isFile() || archiveStat.isSymbolicLink() || archiveStat.nlink !== 1 || archiveStat.size < 1 ||
              archiveStat.size > 16 * 1024 ** 3 || !Number.isSafeInteger(archiveStat.size) || packed.bytes !== archiveStat.size ||
              fs.realpathSync(archive) !== archive) {
            throw new Error('Windows JIT resource bundle is not a canonical singly-linked regular file');
          }
          const values = {resources_bundle_sha256: fileHash(archive), resources_manifest_sha256: resultRecord.resources.manifestSha256,
            resources_result_sha256: fileHash(resultFile)};
          fs.appendFileSync(env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY,
            `Windows GNU/JIT resources: ${manifest.files.length} files. Build-only; not executed, runtime-qualified, or publication-qualified.\n`);
          NODE
      - name: Retain current same-run Windows JIT resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mom-native-windows-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/mom-native-windows-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7

  windows-jit-configure:
    name: Configure the original Windows source-JIT SDK
    needs: [prepare-windows-jit-resources, linux-sources, provision-linux-dpcpp-cuda-inputs, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-jit-job.yml
    with:
      phase: configure
      source_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      dpcpp_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}
      windows_resources_bundle_sha256: ${{ needs.prepare-windows-jit-resources.outputs.resources_bundle_sha256 }}

  windows-jit-support:
    name: Build Windows source-JIT support libraries
    needs: [windows-jit-configure, prepare-windows-jit-resources, linux-sources, provision-linux-dpcpp-cuda-inputs, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-jit-job.yml
    with:
      phase: support
      run_deadline_epoch: ${{ needs.windows-jit-configure.outputs.run_deadline_epoch }}
      previous_phase: configured
      config_sha256: ${{ needs.windows-jit-configure.outputs.config_sha256 }}
      state_bundle_sha256: ${{ needs.windows-jit-configure.outputs.state_bundle_sha256 }}
      source_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      dpcpp_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}
      windows_resources_bundle_sha256: ${{ needs.prepare-windows-jit-resources.outputs.resources_bundle_sha256 }}

  windows-jit-targets:
    name: Build Windows source-JIT target libraries
    needs: [windows-jit-configure, windows-jit-support, prepare-windows-jit-resources, linux-sources, provision-linux-dpcpp-cuda-inputs, build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-jit-job.yml
    with:
      phase: targets
      run_deadline_epoch: ${{ needs.windows-jit-configure.outputs.run_deadline_epoch }}
      previous_phase: support
      config_sha256: ${{ needs.windows-jit-configure.outputs.config_sha256 }}
      state_bundle_sha256: ${{ needs.windows-jit-support.outputs.state_bundle_sha256 }}
      source_bundle_sha256: ${{ needs.linux-sources.outputs.bundle_sha256 }}
      dpcpp_bundle_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
      dpcpp_manifest_sha256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
