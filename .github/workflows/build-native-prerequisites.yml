        run: |
          {
            echo '### Linux source-JIT proof'
            echo '- The original source-JIT compiler graph was built and its CPU proof executable was linked from the configured source graph.'
            echo '- A separate proof-only tar retains that exact executable and the unchanged result.json for a later SDK-free CPU runtime job.'
            echo '- This does not execute the proof or qualify a GPU, runtime, mining behavior, or release publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  test-linux-source-jit-runtime:
    name: Execute the linked source-JIT proof in an isolated CPU container
    needs: link-linux-source-jit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download the same-run proof-only runtime fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Verify the original receipt and admit the exact executable bytes
        id: admit-proof
        env:
          MOM_NATIVE_LINUX_JIT_RUNTIME_PROOF_SHA256: ${{ needs.link-linux-source-jit.outputs.proof_sha256 }}
          MOM_NATIVE_LINUX_JIT_RUNTIME_RESULT_SHA256: ${{ needs.link-linux-source-jit.outputs.result_sha256 }}
          MOM_NATIVE_LINUX_JIT_RUNTIME_BUNDLE_SHA256: ${{ needs.link-linux-source-jit.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_JIT_RUNTIME_BUNDLE_BYTES: ${{ needs.link-linux-source-jit.outputs.bundle_bytes }}
        run: node scripts/prepare-native-ci.js stage linux-jit-runtime-admit
      - name: Execute all source-JIT CPU fixtures with bounded resources
        id: execute-proof
        timeout-minutes: 22
        env:
          MOM_NATIVE_JIT_RUNTIME_FIXTURE: ${{ steps.admit-proof.outputs.fixture_path }}
          MOM_NATIVE_JIT_RUNTIME_EXPECTED_SHA256: ${{ needs.link-linux-source-jit.outputs.proof_sha256 }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/native-linux-jit-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$evidence"
          exec > >(tee "$evidence/host.log") 2>&1
          test "$(node --version)" = "v24.15.0"
          test -f "$MOM_NATIVE_JIT_RUNTIME_FIXTURE"
          test -x "$MOM_NATIVE_JIT_RUNTIME_FIXTURE"
          node_bin="$(node -p 'process.execPath')"
          test -f "$node_bin"
          test -x "$node_bin"
          test_script="$GITHUB_WORKSPACE/tests/native_jit_runtime.js"
          test -f "$test_script"
          for input_path in "$node_bin" "$test_script" "$MOM_NATIVE_JIT_RUNTIME_FIXTURE"; do
            case "$input_path" in *','*|*$'\n'*|*$'\r'*) exit 2 ;; esac
          done
          proof_before="$(sha256sum "$MOM_NATIVE_JIT_RUNTIME_FIXTURE" | awk '{print $1}')"
          test "$proof_before" = "$MOM_NATIVE_JIT_RUNTIME_EXPECTED_SHA256"
          name="mom-native-linux-jit-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90"
          created=0
          cgroup_path=""
          container_id=""
          host_pid=""
          sampler_pid=0
          exec_status=125
          container_exit=125
          timed_out=0
          finish() {
            rc=$?
            trap - EXIT
            set +e
            if [ "$sampler_pid" -gt 0 ]; then kill "$sampler_pid" 2>/dev/null; wait "$sampler_pid" 2>/dev/null; fi
            if [ "$created" -eq 1 ]; then
              docker inspect --format 'memory={{.HostConfig.Memory}} swap={{.HostConfig.MemorySwap}} cpu={{.HostConfig.NanoCpus}} pids={{.HostConfig.PidsLimit}} network={{.HostConfig.NetworkMode}} readonly={{.HostConfig.ReadonlyRootfs}} security={{json .HostConfig.SecurityOpt}}' "$name" > "$evidence/container-inspect.txt"
              if [ -n "$cgroup_path" ] && [ -r "$cgroup_path/memory.peak" ]; then
                for key in memory.current memory.peak memory.max memory.events memory.oom.group memory.swap.current memory.swap.max cpu.max pids.max; do
                  if [ -r "$cgroup_path/$key" ]; then
                    { printf '%s=' "$key"; tr '\n' ' ' < "$cgroup_path/$key"; printf '\n'; } >> "$evidence/cgroup-final.txt"
                  fi
                done
                cp "$cgroup_path/memory.events" "$evidence/memory.events"
              else
                printf 'final cgroup telemetry unavailable\n' > "$evidence/cgroup-final.txt"
              fi
              docker stop --time 5 "$name" > "$evidence/container-stop.txt" 2>&1
              docker inspect --format 'oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' "$name" > "$evidence/container-after-stop.txt"
              container_exit="$(docker inspect -f '{{.State.ExitCode}}' "$name")"
              docker rm -f "$name" > /dev/null 2>&1
            fi
            proof_after="$(sha256sum "$MOM_NATIVE_JIT_RUNTIME_FIXTURE" 2>/dev/null | awk '{print $1}')"
            printf 'expected_sha256=%s\nbefore_sha256=%s\nafter_sha256=%s\ntimed_out=%s\ncontainer_exit=%s\n' \
              "$MOM_NATIVE_JIT_RUNTIME_EXPECTED_SHA256" "$proof_before" "$proof_after" "$timed_out" "$container_exit" > "$evidence/proof-integrity.txt"
            test "$proof_after" = "$proof_before" || rc=1
            printf 'exec_status=%s\ncontainer_id=%s\nhost_pid=%s\ncgroup=%s\n' "$exec_status" "$container_id" "$host_pid" "$cgroup_path" >> "$evidence/proof-integrity.txt"
            if [ "$created" -eq 1 ]; then
              grep -Fq 'memory=4294967296 swap=4294967296 cpu=2000000000 pids=128 network=none readonly=true' "$evidence/container-inspect.txt" || rc=1
              grep -Fq 'no-new-privileges:true' "$evidence/container-inspect.txt" || rc=1
              grep -Fxq 'memory.max=4294967296 ' "$evidence/cgroup-final.txt" || rc=1
              grep -Fxq 'memory.swap.max=0 ' "$evidence/cgroup-final.txt" || rc=1
              grep -Fxq 'memory.swap.current=0 ' "$evidence/cgroup-final.txt" || rc=1
              grep -Fxq 'cpu.max=200000 100000 ' "$evidence/cgroup-final.txt" || rc=1
              grep -Fxq 'pids.max=128 ' "$evidence/cgroup-final.txt" || rc=1
              grep -Fxq 'memory.oom.group=1 ' "$evidence/cgroup-final.txt" || rc=1
              peak="$(awk -F= '$1 == "memory.peak" {gsub(/ /, "", $2); print $2}' "$evidence/cgroup-final.txt")"
              [[ "$peak" =~ ^[0-9]+$ ]] && [ "$peak" -le 4294967296 ] || rc=1
              awk '$1 == "oom" || $1 == "oom_kill" || $1 == "oom_group_kill" {if ($2 != 0) bad=1} END {exit bad}' "$evidence/memory.events" || rc=1
              grep -Fq 'oom=false' "$evidence/container-after-stop.txt" || rc=1
              [ "$exec_status" -eq 0 ] && [ "$timed_out" -eq 0 ] || rc=1
            fi
            exit "$rc"
          }
          trap finish EXIT
          docker create --name "$name" --network none --cpus 2 --memory 4g --memory-swap 4g --pids-limit 128 \
            --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=134217728,mode=1777 \
            --mount "type=bind,source=$node_bin,target=/qa/node,readonly" \
            --mount "type=bind,source=$test_script,target=/qa/tests/native_jit_runtime.js,readonly" \
            --mount "type=bind,source=$MOM_NATIVE_JIT_RUNTIME_FIXTURE,target=/proof/native-dpcpp-jit,readonly" \
            --workdir /tmp --entrypoint /bin/bash "$image" -ec 'while :; do sleep 3600; done' > "$evidence/container-id.txt"
          created=1
          docker start "$name" > /dev/null
          container_id="$(docker inspect -f '{{.Id}}' "$name")"
          host_pid="$(docker inspect -f '{{.State.Pid}}' "$name")"
          [[ "$host_pid" =~ ^[1-9][0-9]*$ ]]
          cg_rel="$(awk -F: '$1 == "0" {print $3; exit}' "/proc/$host_pid/cgroup")"
          [[ "$cg_rel" == *"$container_id"* ]]
          cgroup_path="$(realpath -m "/sys/fs/cgroup$cg_rel")"
          case "$cgroup_path" in /sys/fs/cgroup/*) ;; *) exit 3 ;; esac
          for key in memory.max memory.swap.max cpu.max pids.max memory.oom.group; do test -r "$cgroup_path/$key"; done
          test "$(cat "$cgroup_path/memory.max")" = 4294967296
          test "$(cat "$cgroup_path/memory.swap.max")" = 0
          test "$(cat "$cgroup_path/cpu.max")" = "200000 100000"
          test "$(cat "$cgroup_path/pids.max")" = 128
          printf 1 | sudo tee "$cgroup_path/memory.oom.group" > /dev/null
          test "$(cat "$cgroup_path/memory.oom.group")" = 1
          printf 'container_id=%s\nhost_pid=%s\ncgroup=%s\n' "$container_id" "$host_pid" "$cgroup_path" > "$evidence/host-gate.txt"
          docker inspect --format 'memory={{.HostConfig.Memory}} swap={{.HostConfig.MemorySwap}} cpu={{.HostConfig.NanoCpus}} pids={{.HostConfig.PidsLimit}} network={{.HostConfig.NetworkMode}} readonly={{.HostConfig.ReadonlyRootfs}} security={{json .HostConfig.SecurityOpt}}' "$name" > "$evidence/container-inspect.txt"
          grep -Fq 'memory=4294967296 swap=4294967296 cpu=2000000000 pids=128 network=none readonly=true' "$evidence/container-inspect.txt"
          grep -Fq 'no-new-privileges:true' "$evidence/container-inspect.txt"
          sampler() {
            while [ -r "$cgroup_path/memory.peak" ]; do
              {
                printf '%s ' "$SECONDS"
                for key in memory.current memory.peak memory.events memory.swap.current; do
                  if [ -r "$cgroup_path/$key" ]; then printf '%s=' "$key"; tr '\n' ',' < "$cgroup_path/$key"; printf ' '; fi
                done
                printf '\n'
              } >> "$evidence/cgroup-samples.txt"
              sleep 1
            done
          }
          sampler & sampler_pid=$!
          set +e
          # These substitutions must run inside the contained process, not on the host.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=10s 21m docker exec --user 10001:10001 \
            --env MOM_NATIVE_JIT_RUNTIME_FIXTURE=/proof/native-dpcpp-jit "$name" /bin/bash -ec '
              test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(cat /sys/fs/cgroup/cpu.max)" = "200000 100000"
              test "$(cat /sys/fs/cgroup/pids.max)" = 128
              test "$(cat /sys/fs/cgroup/memory.oom.group)" = 1
              set +e
              /usr/bin/timeout --signal=TERM --kill-after=10s 20m /qa/node --test --test-concurrency=1 --test-reporter=tap /qa/tests/native_jit_runtime.js 2>&1 | tee /tmp/native-jit-runtime.tap
              test_status=${PIPESTATUS[0]}
              set -e
              if [ "$test_status" -eq 124 ]; then exit 124; fi
              test "$test_status" -eq 0
              grep -Fxq "# tests 11" /tmp/native-jit-runtime.tap
              grep -Fxq "# pass 11" /tmp/native-jit-runtime.tap
              grep -Fxq "# fail 0" /tmp/native-jit-runtime.tap
              grep -Fxq "# skipped 0" /tmp/native-jit-runtime.tap
              for case_name in "spirv" "sm_61" "sm_120" "sm_61 kawpow" "sm_61 firopow" "sm_61 evrprogpow" "sm_61 meowpow" "sm_120 kawpow" "sm_120 firopow" "sm_120 evrprogpow" "sm_120 meowpow"; do
                grep -Fq "# Subtest: $case_name preserves source, cache, error recovery and image lifecycle" /tmp/native-jit-runtime.tap
              done
            ' 2>&1 | tail -c 1048576 > "$evidence/container.log"
          exec_status=${PIPESTATUS[0]}
          set -e
          if [ "$exec_status" -eq 124 ] || [ "$exec_status" -eq 137 ]; then timed_out=1; fi
          printf 'exec_status=%s\n' "$exec_status" > "$evidence/status.txt"
          cat "$evidence/container.log"
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          sampler_pid=0
          test "$exec_status" -eq 0
      - name: Bundle bounded runtime failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          name="native-linux-jit-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -d "$RUNNER_TEMP/$name" ]; then
            tar -cf "$RUNNER_TEMP/native-linux-jit-runtime-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" -C "$RUNNER_TEMP" "$name"
          fi
      - name: Retain bounded runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-jit-runtime-failure-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-jit-runtime-failure-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: ignore
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report SDK-free CPU runtime scope
        run: |
          {
            echo '### Linux source-JIT CPU proof execution'
            echo '- The exact run-bound source-JIT executable was executed without the compiler SDK, GPU devices, network, or mining-pool configuration.'
            echo '- All eleven SPIR-V/SM61/SM120 and ProgPoW-variant CPU proof cases passed; the separate source-JIT bridge suite is outside this fixture.'
            echo '- This is CPU proof execution only, not GPU dispatch or release-runtime qualification.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-static-dpcpp-sdk:
    name: Isolate source-JIT and build static Linux DPC++ SDK
    needs: [link-linux-source-jit, provision-linux-dpcpp-cuda-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test static DPC++ handoff contracts
        timeout-minutes: 10
        run: node --test tests/native_ci.js tests/native_dpcpp_sdk.js tests/native_dpcpp_component.js
      - name: Download same-run Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run GNU target headers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run source-JIT resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download linked mutable source-JIT state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-link.tar
          path: ${{ runner.temp }}/incoming
      - name: Run scripts/native-compiler-isolation.js then scripts/build-native-dpcpp-sdk.js
        timeout-minutes: 55
        env:
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage linux-jit-static-dpcpp
      - name: Retain build-only static DPC++ component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-static-dpcpp.tar
          path: ${{ runner.temp }}/native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-static-dpcpp.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report build-only boundary
        run: |
          {
            echo '### Linux static DPC++ SDK'
            echo '- The existing isolation producer transformed the same-run source-JIT closure, then the public static SDK producer built and admitted its component.'
            echo '- The artifact is not executed, runtime-qualified, or publication-qualified; no GPU/device was used.'
          } >> "$GITHUB_STEP_SUMMARY"

  fetch-linux-rocm-sources:
    name: Fetch pinned Linux ROCm/COMGR source roots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle_sha256: ${{ steps.seal.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test ROCm source admission and CI handoff
        run: node --test tests/native_sdk_fetch.js tests/native_ci.js
      - name: Fetch and re-admit the pinned ROCm source cohort
        timeout-minutes: 25
        run: node scripts/prepare-native-ci.js stage rocm-sources
      - name: Seal the shared ROCm source handoff
        id: seal
        run: |
          node <<'NODE'
          const fs = require('node:fs'), ci = require('./scripts/prepare-native-ci');
          const {fileHash} = require('./scripts/build-source-inputs');
          const archive = ci.rocmSourceStatePaths(ci.ciPaths()).sourceTar, stat = fs.lstatSync(archive);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 ||
              stat.size > 16 * 1024 ** 3 || fs.realpathSync(archive) !== archive) throw new Error('Invalid ROCm source handoff');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `bundle_sha256=${fileHash(archive)}\n`);
          NODE
      - name: Upload same-run ROCm source tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-rocm-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/native-rocm-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report source-only scope and retention
        run: |
          {
            echo '### ROCm/COMGR source prerequisite'
            echo '- This same-run raw tar preserves four shallow, non-promisor bare Git roots at their exact pinned ROCm commits, the original fetch/roots receipts, and the checksum-pinned CppHeaderParser source distribution with its separate acquisition receipt.'
            echo '- The shared ROCm LLVM root supplies the pinned COMGR and device-libs source trees; CLR, HIP, and ROCR remain separate original roots for the host runtime/resource producers.'
            echo '- Git and parser-source acquisition are networked; both are re-admitted offline. No source patching, compiler/SDK build, GPU execution, runtime qualification, or release publication occurs.'
            echo '- This source-only handoff expires after one day and is not a persistent cache or SDK artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-rocm-comgr-sdk:
    name: Build same-run Linux HIP resources and static COMGR
    needs: [fetch-linux-rocm-sources, fetch-linux-sources, install-audit-linux-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      hip_headers_bundle_sha256: ${{ steps.headers.outputs.bundle_sha256 }}
      hip_headers_handoff_sha256: ${{ steps.headers.outputs.handoff_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test ROCm resource, COMGR, and CI handoff contracts
        run: node --test tests/native_ci.js tests/native_rocm_resources.js tests/native_rocm_hip_headers.js tests/native_comgr_sdk.js
      - name: Download same-run ROCm source state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-rocm-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run LLVM 21 source state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run installed LLVM 21 SDK handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-llvm21-installed-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore, build Linux device resources, and build/admit static COMGR
        env:
          MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256: ${{ needs.install-audit-linux-sdk.outputs.llvm_sdk_handoff_sha256 }}
        timeout-minutes: 55
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage rocm-comgr-sdk
      - name: Export the admitted HIP headers without rebuilding ROCm
        id: headers
        timeout-minutes: 5
        run: |
          node <<'NODE'
          const fs = require("node:fs"), path = require("node:path"), ci = require("./scripts/prepare-native-ci");
          const {fileHash} = require("./scripts/build-source-inputs");
          const {exportRocmHipHeaders} = require("./scripts/native-rocm-hip-headers");
          const paths = ci.ciPaths(), state = ci.rocmComgrStatePaths(paths, paths.env);
          const name = "native-rocm-hip-headers-" + paths.suffix, root = path.join("/tmp", name);
          exportRocmHipHeaders(state.hipHeadersRoot, root, {runAttempt: paths.suffix});
          const archive = path.join(paths.runnerTemp, name + ".tar");
          ci.packState(archive, "/tmp", [name]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "bundle_sha256=" + fileHash(archive) + "\nhandoff_sha256=" + fileHash(path.join(root, "handoff.json")) + "\n");
          NODE
      - name: Retain the small verified HIP header handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-rocm-hip-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Retain same-run Linux ROCm/COMGR build-only state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report prerequisite scope and artifact boundary
        run: |
          {
            echo '### Linux AMD device resources and static COMGR prerequisite'
            echo '- This same-run raw tar preserves the admitted ROCm Git cohort, audited LLVM 21 SDK/source state, original HIP include export, Linux device resources, and static COMGR output with their receipts and dependencies at their recorded paths.'
            echo '- This is a CPU-only build-only prerequisite. It does not build a ROCm host runtime, run a GPU, qualify an application, or authorize release publication.'
            echo '- The artifact is not wired to release publishing and is retained for seven days; the source-only transfer expires after one day.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-rocm-host-sdk:
    name: Build and admit Linux ROCm host runtime SDK
    needs: [build-linux-rocm-comgr-sdk, install-audit-linux-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test ROCm host producer and same-run handoff
        run: node --test tests/native_ci.js tests/native_rocm_host_runtime.js tests/native_release_sdk_inputs.js
      - name: Download the same-run audited LLVM/ROCm/COMGR state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-rocm-comgr-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Provision exact host inputs, build/admit static ROCm host SDK
        env:
          MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256: ${{ needs.install-audit-linux-sdk.outputs.llvm_sdk_handoff_sha256 }}
        timeout-minutes: 55
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage rocm-host-sdk
      - name: Retain same-run Linux ROCm host runtime state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report build-only scope and artifact boundary
        run: |
          {
            echo '### Linux ROCm host runtime prerequisite SDK'
            echo '- This same-run raw tar preserves the admitted ROCm source roots, LLVM 21 SDK/build state, HIP headers, AMD device resources, COMGR SDK, pinned parser source/installation receipt, and freshly source-built static host archives.'
            echo '- APT and pinned parser provisioning occur before the public producer; the producer builds offline from same-run admitted sources and records its selected tool/package origins.'
            echo '- This is a CPU-only build-only prerequisite: no GPU execution, runtime qualification, complete native release, or publication approval is claimed.'
            echo '- The raw state artifact is retained for seven days and is not wired to release publishing.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-hermes-sdk:
    name: Build and audit static Hermes SDK
    needs: fetch-linux-hermes-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bundle_sha256: ${{ steps.seal.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download same-run Hermes source tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-hermes-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore, provision Intel 2026.2, and build/audit static Hermes
        timeout-minutes: 55
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage hermes-sdk
      - name: Seal the source-built Hermes handoff
        id: seal
        run: |
          node <<'NODE'
          const fs = require('node:fs'), ci = require('./scripts/prepare-native-ci');
          const {fileHash} = require('./scripts/build-source-inputs');
          const archive = ci.hermesStatePaths(ci.ciPaths()).sdkTar, stat = fs.lstatSync(archive);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 ||
              stat.size > 16 * 1024 ** 3 || fs.realpathSync(archive) !== archive) throw new Error('Invalid Hermes SDK handoff');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `bundle_sha256=${fileHash(archive)}\n`);
          NODE
      - name: Retain the same-run Hermes SDK state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report scope and artifact boundary
        run: |
          {
            echo '### Linux static Hermes prerequisite SDK'
            echo '- This same-run raw tar preserves the pinned Hermes fetch root, original producer build tree, static libraries, and receipts at their run-scoped /tmp paths.'
            echo '- This is an unpublished, build-only prerequisite; it is not a Node archive, complete native release, runtime qualification, or publication approval.'
            echo '- The final handoff is retained for seven days; the source-only transfer expires after one day.'
          } >> "$GITHUB_STEP_SUMMARY"

  fetch-linux-sources:
    name: Fetch pinned LLVM/OpenSSL/I/O sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test native prerequisite workflow
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js
      - name: Fetch and verify pinned LLVM/OpenSSL and I/O source state
        timeout-minutes: 55
        run: node scripts/prepare-native-ci.js stage sources
      - name: Upload same-run source tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

  build-linux-openmp-sdk:
    name: Build Linux static LLVM OpenMP host SDK
    needs: fetch-linux-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test static OpenMP producer and CI handoff
        run: node --test tests/native_openmp_sdk.js tests/native_ci.js
      - name: Download same-run pinned LLVM source tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore source, provision Intel 2026.2, and build static libomp.a
        timeout-minutes: 54
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage openmp-sdk
      - name: Retain same-run static OpenMP SDK state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report scope and artifact boundary
        run: |
          {
            echo '### Linux static LLVM OpenMP host SDK'
            echo '- This same-run raw tar preserves the pinned LLVM archive and acquisition receipt plus the OpenMP/CMake source slice, static libomp.a, producer receipt, logs, and CPU-only static-link smoke at their run-scoped /tmp paths.'
            echo '- Intel 2026.2 compiles only the static host runtime; offload targets, runtime qualification, complete application qualification, and release publication remain out of scope.'
            echo '- This build-only prerequisite feeds the same-run ACPP CUDA/HIP SDK stage; it is not a cache or public SDK artifact.'
            echo '- The source transfer expires after one day and the build-only handoff is retained for seven days.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-acpp-cuda-hip-sdk:
    name: Build and admit same-run static ACPP CUDA/HIP SDK
    needs: [fetch-linux-acpp-sources, build-linux-openmp-sdk, build-linux-rocm-host-sdk, provision-linux-dpcpp-cuda-inputs,
      install-audit-linux-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bundle_sha256: ${{ steps.handoff.outputs.bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test ACPP CUDA/HIP producer and same-run admission
        run: node --test tests/native_ci.js tests/native_sycl_sdk.js tests/native_release_sdk_inputs.js
      - name: Download same-run ACPP source, OpenMP and ROCm host SDK state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-acpp-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run static OpenMP SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run pinned Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run DPC++/CUDA headers and runtime inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run ROCm host, COMGR and LLVM SDK state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Provision Intel 2026.2, build combined CUDA/HIP SDK and admit inputs
        env:
          MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256: ${{ needs.install-audit-linux-sdk.outputs.llvm_sdk_handoff_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        timeout-minutes: 55
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage acpp-cuda-hip-sdk
      - name: Pin the admitted ACPP SDK handoff for downstream jobs
        id: handoff
        run: |
          archive="$RUNNER_TEMP/native-linux-acpp-cuda-hip-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          test -f "$archive"
          test ! -L "$archive"
          pin=$(sha256sum -- "$archive")
          echo "bundle_sha256=${pin%% *}" >> "$GITHUB_OUTPUT"
      - name: Retain same-run build-only ACPP CUDA/HIP SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report build-only scope and artifact boundary
        run: |
          {
            echo '### Static AdaptiveCpp CUDA/HIP SDK prerequisite'
            echo '- The public producer consumes same-run pinned/prepared ACPP source, LLVM 21, CUDA 12.6 headers and exact static runtime archives, ROCm host/COMGR/device resources, and static OpenMP.'
            echo '- Public nativeStaticRuntimeInputs admission rechecks the CUDA/HIP backend, source, compiler, CUDA, COMGR, OpenMP and selected static-library closure before the raw output SDK tar is retained.'
            echo '- This CPU-only build prerequisite does not execute a GPU, qualify runtime behavior, assemble a complete application, or authorize release publication.'
            echo '- The same-run SDK handoff expires after seven days and is not a persistent cache or release artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-io-openssl-sdk:
    name: Build Linux static I/O and OpenSSL SDKs
    needs: fetch-linux-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Start the I/O/OpenSSL job deadline
        id: io-openssl-deadline
        shell: bash
        run: echo "epoch=$(( $(date +%s) + 3000 ))" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download same-run source tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore sources, provision Intel 2026.2, and build static SDKs
        env:
          MOM_NATIVE_IO_OPENSSL_DEADLINE_EPOCH: ${{ steps.io-openssl-deadline.outputs.epoch }}
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage io-openssl
      - name: Retain the same-run I/O/OpenSSL SDK state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report scope and artifact boundary
        run: |
          {
            echo '### Linux static I/O and OpenSSL SDK bootstrap'
            echo '- This same-run tar contains only the pinned LLVM/OpenSSL and libuv/zlib source roots plus the static I/O/OpenSSL producer outputs and receipts at their original /tmp paths.'
            echo '- The SDKs are build-only, unpublished prerequisites; this is not a complete native release or runtime qualification.'
            echo '- The artifact is separate from release publishing and is retained for seven days; intermediate state expires after one day.'
          } >> "$GITHUB_STEP_SUMMARY"

  configure-linux-sdk:
    name: Provision Intel 2026.2 and configure LLVM 21
    needs: fetch-linux-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download same-run source tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore source, provision the signed Intel SDK, and configure
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage configure
      - name: Upload configured source/build state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-configured.tar
          path: ${{ runner.temp }}/native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-configured.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

  build-llvm-common:
    name: Build LLVM common foundation, analysis and optimization
    needs: configure-linux-sdk
    uses: ./.github/workflows/build-linux-llvm-job.yml
    with:
      stage: llvm-common

  build-llvm-core-codegen:
    name: Build LLVM common code generation libraries
    needs: build-llvm-common
    uses: ./.github/workflows/build-linux-llvm-job.yml
    with:
      stage: llvm-core-codegen

  build-llvm-backends-clang:
    name: Build LLVM backends and Clang analysis
    needs: build-llvm-core-codegen
    uses: ./.github/workflows/build-linux-llvm-job.yml
    with:
      stage: llvm-backends-clang

  build-clang-frontend:
    name: Build remaining Clang frontend libraries
    needs: build-llvm-backends-clang
    uses: ./.github/workflows/build-linux-llvm-job.yml
    with:
      stage: clang-frontend

  install-audit-linux-sdk:
    name: Build tools, install and audit Linux LLVM SDK
    needs: build-clang-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle_sha256: ${{ steps.sdk-bundle.outputs.sha256 }}
      llvm_sdk_handoff_sha256: ${{ steps.installed-sdk.outputs.llvm_sdk_handoff_sha256 }}
      tools_bundle_sha256: ${{ steps.llvm-tools.outputs.tools_bundle_sha256 }}
      tools_handoff_sha256: ${{ steps.llvm-tools.outputs.tools_handoff_sha256 }}
      frontend_bundle_sha256: ${{ steps.llvm-frontend.outputs.frontend_bundle_sha256 }}
      frontend_handoff_sha256: ${{ steps.llvm-frontend.outputs.frontend_handoff_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download completed compiler state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-llvm21-state-${{ github.run_id }}-${{ github.run_attempt }}-clang-frontend.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore, build tools, install and audit with Intel 2026.2
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage install-audit
      - name: Pin the same-run Linux LLVM SDK state bundle
        id: sdk-bundle
        shell: bash
        run: |
          archive="${{ runner.temp }}/native-linux-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar"
          test -f "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Export the admitted installed LLVM SDK for Linux consumers
        id: installed-sdk
        timeout-minutes: 20
        run: node scripts/prepare-native-ci.js stage linux-llvm-installed-sdk
      - name: Retain the same-run installed Linux LLVM SDK handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-llvm21-installed-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-llvm21-installed-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Create the thin Windows LLVM tool and locked-source handoff
        id: llvm-tools
        timeout-minutes: 20
        run: node scripts/prepare-native-ci.js stage linux-llvm-tools
      - name: Export the matching ACPP frontend without LLVM development libraries
        id: llvm-frontend
        timeout-minutes: 10
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const ci = require('./scripts/prepare-native-ci');
          const {fileHash} = require('./scripts/build-source-inputs');
          const {exportLinuxLlvmAcppFrontend, linuxLlvmAcppFrontendInputs} = require('./scripts/native-linux-llvm-tools');
          const paths = ci.ciPaths(), name = 'native-linux-llvm-acpp-frontend-' + paths.suffix;
          const parent = path.join(paths.runnerTemp, 'acpp-frontend-export-' + paths.suffix);
          fs.mkdirSync(parent, {mode: 0o700});
          const bundle = path.join(parent, name), archive = path.join(paths.runnerTemp, name + '.tar');
          const produced = exportLinuxLlvmAcppFrontend(paths.output, bundle, {runAttempt: paths.suffix});
          linuxLlvmAcppFrontendInputs(bundle, {runAttempt: paths.suffix, handoffSha256: produced.handoffSha256});
          ci.packState(archive, parent, [name]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'frontend_bundle_sha256=' + fileHash(archive) + '\n' +
            'frontend_handoff_sha256=' + produced.handoffSha256 + '\n');
          NODE
      - name: Retain the source-admitted ACPP frontend and resource headers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-llvm-acpp-frontend-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-llvm-acpp-frontend-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Retain thin same-run Linux LLVM tool inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-llvm-tools-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-llvm-tools-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Upload full source/build/SDK state for same-run re-verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report qualification scope and state transfer
        run: |
          {
            echo '### Native Linux LLVM 21.1.8 SDK'
            echo '- The audit artifact is a same-run tar containing source, Ninja/CMake build state, installed SDK, and original producer receipts at their original /tmp paths.'
            echo '- A separate one-day thin handoff is exported only after full SDK admission; it contains the locked LLVM source tar, exact Windows LLVM host-tool closure, and unchanged admission receipts, not the full source/build/SDK tree.'
            echo '- Tar handoffs preserve file modes, symlinks, and timestamps; intermediate artifacts expire after one day.'
            echo '- The final state artifact expires after seven days and is not connected to release publishing.'
            echo '- This is source/build qualification only (publicationQualified: false); runtime and release qualification remain separate.'
            echo '- Each build job installs Intel 2026.2 through the signed existing install-dev.sh APT route. Producer tool-identity receipts fail closed on package/tool drift between jobs.'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-linux-nvrtc:
    name: Verify pinned Linux NVRTC inputs and CPU proof
    needs: install-audit-linux-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Download same-run installed LLVM 21 SDK handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-llvm21-installed-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Restore installed LLVM 21 handoff under its original receipt paths
        run: >-
          node scripts/prepare-native-ci.js extract
          ${{ runner.temp }}/incoming/native-linux-llvm21-installed-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          /tmp
          mom-native-llvm21-sdk-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test NVRTC acquisition, assembly, and CI contracts
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_nvrtc_sdk.js
      - name: Install syscall tracing prerequisite
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace
      - name: Fetch, assemble, admit, and CPU-prove Linux NVRTC; retain evidence only
        env:
          MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256: ${{ needs.install-audit-linux-sdk.outputs.llvm_sdk_handoff_sha256 }}
        timeout-minutes: 45
        run: scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage nvrtc-linux
      - name: Report non-publication scope
        run: |
          {
            echo '### Linux NVRTC verification only'
            echo '- The pinned vendor archives and assembled SDK remained on this runner and were not uploaded.'
            echo '- The verification tar contains acquisition/SDK receipts, proof logs, and generated compiler outputs only; linked proof executables and vendor libraries are excluded.'
            echo '- Linux static-vs-shared and LLD proof is CPU-only. It does not qualify GPU/runtime behavior, redistribution, or publication.'
            echo '- This evidence is not a reusable SDK handoff or complete native application release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux verification evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-nvrtc-linux-verification-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-nvrtc-linux-verification-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

  verify-windows-nvrtc:
    name: Admit pinned Windows NVRTC inputs only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test NVRTC acquisition, assembly, and CI contracts
        run: node --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_nvrtc_sdk.js
      - name: Fetch, assemble, and admit Windows NVRTC; retain evidence only
        timeout-minutes: 35
        run: node scripts/prepare-native-ci.js stage nvrtc-windows
      - name: Report admission-only scope
        run: |
          {
            echo '### Windows NVRTC admission only'
            echo '- The pinned vendor archives and assembled SDK remained on this runner and were not uploaded.'
            echo '- The verification tar contains acquisition and SDK receipts only; no Windows compile or executable proof ran.'
            echo '- This is not redistribution-qualified, publication-qualified, or a reusable SDK handoff.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows verification evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-nvrtc-windows-verification-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-nvrtc-windows-verification-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

  compose-linux-sdk-descriptor:
    name: Compose same-run Linux SDK descriptor
    needs: [install-audit-linux-sdk, linux-sources, provision-linux-dpcpp-cuda-inputs, build-linux-cuda-images, build-linux-static-dpcpp-sdk,
      fetch-linux-acpp-sources, build-linux-acpp-cuda-hip-sdk, build-linux-hermes-sdk, build-linux-rocm-host-sdk,
      build-linux-openmp-sdk, build-linux-zstd-sdk, build-linux-io-openssl-sdk, capture-gnu-headers]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Install pinned native-build tooling and AOT dependencies
        timeout-minutes: 10
        run: |
          sudo env MOM_DEV_WORKSPACE=/var/tmp/mom-dev-native-node-${{ github.run_id }}-${{ github.run_attempt }} \
            scripts/install-dev.sh --component node --jobs 2
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'for (const name of ["buffer/", "events/", "string_decoder/", "core-js-pure"]) require.resolve(name); require("esbuild").transformSync("const ready = 1");'
      - name: Test descriptor composition and same-run artifact contracts
        timeout-minutes: 5
        run: node --test tests/native_ci.js tests/native_release_sdk_inputs.js tests/native_dpcpp_component.js tests/native_notices.js
      - name: Download same-run Linux sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run GNU headers and package copyrights
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run CUDA image handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-cuda-images-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run static DPC++ component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-static-dpcpp.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run ACPP source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-acpp-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run ACPP CUDA/HIP SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run Hermes SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run ROCm host SDK and inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run OpenMP SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run zstd SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run I/O and OpenSSL SDKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Provision signed Intel tools and compose public descriptor
        env:
          MOM_NATIVE_LINUX_LLVM_SDK_HANDOFF_SHA256: ${{ needs.install-audit-linux-sdk.outputs.llvm_sdk_handoff_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        timeout-minutes: 40
        run: node scripts/prepare-native-ci.js stage linux-sdk-descriptor
      - name: Retain the same-run source-composed SDK descriptor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report descriptor-only boundary
        run: echo 'The original same-run source SDK descriptor and admission are immutable inputs for separate Core, factory, and application jobs; no compilation or publication occurs here.' >> "$GITHUB_STEP_SUMMARY"

  build-linux-native-core:
    name: Build same-run portable native Core
    needs: compose-linux-sdk-descriptor
    uses: ./.github/workflows/build-linux-native-component.yml
    with:
      profile: core

  build-linux-native-acpp-cuda:
    name: Build Linux GPU factory / ACPP CUDA
    needs: compose-linux-sdk-descriptor
    uses: ./.github/workflows/build-linux-native-component.yml
    with:
      profile: acpp-cuda

  build-linux-native-acpp-hip:
    name: Build Linux GPU factory / ACPP HIP
    needs: compose-linux-sdk-descriptor
    uses: ./.github/workflows/build-linux-native-component.yml
    with:
      profile: acpp-hip

  build-linux-native-dpcpp:
    name: Build Linux GPU factory / DPC++ CUDA
    needs: compose-linux-sdk-descriptor
    uses: ./.github/workflows/build-linux-native-component.yml
    with:
      profile: dpcpp

  build-linux-native-dpcpp-opencl:
    name: Build Linux GPU factory / portable OpenCL
    needs: compose-linux-sdk-descriptor
    uses: ./.github/workflows/build-linux-native-component.yml
    with:
      profile: dpcpp-opencl

  build-linux-native-oneapi:
    name: Build Linux GPU factory / oneAPI
    needs: compose-linux-sdk-descriptor
    uses: ./.github/workflows/build-linux-native-component.yml
    with:
      profile: oneapi

  assemble-linux-native-application:
    name: Assemble same-run Linux native application
    needs: [compose-linux-sdk-descriptor, build-linux-native-core, build-linux-native-acpp-cuda, build-linux-native-acpp-hip,
      build-linux-native-dpcpp, build-linux-native-dpcpp-opencl, build-linux-native-oneapi]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      executable_sha256: ${{ steps.native-runtime-input.outputs.sha256 }}
      executable_artifact_name: ${{ steps.native-runtime-input.outputs.artifact_name }}
      executable_bytes: ${{ steps.native-runtime-input.outputs.executable_bytes }}
      entrypoint_sha256: ${{ steps.native-runtime-input.outputs.entrypoint_sha256 }}
      producer_receipt_sha256: ${{ steps.native-runtime-input.outputs.producer_receipt_sha256 }}
      build_handoff_artifact_name: ${{ steps.native-runtime-input.outputs.build_handoff_artifact_name }}
      build_handoff_bundle_sha256: ${{ steps.native-runtime-input.outputs.build_handoff_bundle_sha256 }}
      build_handoff_sha256: ${{ steps.native-runtime-input.outputs.build_handoff_sha256 }}
    steps:
      - name: Start the application-stage deadline
        id: application-deadline
        shell: bash
        run: echo "epoch=$(( $(date +%s) + 3300 ))" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Install pinned native-build tooling and AOT dependencies
        timeout-minutes: 10
        run: |
          sudo env MOM_DEV_WORKSPACE=/var/tmp/mom-dev-native-assembly-${{ github.run_id }}-${{ github.run_attempt }} \
            scripts/install-dev.sh --component node --jobs 2
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'for (const name of ["buffer/", "events/", "string_decoder/", "core-js-pure"]) require.resolve(name); require("esbuild").transformSync("const ready = 1");'
      - name: Download the exact same-run descriptor and original SDK tars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-{linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources,linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }},linux-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }},linux-cuda-images-${{ github.run_id }}-${{ github.run_attempt }},linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-static-dpcpp,acpp-state-${{ github.run_id }}-${{ github.run_attempt }}-sources,linux-acpp-cuda-hip-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-hermes-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-rocm-host-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-openmp-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-zstd-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-io-openssl-sdk-${{ github.run_id }}-${{ github.run_attempt }},linux-sdk-descriptor-${{ github.run_id }}-${{ github.run_attempt }}}.tar
          merge-multiple: true
          path: ${{ runner.temp }}/downloads
      - name: Download exactly the same-run Core and five GPU component tars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-linux-component-{core,acpp-cuda,acpp-hip,dpcpp,dpcpp-opencl,oneapi}-${{ github.run_id }}-${{ github.run_attempt }}.tar
          merge-multiple: true
          path: ${{ runner.temp }}/downloads
      - name: Assemble only the maintained application from admitted components
        timeout-minutes: 55
        env:
          MOM_NATIVE_APPLICATION_DEADLINE_EPOCH: ${{ steps.application-deadline.outputs.epoch }}
          MOM_NATIVE_LINUX_COMPONENT_CORE_SHA256: ${{ needs.build-linux-native-core.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_COMPONENT_ACPP_CUDA_SHA256: ${{ needs.build-linux-native-acpp-cuda.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_COMPONENT_ACPP_HIP_SHA256: ${{ needs.build-linux-native-acpp-hip.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_COMPONENT_DPCPP_SHA256: ${{ needs.build-linux-native-dpcpp.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_COMPONENT_DPCPP_OPENCL_SHA256: ${{ needs.build-linux-native-dpcpp-opencl.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_COMPONENT_ONEAPI_SHA256: ${{ needs.build-linux-native-oneapi.outputs.bundle_sha256 }}
        run: |
          set +e
          scripts/run-bounded-native-ci.sh node scripts/prepare-native-ci.js stage linux-native-application 2>&1 | tail -c 1048576 | tee "$RUNNER_TEMP/native-linux-application-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            link_log="/tmp/mom-native-linux-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/application/link.log"
            if [[ -f "$link_log" && ! -L "$link_log" ]]; then
              head -c 16777216 -- "$link_log" > "$RUNNER_TEMP/native-linux-application-link-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
            fi
          fi
          exit "$status"
      - name: Bind the raw executable to its same-run build receipt
        id: native-runtime-input
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ github.run_id }}
          NATIVE_RUN_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_APP_ROOT: /tmp/mom-native-linux-application-${{ github.run_id }}-${{ github.run_attempt }}
          NATIVE_RUNTIME_DIRECTORY: ${{ runner.temp }}/mom-native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          MOM_NATIVE_APPLICATION_DEADLINE_EPOCH: ${{ steps.application-deadline.outputs.epoch }}
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs"), path = require("node:path"), ci = require("./scripts/prepare-native-ci.js");
          const {fileHash, readBuildJson} = require("./scripts/build-source-inputs.js");
          const env = process.env, run = env.NATIVE_RUN_ID || "", attempt = env.NATIVE_RUN_ATTEMPT || "", suffix = run + "-" + attempt,
            appRoot = "/tmp/mom-native-linux-application-" + suffix, runtimeDirectory = env.NATIVE_RUNTIME_DIRECTORY || "",
            runnerTempInput = env.RUNNER_TEMP || "", runnerTemp = path.resolve(runnerTempInput),
            binary = path.join(appRoot, "mom"), receiptPath = path.join(appRoot, "result.json"),
            entrypointPath = path.join(appRoot, "entrypoint.json"), configPath = path.join(runnerTemp, "native-linux-assembly-config-" + suffix + ".json"),
            evidenceName = "native-linux-application-build-" + suffix, evidenceRoot = path.join("/tmp", evidenceName),
            archive = path.join(runnerTemp, evidenceName + ".tar"), outputFile = env.GITHUB_OUTPUT || "", summaryFile = env.GITHUB_STEP_SUMMARY || "",
            deadline = Number(env.MOM_NATIVE_APPLICATION_DEADLINE_EPOCH);
          const remaining = capMs => {
            const milliseconds = Math.min(capMs, deadline * 1000 - Date.now());
            if (!Number.isSafeInteger(milliseconds) || milliseconds < 1000) {throw new Error("Linux application aggregate deadline expired during handoff sealing");}
            return milliseconds;
          };
          const canonicalRegular = (file, label, maximum) => {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size < 1 || stat.size > maximum ||
                fs.realpathSync(file) !== file || path.resolve(file) !== file) {throw new Error("Invalid Linux application " + label);}
            return {bytes: stat.size, sha256: fileHash(file), identity: {dev: stat.dev, ino: stat.ino, size: stat.size, mtimeMs: stat.mtimeMs}};
          };
          if (!/^[0-9]{1,20}$/.test(run) || !/^[1-9][0-9]{0,5}$/.test(attempt) || !Number.isSafeInteger(deadline) || deadline * 1000 <= Date.now() ||
              env.NATIVE_APP_ROOT !== appRoot || !path.isAbsolute(runnerTempInput) || runnerTemp !== runnerTempInput || fs.realpathSync(runnerTemp) !== runnerTemp ||
              runtimeDirectory !== path.join(runnerTemp, "mom-native-runtime-" + suffix) || !path.isAbsolute(outputFile) || !path.isAbsolute(summaryFile) ||
              fs.existsSync(runtimeDirectory) || fs.existsSync(evidenceRoot) || fs.existsSync(archive)) {
            throw new Error("Linux application handoff paths are not the fresh canonical run-attempt plan");}
          const rootStat = fs.lstatSync(appRoot);
          if (!rootStat.isDirectory() || rootStat.isSymbolicLink() || fs.realpathSync(appRoot) !== appRoot) {throw new Error("Linux application output is not a canonical directory");}
          const artifact = canonicalRegular(binary, "runtime executable", (1 << 30) - 1),
            resultRecord = canonicalRegular(receiptPath, "producer receipt", 8 << 20),
            entrypointRecord = canonicalRegular(entrypointPath, "original entrypoint", 8 << 20),
            configRecord = canonicalRegular(configPath, "derived application config", 8 << 20),
            result = readBuildJson(receiptPath), entrypoint = readBuildJson(entrypointPath),
            sourceSha256 = artifact.sha256;
          if (result.binary !== binary || result.sha256 !== sourceSha256 || result.bytes !== artifact.bytes || result.configHash !== configRecord.sha256 ||
              result.buildOnly !== true || result.publicationQualified !== false || result.application?.application !== true ||
              result.application?.entrypoint !== "mom.js" || result.application?.buildOnly !== true ||
              entrypoint.version !== 1 || entrypoint.target !== "linux" || entrypoint.configFile !== configPath || entrypoint.configHash !== configRecord.sha256 ||
              entrypoint.source?.path !== binary || entrypoint.source.sha256 !== sourceSha256 ||
              entrypoint.artifact?.path !== binary || entrypoint.artifact.bytes !== artifact.bytes || entrypoint.artifact.sha256 !== sourceSha256 ||
              entrypoint.producerReceipt?.path !== receiptPath || entrypoint.producerReceipt.sha256 !== resultRecord.sha256 ||
              !entrypoint.recipe || typeof entrypoint.recipe !== "object" || Array.isArray(entrypoint.recipe) ||
              !entrypoint.componentHashes || typeof entrypoint.componentHashes !== "object" || Array.isArray(entrypoint.componentHashes) ||
              Object.keys(entrypoint.componentHashes).join("\0") !== receiptPath || entrypoint.componentHashes[receiptPath] !== resultRecord.sha256 ||
              entrypoint.buildOnly !== true || entrypoint.publicationQualified !== false) {
            throw new Error("Linux handoff differs from the public build-only entrypoint, config or producer receipt");}
          fs.mkdirSync(evidenceRoot, {mode: 0o700});
          for (const [source, name, sha256] of [[configPath, "application-config.json", configRecord.sha256],
            [entrypointPath, "entrypoint.json", entrypointRecord.sha256], [receiptPath, "result.json", resultRecord.sha256]]) {
            const destination = path.join(evidenceRoot, name);
            fs.copyFileSync(source, destination, fs.constants.COPYFILE_EXCL);
            if (fileHash(source) !== sha256 || fileHash(destination) !== sha256) {throw new Error("Linux application evidence copy changed: " + name);}
          }
          const handoff = {version: 1, format: "mom-linux-application-build-handoff-v1", runAttempt: suffix,
            target: "x86_64-unknown-linux-gnu", artifact: {file: "mom", bytes: artifact.bytes, sha256: artifact.sha256},
            config: {file: "application-config.json", sha256: configRecord.sha256},
            producerReceipt: {file: "result.json", sha256: resultRecord.sha256},
            entrypointReceipt: {file: "entrypoint.json", sha256: entrypointRecord.sha256},
            buildOnly: true, executed: false, publicationQualified: false};
          const handoffFile = path.join(evidenceRoot, "handoff.json");
          fs.writeFileSync(handoffFile, JSON.stringify(handoff, null, 2) + "\n", {flag: "wx", mode: 0o444});
          const handoffSha256 = fileHash(handoffFile), packed = ci.packState(archive, "/tmp", [evidenceName], remaining(5 * 60 * 1000)),
            expectedMembers = [evidenceName, ...["application-config.json", "entrypoint.json", "handoff.json", "result.json"].map(name => `${evidenceName}/${name}`)].sort(),
            members = ci.listState(archive, [evidenceName], remaining(5 * 60 * 1000)).map(name => name.replace(/\/$/, "")).sort();
          const runtimeStat = fs.lstatSync(binary), outputStat = fs.lstatSync(outputFile), summaryStat = fs.lstatSync(summaryFile);
          if (packed.bytes < 1 || packed.bytes > 128 << 20 || members.join("\0") !== expectedMembers.join("\0") ||
              !/^[a-f0-9]{64}$/.test(handoffSha256) || fileHash(handoffFile) !== handoffSha256 ||
              artifact.identity.dev !== runtimeStat.dev || artifact.identity.ino !== runtimeStat.ino || artifact.identity.size !== runtimeStat.size ||
              fileHash(binary) !== artifact.sha256 || fileHash(configPath) !== configRecord.sha256 ||
              fileHash(receiptPath) !== resultRecord.sha256 || fileHash(entrypointPath) !== entrypointRecord.sha256 ||
              !outputStat.isFile() || outputStat.isSymbolicLink() || !summaryStat.isFile() || summaryStat.isSymbolicLink()) {
            throw new Error("Linux application runtime or compact evidence changed while sealing");}
          fs.mkdirSync(runtimeDirectory, {mode: 0o700});
          const runtimeBinary = path.join(runtimeDirectory, "mom");
          fs.copyFileSync(binary, runtimeBinary, fs.constants.COPYFILE_EXCL); fs.chmodSync(runtimeBinary, runtimeStat.mode & 0o777);
          if (fileHash(runtimeBinary) !== sourceSha256 || fileHash(binary) !== sourceSha256) {throw new Error("Runtime handoff copy differs from the pinned build receipt");}
          const artifactName = "native-linux-executable-" + suffix;
          fs.appendFileSync(outputFile, [
            `sha256=${sourceSha256}`, `artifact_name=${artifactName}`, `executable_bytes=${artifact.bytes}`,
            `entrypoint_sha256=${entrypointRecord.sha256}`, `producer_receipt_sha256=${resultRecord.sha256}`,
            `build_handoff_artifact_name=${evidenceName}.tar`, `build_handoff_bundle_sha256=${fileHash(archive)}`,
            `build_handoff_sha256=${handoffSha256}`,
          ].join("\n") + "\n", {flag: "a"});
          fs.appendFileSync(summaryFile, `### Sealed Linux application handoff\n- \`mom\`: ${artifact.bytes} bytes, SHA-256 \`${sourceSha256}\`.\n` +
            `- Compact build receipt bundle SHA-256: \`${fileHash(archive)}\`; original entrypoint SHA-256: \`${entrypointRecord.sha256}\`.\n` +
            "- The evidence preserves build-only provenance; no executable ran and this is not publication qualification.\n", "utf8");
          console.log("Bound same-run Linux executable and compact build evidence: " + sourceSha256);
          NODE
      - name: Retain bounded application diagnostics on failure
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-application-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}.log
          path: ${{ runner.temp }}/native-linux-application-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: warn
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Retain the full bounded Linux linker diagnostics on failure
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-application-link-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}.log
          path: ${{ runner.temp }}/native-linux-application-link-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: warn
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Retain the build-only Linux application assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-application-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-application-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Retain the exact executable for runtime-only checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-native-runtime-${{ github.run_id }}-${{ github.run_attempt }}/mom
          if-no-files-found: error
          archive: true
          compression-level: 0
          retention-days: 1
      - name: Retain compact Linux application build receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-application-build-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-linux-application-build-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 7
      - name: Report bounded build-only qualification boundary
        run: |
          {
            echo '### Same-run Linux native application assembly'
            echo '- Six producer outputs were built in separate same-run jobs and re-admitted by the public release frontdoor through a derived config that adds only the complete component map.'
            echo '- Original source/SDK descriptor, admissions, Core/factory receipts and objects remain unchanged; only the maintained controller/application was compiled here.'
            echo '- The executable was not run in this job and no release was published; runtime checks consume the exact raw binary SHA in a separate workflow.'
            echo '- This is build evidence, not full runtime/GPU/performance or publication qualification. Artifacts expire after one day.'
          } >> "$GITHUB_STEP_SUMMARY"

  test-linux-native-runtime:
    name: Runtime-only Linux checks (not publication qualification)
    needs: assemble-linux-native-application
    uses: ./.github/workflows/test-native-release.yml
    with:
      artifact_name: ${{ needs.assemble-linux-native-application.outputs.executable_artifact_name }}
      expected_sha256: ${{ needs.assemble-linux-native-application.outputs.executable_sha256 }}
      platform: linux

  pack-linux-native-application:
    name: Pack the exact Linux application without rebuilding
    needs: assemble-linux-native-application
    uses: ./.github/workflows/pack-native-application.yml
    with:
      platform: linux
      executable_artifact_name: ${{ needs.assemble-linux-native-application.outputs.executable_artifact_name }}
      executable_sha256: ${{ needs.assemble-linux-native-application.outputs.executable_sha256 }}
      build_handoff_artifact_name: ${{ needs.assemble-linux-native-application.outputs.build_handoff_artifact_name }}
      build_handoff_bundle_sha256: ${{ needs.assemble-linux-native-application.outputs.build_handoff_bundle_sha256 }}
      build_handoff_sha256: ${{ needs.assemble-linux-native-application.outputs.build_handoff_sha256 }}

  test-linux-packed-runtime:
    name: Test the exact packed Linux executable
    needs: pack-linux-native-application
    uses: ./.github/workflows/test-native-release.yml
    with:
      artifact_name: ${{ needs.pack-linux-native-application.outputs.executable_artifact_name }}
      expected_sha256: ${{ needs.pack-linux-native-application.outputs.executable_sha256 }}
      platform: linux
      variant: packed

  build-windows-native-core:
    name: Build Windows CPU Core archive
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      MOM_BUILD_JOBS: "2"
    outputs:
      core_sha256: ${{ steps.stage-core.outputs.core_sha256 }}
      receipt_sha256: ${{ steps.stage-core.outputs.receipt_sha256 }}
      handoff_sha256: ${{ steps.stage-core.outputs.handoff_sha256 }}
      bundle_sha256: ${{ steps.stage-core.outputs.bundle_sha256 }}
    steps:
      - name: Start the aggregate Windows Core deadline
        id: core-deadline
        shell: pwsh
        run: |
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 3300
          "epoch=$epoch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned base tools, Node.js, and Intel oneAPI only
        timeout-minutes: 35
        shell: cmd
        run: scripts\install-dev.bat -Component base,node,oneapi -Jobs 2

      - name: Test Windows Core producer and CI handoff
        timeout-minutes: 5
        shell: pwsh
        run: >-
          node --require ./tests/common/no_pool_network.js --test tests/native_ci.js tests/native_windows_core.js
          tests/native_windows_core_build.js tests/native_windows_core_incremental.js tests/native_windows_core_handoff.js
          tests/native_windows_ci_tools.js tests/native_notices.js

      - name: Build and stage the public Windows Core producer output
        id: stage-core
        timeout-minutes: 35
        shell: pwsh
        env:
          MOM_NATIVE_WINDOWS_CORE_DEADLINE_EPOCH: ${{ steps.core-deadline.outputs.epoch }}
        run: .github/workflows/scripts/prepare-native-windows-ci.ps1 -Role core

      - name: Retain the exact same-run Core bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-windows-core-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-windows-core-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

      - name: Report build-only scope
        shell: pwsh
        run: |
          @'
          ### Same-run Windows CPU Core producer
          - The public producer built and audited only the maintained static CPU Core archive; the tar contains that archive, its unchanged producer receipt, and a hash-bound handoff index.
          - Only pinned base, Node.js, and oneAPI development components were requested. No GPU driver, application, SDK/toolchain, runtime test, or publication artifact is included.
          - The exact same-run bundle and outputs expire after one day.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  build-windows-controller-sdk:
    name: Build Windows controller ${{ matrix.role }} SDK
    needs: fetch-linux-hermes-sources
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      io_bundle_sha256: ${{ steps.stage-controller.outputs.io_bundle_sha256 }}
      io_handoff_sha256: ${{ steps.stage-controller.outputs.io_handoff_sha256 }}
      hermes_bundle_sha256: ${{ steps.stage-controller.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ steps.stage-controller.outputs.hermes_handoff_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        role: [io, hermes]
    env:
      MOM_BUILD_JOBS: "2"
    steps:
      - name: Start the aggregate SDK deadline
        id: controller-deadline
        shell: pwsh
        run: |
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 3300
          "epoch=$epoch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned controller build tools
        timeout-minutes: 35
        shell: pwsh
        run: |
          $components = if ('${{ matrix.role }}' -eq 'io') { 'base,node,oneapi,perl' } else { 'base,node,oneapi' }
          & scripts/install-dev.ps1 -Component $components -Jobs 2
      - name: Test Windows controller producers and CI handoff
        timeout-minutes: 5
        shell: pwsh
        run: >-
          node --require ./tests/common/no_pool_network.js --test tests/native_ci.js tests/native_sdk_fetch.js tests/native_windows_ci_tools.js
          tests/native_io_sdk.js tests/native_openssl_sdk.js tests/native_hermes_sdk.js tests/native_windows_controller_handoff.js
      - name: Download same-run pinned Hermes source
        if: matrix.role == 'hermes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-hermes-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Build and admit public controller SDK outputs
        id: stage-controller
        timeout-minutes: 50
        shell: pwsh
        env:
          MOM_NATIVE_WINDOWS_CONTROLLER_DEADLINE_EPOCH: ${{ steps.controller-deadline.outputs.epoch }}
          MOM_NATIVE_WINDOWS_CONTROLLER_IO_DIR: ${{ runner.temp }}/mom-native-windows-controller-io-${{ github.run_id }}-${{ github.run_attempt }}
          MOM_NATIVE_WINDOWS_CONTROLLER_HERMES_DIR: ${{ runner.temp }}/mom-native-windows-controller-hermes-${{ github.run_id }}-${{ github.run_attempt }}
        run: .github/workflows/scripts/prepare-native-windows-ci.ps1 -Role '${{ matrix.role }}'
      - name: Retain same-run static libraries and original receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-windows-controller-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/native-windows-controller-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1

  windows-llvm-configure:
    name: Configure Windows LLVM SDK
    needs: [build-windows-controller-sdk, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-llvm-job.yml
    with:
      phase: configure
      hermes_bundle_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_bundle_sha256 }}
      hermes_handoff_sha256: ${{ needs.build-windows-controller-sdk.outputs.hermes_handoff_sha256 }}
      linux_tools_bundle_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_bundle_sha256 }}
      linux_tools_handoff_sha256: ${{ needs.install-audit-linux-sdk.outputs.tools_handoff_sha256 }}

  build-windows-oneapi-gpu:
    name: Build Windows oneAPI GPU factory from original inputs
    needs: [linux-sources, provision-linux-dpcpp-cuda-inputs, install-audit-linux-sdk]
    uses: ./.github/workflows/build-windows-gpu-job.yml
    with:
