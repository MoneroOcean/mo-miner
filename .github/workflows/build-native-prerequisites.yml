        timeout-minutes: 10
        run: node --test tests/native_ci.js tests/native_jit_sdk.js tests/native_dpcpp_sdk.js
      - name: Download same-run Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run GNU target headers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-gnu-headers-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run source-JIT resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-jit-resources-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Configure the original compiler source-JIT graph
        timeout-minutes: 55
        env:
          MOM_NATIVE_LINUX_DPCPP_CUDA_BUNDLE_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.bundle_sha256 }}
          MOM_NATIVE_LINUX_DPCPP_CUDA_MANIFEST_SHA256: ${{ needs.provision-linux-dpcpp-cuda-inputs.outputs.manifest_sha256 }}
        run: node scripts/prepare-native-ci.js stage linux-jit-configure
      - name: Retain configured mutable source-JIT state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-configured.tar
          path: ${{ runner.temp }}/native-linux-jit-sdk-${{ github.run_id }}-${{ github.run_attempt }}-configured.tar
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 1
      - name: Report configure-only boundary
        run: |
          {
            echo '### Linux source-JIT SDK configure'
            echo '- The public producer configured the exact same-run compiler sources, DPC++ inputs, resource overlay and host tools; only mutable compiler state is transferred.'
