  link-linux-source-jit:
    name: Link original Linux source-JIT proof
    needs: [frontend-linux-source-jit, provision-linux-dpcpp-cuda-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      proof_sha256: ${{ steps.retain-runtime-proof.outputs.proof_sha256 }}
      result_sha256: ${{ steps.retain-runtime-proof.outputs.result_sha256 }}
      bundle_sha256: ${{ steps.retain-runtime-proof.outputs.bundle_sha256 }}
      bundle_bytes: ${{ steps.retain-runtime-proof.outputs.bundle_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Test source-JIT handoff contracts
        timeout-minutes: 10
        run: node --test tests/native_ci.js tests/native_jit_sdk.js tests/native_dpcpp_sdk.js
      - name: Download same-run Linux source cohort
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-sdk-state-${{ github.run_id }}-${{ github.run_attempt }}-sources.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run DPC++ and CUDA inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-dpcpp-cuda-inputs-${{ github.run_id }}-${{ github.run_attempt }}.tar
          path: ${{ runner.temp }}/incoming
      - name: Download same-run GNU target headers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
