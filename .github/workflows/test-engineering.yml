name: Engineering Mode hashing

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  MOM_BUILD_JOBS: "4"
  MOM_PORTABLE_BUILD: "1"
  MOM_DEV_HOST: "1"
  MOM_GPU_BACKEND: opencl
  MOM_OPENCL_DEVICE_TYPE: cpu
  ONEAPI_DEVICE_SELECTOR: opencl:cpu
  MOM_LINUX_BUILD_COMPILER: dpcpp-opencl
  MOM_REQUIRE_PORTABLE_CPU_TESTS: "1"
  MOM_TEST_NO_POOL_NETWORK: "1"
  MOM_SKIP_MSR: "1"

jobs:
  hashing-linux:
    name: Node / CPU and portable SYCL (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm: true
          dev: base,node,oneapi,dpcpp
      - run: sudo pwsh -NoProfile -File scripts/ci/retry.ps1 -- bash scripts/install-opencl-cpu.sh
      - run: scripts/run-bounded-native-ci.sh npm run dev -- node tests/run-hash.js engineering

  windows-build:
    name: Build Windows ${{ matrix.scope }} Engineering input
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: cpu
            components: base,node,oneapi
            file: engineering-mom.node
          - scope: portable
            components: base,node,dpcpp
            file: engineering-dpcpp-opencl.zip
    outputs:
      node_sha256: ${{ steps.seal.outputs.node_sha256 }}
      runtime_sha256: ${{ steps.seal.outputs.runtime_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - shell: pwsh
        run: '& scripts/ci/retry.ps1 -Minutes 30 -- pwsh -NoProfile -File scripts/install-dev.ps1 -Component "${{ matrix.components }}" -Jobs 4'
      - shell: pwsh
        env:
          MOM_BUILD_JOBS: 4 # install-dev set it in-process when both ran in one step
        run: |
          & scripts/build-windows-multicompiler.ps1 -Scope ${{ matrix.scope }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - id: seal
        shell: pwsh
        run: scripts/ci/engineering-windows.ps1 -Action seal-${{ matrix.scope }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/${{ matrix.file }}
          archive: false
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  windows-engineering:
    name: Test Windows Engineering Mode
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MOM_NATIVE_DIR: ${{ github.workspace }}/build/win/compilers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm: true
      - shell: pwsh
        run: '& scripts/ci/retry.ps1 -- pwsh -NoProfile -File scripts/install-dev.ps1 -Component "base,node,opencl-cpu" -Jobs 4'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{engineering-mom.node,engineering-dpcpp-opencl.zip}"
          merge-multiple: true
          skip-decompress: true
          path: ${{ runner.temp }}/incoming
      - name: Verify producer hashes and stage the runtime without rebuilding
        shell: pwsh
        env:
          CPU_NODE_SHA256: ${{ needs.windows-build.outputs.node_sha256 }}
          PORTABLE_RUNTIME_SHA256: ${{ needs.windows-build.outputs.runtime_sha256 }}
        run: scripts/ci/engineering-windows.ps1 -Action stage
      - shell: pwsh
        run: |
          node tests/run-hash.js engineering
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
